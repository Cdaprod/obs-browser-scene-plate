<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>NLE Timeline Stage Preview</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    :root {
      --nle-bg: #0a0a0a;
      --nle-panel: #141b22;
      --nle-panel-strong: #1b242d;
      --nle-border: #263341;
      --nle-accent: #3b82f6;
      --nle-accent-strong: #2563eb;
      --nle-muted: #8fa3b8;
      --nle-playhead: #ef4444;
      --nle-segment: rgba(255, 255, 255, 0.08);
    }

    body {
      margin: 0;
      background: var(--nle-bg);
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .nle-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .nle-header {
      padding: 10px 14px;
      background: var(--nle-panel);
      border-bottom: 1px solid var(--nle-border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .nle-title {
      font-weight: 700;
      letter-spacing: 0.3px;
      font-size: 14px;
    }

    .nle-meta {
      font-size: 12px;
      color: var(--nle-muted);
      min-height: 16px;
    }

    .nle-preview {
      flex: 1 1 auto;
      min-height: 120px;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
    }

    .nle-frame {
      position: relative;
      flex: 1 1 auto;
      background: #03090f;
      border: 1px solid var(--nle-border);
      border-radius: 14px;
      overflow: hidden;
      min-height: 180px;
    }

    #baseVideo,
    #baseFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: 0;
      display: none;
    }

    #baseVideo.active,
    #baseFrame.active {
      display: block;
    }

    #overlayLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #overlayLayer > * {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .nle-status {
      font-size: 12px;
      color: var(--nle-muted);
      background: rgba(8, 12, 16, 0.7);
      border: 1px solid var(--nle-border);
      border-radius: 10px;
      padding: 8px 10px;
      min-height: 34px;
      display: flex;
      align-items: center;
    }

    .nle-timeline {
      background: var(--nle-panel);
      border-top: 1px solid var(--nle-border);
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
      max-height: 45vh;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .transport button {
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      min-height: 40px;
      min-width: 48px;
    }

    .transport .primary {
      background: var(--nle-accent);
      border-color: var(--nle-accent);
      color: #fff;
      font-weight: 600;
      flex: 1 1 auto;
    }

    .transport .primary:active {
      background: var(--nle-accent-strong);
    }

    .timecode {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--nle-muted);
      margin-left: auto;
      white-space: nowrap;
    }

    .scrubber {
      position: relative;
      height: 44px;
      border-radius: 10px;
      background: var(--nle-panel-strong);
      border: 1px solid var(--nle-border);
      overflow: hidden;
      touch-action: none;
    }

    .scrubber-segments {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: stretch;
      pointer-events: none;
      font-size: 10px;
      color: var(--nle-muted);
    }

    .scrubber-segment {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--nle-segment);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .scrubber-segment:last-child {
      border-right: 0;
    }

    .scrubber-progress {
      position: absolute;
      inset: 0;
      width: 0;
      background: rgba(59, 130, 246, 0.3);
      pointer-events: none;
    }

    .scrubber-playhead {
      position: absolute;
      top: -6px;
      width: 2px;
      height: calc(100% + 12px);
      background: var(--nle-playhead);
      pointer-events: none;
    }

    .scrubber-playhead::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--nle-playhead);
    }

    .node-track {
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 4px;
    }

    .node-track::-webkit-scrollbar {
      height: 6px;
    }

    .node-track::-webkit-scrollbar-thumb {
      background: #1b2733;
      border-radius: 4px;
    }

    .node-container {
      display: flex;
      gap: 8px;
      min-width: min-content;
      padding: 2px;
    }

    .node-clip {
      background: #121b24;
      border: 1px solid var(--nle-border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px;
      min-width: 84px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      touch-action: manipulation;
    }

    .node-clip:active {
      transform: scale(0.98);
    }

    .node-clip.active {
      border-color: var(--nle-accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
      background: #182636;
    }

    .node-index {
      font-size: 10px;
      color: var(--nle-muted);
      font-weight: 600;
    }

    .node-label {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-duration {
      font-size: 11px;
      color: var(--nle-muted);
      font-family: var(--mono);
    }

    .node-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--nle-muted);
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 380px) {
      .transport button {
        padding: 8px 10px;
      }

      .node-clip {
        min-width: 70px;
        padding: 8px;
      }

      .timecode {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="nle-app">
    <header class="nle-header">
      <div class="nle-title">NLE Timeline Stage Preview</div>
      <div class="nle-meta" id="stageMeta">Loading timeline…</div>
    </header>

    <section class="nle-preview">
      <div class="nle-frame">
        <video id="baseVideo" playsinline preload="metadata"></video>
        <iframe id="baseFrame" title="Base URL Preview" loading="eager"></iframe>
        <div id="overlayLayer"></div>
      </div>
      <div class="nle-status" id="stageStatus">Ready.</div>
    </section>

    <section class="nle-timeline">
      <div class="transport">
        <button id="btnPlay" class="primary" type="button">Play</button>
        <button id="btnPause" type="button">Pause</button>
        <button id="btnStop" type="button">Stop</button>
        <button id="btnRestart" type="button">Restart</button>
        <div class="timecode"><span id="statT">00:00.0</span> / <span id="statDur">00:00.0</span></div>
      </div>

      <div class="scrubber" id="timelineTrack" aria-label="Timeline scrubber">
        <div class="scrubber-progress" id="timelineProgress"></div>
        <div class="scrubber-segments" id="scrubberSegments"></div>
        <div class="scrubber-playhead" id="timelinePlayhead"></div>
      </div>

      <div class="node-track" id="nodeTrack">
        <div class="node-container" id="nodeContainer"></div>
      </div>

      <div class="node-meta">
        <div>Node <span id="statNode">—</span>/<span id="statTotal">—</span></div>
        <div>Total <span id="statTotalDuration">00:00.0</span></div>
      </div>
    </section>
  </div>

  <script src="./timeline-utils.js"></script>
  <script>
    const {
      classifyUrl,
      decodeTimelinePayload,
      getDurationHintSeconds,
      getPlaybackStartIndex,
      parseNodeText
    } = window.ProgramMonitorUtils || {};

    const DEFAULT_NODE_DURATION = 4;

    const elements = {
      baseVideo: document.getElementById("baseVideo"),
      baseFrame: document.getElementById("baseFrame"),
      overlayLayer: document.getElementById("overlayLayer"),
      statNode: document.getElementById("statNode"),
      statTotal: document.getElementById("statTotal"),
      statT: document.getElementById("statT"),
      statDur: document.getElementById("statDur"),
      statTotalDuration: document.getElementById("statTotalDuration"),
      stageMeta: document.getElementById("stageMeta"),
      stageStatus: document.getElementById("stageStatus"),
      timelineProgress: document.getElementById("timelineProgress"),
      timelinePlayhead: document.getElementById("timelinePlayhead"),
      timelineTrack: document.getElementById("timelineTrack"),
      scrubberSegments: document.getElementById("scrubberSegments"),
      nodeContainer: document.getElementById("nodeContainer"),
      nodeTrack: document.getElementById("nodeTrack")
    };

    const state = {
      nodes: [],
      activeIndex: 0,
      playing: false,
      stopRequested: false,
      nodeDurations: [],
      timelineDuration: 0,
      currentTime: 0,
      pausedAt: 0,
      basePausedAt: 0,
      scrubbing: false,
      scrubWasPlaying: false
    };

    let overlayVideos = [];
    let overlayAudios = [];
    let rafId = null;
    let baseEndedHandler = null;
    let activeBaseKind = "video";
    let baseStartTime = 0;

    function formatTime(seconds) {
      const safe = Number.isFinite(seconds) ? Math.max(seconds, 0) : 0;
      const mins = Math.floor(safe / 60);
      const secs = safe % 60;
      return `${String(mins).padStart(2, "0")}:${secs.toFixed(1).padStart(4, "0")}`;
    }

    function setStatus(text) {
      elements.stageStatus.textContent = text || "";
    }

    function setBaseKind(kind, url) {
      activeBaseKind = kind;
      elements.baseVideo.classList.remove("active");
      elements.baseFrame.classList.remove("active");
      if (kind === "page") {
        elements.baseVideo.pause();
        elements.baseVideo.removeAttribute("src");
        elements.baseFrame.classList.add("active");
        elements.baseFrame.src = url || "about:blank";
      } else {
        elements.baseFrame.removeAttribute("src");
        elements.baseVideo.classList.add("active");
      }
    }

    function clearLayers() {
      overlayVideos.forEach((video) => video.pause());
      overlayAudios.forEach((audio) => audio.pause());
      overlayVideos = [];
      overlayAudios = [];
      elements.overlayLayer.innerHTML = "";
    }

    function clearBaseHandlers() {
      if (baseEndedHandler) {
        elements.baseVideo.removeEventListener("ended", baseEndedHandler);
        baseEndedHandler = null;
      }
    }

    function loadVideoMeta(videoEl, url) {
      return new Promise((resolve, reject) => {
        const onLoaded = () => {
          cleanup();
          resolve(videoEl.duration || 0);
        };
        const onErr = () => {
          cleanup();
          reject(new Error(`Failed to load video metadata: ${url}`));
        };
        const cleanup = () => {
          videoEl.removeEventListener("loadedmetadata", onLoaded);
          videoEl.removeEventListener("error", onErr);
        };

        videoEl.addEventListener("loadedmetadata", onLoaded, { once: true });
        videoEl.addEventListener("error", onErr, { once: true });
        videoEl.src = url;
        videoEl.load();
      });
    }

    function resolveDurationInfo({ baseKind, baseUrl, overrideSeconds, baseDuration, durationHintSeconds }) {
      const override = Number.isFinite(overrideSeconds) && overrideSeconds > 0 ? overrideSeconds : 0;
      const base = Number.isFinite(baseDuration) && baseDuration > 0 ? baseDuration : 0;
      const hintValue = Number.isFinite(durationHintSeconds) ? durationHintSeconds : getDurationHintSeconds(baseUrl);
      const hint = Number.isFinite(hintValue) && hintValue > 0 ? hintValue : 0;

      if (baseKind === "page") {
        if (override) {
          return { duration: override, source: "override" };
        }
        if (hint) {
          return { duration: hint, source: "hint" };
        }
        return { duration: 0, source: "none" };
      }

      if (override) {
        return { duration: override, source: "override" };
      }
      if (base) {
        return { duration: base, source: "base" };
      }
      if (hint) {
        return { duration: hint, source: "hint" };
      }
      return { duration: 0, source: "none" };
    }

    function getNodeDurationEstimate(node) {
      const overrideSeconds = Number(node.durationOverride);
      if (Number.isFinite(overrideSeconds) && overrideSeconds > 0) {
        return overrideSeconds;
      }
      const parsed = parseNodeText(node.text);
      const hint = getDurationHintSeconds(parsed.baseUrl);
      if (Number.isFinite(hint) && hint > 0) {
        return hint;
      }
      return DEFAULT_NODE_DURATION;
    }

    function getNodeDuration(index) {
      if (!state.nodes[index]) {
        return DEFAULT_NODE_DURATION;
      }
      return state.nodeDurations[index] || getNodeDurationEstimate(state.nodes[index]);
    }

    function getTimelineOffset(index) {
      return state.nodes
        .slice(0, index)
        .reduce((sum, _, i) => sum + getNodeDuration(i), 0);
    }

    function updateTimelineDuration() {
      state.timelineDuration = state.nodes.reduce((total, _, index) => total + getNodeDuration(index), 0);
      elements.statTotalDuration.textContent = formatTime(state.timelineDuration);
    }

    function updateTimelineUI(currentTime) {
      const total = state.timelineDuration || 0;
      const progress = total > 0 ? Math.min(Math.max(currentTime / total, 0), 1) : 0;
      elements.timelineProgress.style.width = `${progress * 100}%`;
      elements.timelinePlayhead.style.left = `${progress * 100}%`;
      elements.statT.textContent = formatTime(currentTime);
      elements.statDur.textContent = formatTime(total);
      state.currentTime = currentTime;
    }

    function getNodeLabel(node, index) {
      const parsed = parseNodeText(node.text);
      if (!parsed.baseUrl) {
        return `Node ${index + 1}`;
      }
      try {
        if (parsed.baseUrl.includes("://")) {
          const url = new URL(parsed.baseUrl);
          const segments = url.pathname.split("/").filter(Boolean);
          return segments[segments.length - 1] || url.host || `Node ${index + 1}`;
        }
      } catch (error) {
        return parsed.baseUrl;
      }
      return parsed.baseUrl;
    }

    function renderScrubberSegments() {
      elements.scrubberSegments.innerHTML = "";
      const total = state.timelineDuration || 0;
      if (!total) {
        return;
      }

      state.nodes.forEach((_, index) => {
        const duration = getNodeDuration(index);
        const segment = document.createElement("div");
        segment.className = "scrubber-segment";
        segment.style.flex = `${duration} 0 0`;
        segment.textContent = String(index + 1);
        elements.scrubberSegments.appendChild(segment);
      });
    }

    function renderNodeTrack() {
      elements.nodeContainer.innerHTML = "";

      state.nodes.forEach((node, index) => {
        const clip = document.createElement("button");
        clip.type = "button";
        clip.className = "node-clip";
        if (index === state.activeIndex) {
          clip.classList.add("active");
        }

        const duration = getNodeDuration(index);
        const width = Math.max(84, Math.min(180, duration * 24));
        clip.style.width = `${width}px`;

        clip.innerHTML = `
          <div class="node-index">${index + 1}</div>
          <div class="node-label">${getNodeLabel(node, index)}</div>
          <div class="node-duration">${formatTime(duration)}</div>
        `;

        clip.addEventListener("click", () => {
          seekToTime(getTimelineOffset(index), { autoplay: state.playing });
        });

        elements.nodeContainer.appendChild(clip);
      });

      const activeClip = elements.nodeContainer.children[state.activeIndex];
      if (activeClip) {
        activeClip.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }
    }

    function stopPlayback() {
      state.stopRequested = true;
      state.playing = false;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      clearBaseHandlers();
      elements.baseVideo.pause();
      overlayVideos.forEach((video) => {
        video.pause();
      });
      overlayAudios.forEach((audio) => {
        audio.pause();
      });
    }

    function stopAll() {
      stopPlayback();
      state.activeIndex = 0;
      state.pausedAt = 0;
      state.basePausedAt = 0;
      elements.statNode.textContent = "—";
      updateTimelineUI(0);
      renderNodeTrack();
      setStatus("Stopped.");
    }

    function getBaseElapsed() {
      if (activeBaseKind === "page") {
        return state.basePausedAt || (performance.now() - baseStartTime) / 1000;
      }
      return elements.baseVideo.currentTime || 0;
    }

    function pauseAll() {
      if (!state.playing) {
        return;
      }
      state.playing = false;
      state.pausedAt = state.currentTime;
      state.basePausedAt = getBaseElapsed();
      elements.baseVideo.pause();
      overlayVideos.forEach((video) => video.pause());
      overlayAudios.forEach((audio) => audio.pause());
      setStatus("Paused.");
    }

    function syncOverlayPlayback(elapsedSeconds, shouldPlay) {
      overlayVideos.forEach((video) => {
        const duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 0;
        if (duration) {
          video.currentTime = elapsedSeconds % duration;
        } else {
          video.currentTime = elapsedSeconds;
        }
        if (shouldPlay) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });

      overlayAudios.forEach((audio) => {
        const duration = Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
        if (duration) {
          audio.currentTime = elapsedSeconds % duration;
        } else {
          audio.currentTime = elapsedSeconds;
        }
        if (shouldPlay) {
          audio.play().catch(() => {});
        } else {
          audio.pause();
        }
      });
    }

    async function primeNode(index) {
      clearLayers();
      clearBaseHandlers();

      const node = state.nodes[index];
      if (!node) {
        setBaseKind("video");
        elements.baseVideo.removeAttribute("src");
        elements.baseFrame.removeAttribute("src");
        return 0;
      }

      const parsed = parseNodeText(node.text);
      const overrideSeconds = Number(node.durationOverride);
      const durationHintSeconds = getDurationHintSeconds(parsed.baseUrl);
      const safeBaseUrl = parsed.baseUrl || "";
      const baseKind = safeBaseUrl === "about:blank" ? "page" : classifyUrl(safeBaseUrl);

      if (!safeBaseUrl) {
        setBaseKind("video");
        elements.baseVideo.removeAttribute("src");
        elements.baseFrame.removeAttribute("src");
        return 0;
      }

      if (baseKind === "page") {
        setBaseKind("page", safeBaseUrl);
      } else {
        setBaseKind("video", safeBaseUrl);
      }

      let duration = 0;
      if (baseKind !== "page") {
        elements.baseVideo.loop = false;
        elements.baseVideo.muted = false;
        elements.baseVideo.playsInline = true;
        elements.baseVideo.preload = "metadata";

        try {
          duration = await loadVideoMeta(elements.baseVideo, safeBaseUrl);
        } catch (error) {
          duration = 0;
        }
      }

      const resolvedDuration = resolveDurationInfo({
        baseKind,
        baseUrl: safeBaseUrl,
        overrideSeconds,
        baseDuration: duration,
        durationHintSeconds
      }).duration;

      const nodeDuration = resolvedDuration > 0 ? resolvedDuration : getNodeDurationEstimate(node);
      state.nodeDurations[index] = nodeDuration;
      updateTimelineDuration();
      renderScrubberSegments();
      renderNodeTrack();

      parsed.layers.forEach((url) => {
        const kind = classifyUrl(url);
        if (kind === "audio") {
          const audio = document.createElement("audio");
          audio.src = url;
          audio.loop = true;
          audio.preload = "auto";
          overlayAudios.push(audio);
          return;
        }

        if (kind === "image") {
          const image = document.createElement("img");
          image.src = url;
          image.alt = "";
          elements.overlayLayer.appendChild(image);
          return;
        }

        if (kind === "page") {
          const frame = document.createElement("iframe");
          frame.src = url;
          frame.title = "Overlay URL";
          frame.loading = "eager";
          frame.setAttribute("aria-hidden", "true");
          elements.overlayLayer.appendChild(frame);
          return;
        }

        const video = document.createElement("video");
        video.src = url;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.preload = "auto";
        elements.overlayLayer.appendChild(video);
        overlayVideos.push(video);
      });

      return nodeDuration;
    }

    async function startNodePlayback({ index, offsetSeconds = 0, resume = false } = {}) {
      state.stopRequested = false;
      state.playing = true;
      state.pausedAt = 0;
      state.basePausedAt = 0;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      const startIndex = getPlaybackStartIndex(index, state.nodes.length);
      if (startIndex === -1) {
        state.playing = false;
        setStatus("No nodes available.");
        return;
      }

      state.activeIndex = startIndex;
      const activeNode = state.nodes[state.activeIndex];
      const overrideSeconds = Number(activeNode.durationOverride);
      elements.statNode.textContent = String(state.activeIndex + 1);

      const nodeDuration = await primeNode(state.activeIndex);
      const parsed = parseNodeText(activeNode.text);
      const durationHintSeconds = getDurationHintSeconds(parsed.baseUrl);
      if (!parsed.baseUrl) {
        state.playing = false;
        setStatus("Missing base URL in this node.");
        return;
      }

      const baseKind = parsed.baseUrl === "about:blank" ? "page" : classifyUrl(parsed.baseUrl);
      activeBaseKind = baseKind;
      const safeOffset = Math.max(0, Math.min(offsetSeconds, nodeDuration || 0));

      if (baseKind !== "page") {
        if (!resume || !Number.isFinite(elements.baseVideo.currentTime)) {
          elements.baseVideo.currentTime = safeOffset || 0;
        }
        await elements.baseVideo.play().catch(() => {
          state.playing = false;
        });
      } else {
        baseStartTime = performance.now() - safeOffset * 1000;
      }

      syncOverlayPlayback(safeOffset, true);

      let advanced = false;
      const advance = () => {
        if (advanced) {
          return;
        }
        advanced = true;

        overlayVideos.forEach((video) => video.pause());
        overlayAudios.forEach((audio) => audio.pause());
        elements.baseVideo.pause();

        if (state.stopRequested) {
          state.playing = false;
          return;
        }

        if (state.activeIndex < state.nodes.length - 1) {
          state.activeIndex += 1;
          startNodePlayback({ index: state.activeIndex, offsetSeconds: 0 }).catch(() => {});
        } else {
          state.playing = false;
          setStatus("Reached end of timeline.");
        }
      };

      clearBaseHandlers();
      if (baseKind !== "page") {
        baseEndedHandler = () => {
          if (state.playing) {
            advance();
          }
        };
        elements.baseVideo.addEventListener("ended", baseEndedHandler);
      }

      const tick = () => {
        if (!state.playing) {
          return;
        }

        const current = activeBaseKind === "page"
          ? (performance.now() - baseStartTime) / 1000
          : (elements.baseVideo.currentTime || 0);

        const durationInfo = resolveDurationInfo({
          baseKind: activeBaseKind,
          baseUrl: parsed.baseUrl,
          overrideSeconds,
          baseDuration: elements.baseVideo.duration,
          durationHintSeconds
        });

        const duration = durationInfo.duration || nodeDuration;
        const timelineOffset = getTimelineOffset(state.activeIndex);
        updateTimelineUI(timelineOffset + Math.min(current, duration));

        const shouldAdvanceOnDuration = duration > 0
          && (activeBaseKind === "page" || durationInfo.source === "override");

        if (shouldAdvanceOnDuration && current >= duration - 0.05) {
          advance();
          return;
        }

        rafId = requestAnimationFrame(tick);
      };

      setStatus(`Playing node ${state.activeIndex + 1}.`);
      rafId = requestAnimationFrame(tick);
    }

    async function seekToTime(targetTime, { autoplay = false } = {}) {
      const clamped = Math.max(0, Math.min(targetTime, state.timelineDuration));
      let elapsed = 0;
      let targetIndex = 0;
      let offset = 0;

      for (let i = 0; i < state.nodes.length; i += 1) {
        const duration = getNodeDuration(i);
        if (clamped <= elapsed + duration) {
          targetIndex = i;
          offset = clamped - elapsed;
          break;
        }
        elapsed += duration;
      }

      stopPlayback();
      state.activeIndex = targetIndex;
      elements.statNode.textContent = String(targetIndex + 1);
      await primeNode(targetIndex);
      updateTimelineUI(clamped);
      renderNodeTrack();

      if (activeBaseKind !== "page") {
        elements.baseVideo.currentTime = offset;
      } else {
        baseStartTime = performance.now() - offset * 1000;
      }

      syncOverlayPlayback(offset, autoplay);

      if (autoplay) {
        startNodePlayback({ index: targetIndex, offsetSeconds: offset, resume: true }).catch(() => {});
      } else {
        setStatus(`Scrubbed to node ${targetIndex + 1}.`);
        state.pausedAt = clamped;
        state.basePausedAt = offset;
      }
    }

    function loadTimeline() {
      const params = new URLSearchParams(window.location.search);
      const data = params.get("data");
      const name = params.get("name");
      const payload = decodeTimelinePayload ? decodeTimelinePayload(data) : null;
      let fallback = null;
      try {
        const stored = window.localStorage.getItem("program-monitor.timeline.v1");
        fallback = stored ? JSON.parse(stored) : null;
      } catch (error) {
        fallback = null;
      }
      let timeline = payload && Array.isArray(payload.nodes) ? payload : fallback;

      if (!timeline || !Array.isArray(timeline.nodes) || !timeline.nodes.length) {
        timeline = {
          nodes: [
            { text: "about:blank", durationOverride: "4" },
            { text: "about:blank", durationOverride: "4" },
            { text: "about:blank", durationOverride: "4" }
          ]
        };
        setStatus("Using fallback nodes.");
      }

      state.nodes = timeline.nodes;
      state.activeIndex = 0;
      state.nodeDurations = state.nodes.map(getNodeDurationEstimate);
      updateTimelineDuration();
      renderScrubberSegments();
      elements.statTotal.textContent = String(state.nodes.length);
      elements.stageMeta.textContent = name
        ? `Project: ${name}`
        : `${state.nodes.length} nodes • ${formatTime(state.timelineDuration)}`;
    }

    function getTimeFromClientX(clientX) {
      const rect = elements.timelineTrack.getBoundingClientRect();
      const percent = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
      return percent * state.timelineDuration;
    }

    document.getElementById("btnPlay").addEventListener("click", () => {
      if (state.playing) {
        return;
      }
      if (state.pausedAt > 0) {
        startNodePlayback({ index: state.activeIndex, offsetSeconds: state.basePausedAt, resume: true }).catch(() => {});
      } else {
        startNodePlayback({ index: state.activeIndex, offsetSeconds: 0 }).catch(() => {});
      }
    });

    document.getElementById("btnPause").addEventListener("click", () => pauseAll());
    document.getElementById("btnStop").addEventListener("click", () => stopAll());
    document.getElementById("btnRestart").addEventListener("click", () => {
      stopAll();
      startNodePlayback({ index: 0, offsetSeconds: 0 }).catch(() => {});
    });

    elements.timelineTrack.addEventListener("pointerdown", (event) => {
      state.scrubbing = true;
      state.scrubWasPlaying = state.playing;
      elements.timelineTrack.setPointerCapture(event.pointerId);
      if (state.playing) {
        pauseAll();
      }
      seekToTime(getTimeFromClientX(event.clientX), { autoplay: false }).catch(() => {});
    });

    elements.timelineTrack.addEventListener("pointermove", (event) => {
      if (!state.scrubbing) {
        return;
      }
      seekToTime(getTimeFromClientX(event.clientX), { autoplay: false }).catch(() => {});
    });

    const finishScrub = () => {
      if (!state.scrubbing) {
        return;
      }
      state.scrubbing = false;
      if (state.scrubWasPlaying) {
        startNodePlayback({ index: state.activeIndex, offsetSeconds: state.basePausedAt, resume: true }).catch(() => {});
      }
    };

    elements.timelineTrack.addEventListener("pointerup", (event) => {
      elements.timelineTrack.releasePointerCapture(event.pointerId);
      finishScrub();
    });

    elements.timelineTrack.addEventListener("pointercancel", (event) => {
      elements.timelineTrack.releasePointerCapture(event.pointerId);
      finishScrub();
    });

    loadTimeline();

    if (state.nodes.length) {
      primeNode(0).catch(() => {});
      renderNodeTrack();
      updateTimelineUI(0);
    }
  </script>
</body>
</html>
