<!doctype html>
<!--
  Usage: /program-monitor/timeline_player.html?data=<BASE64>&autoplay=1&hud=0
  Example: /program-monitor/timeline_player.html?data=eyJ2ZXJzaW9uIjoxfQ==&autoplay=1&hud=0
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timeline Player</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      color: #e6edf3;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    .playerFrame {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #baseVideo,
    #baseImage,
    #baseFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #baseImage,
    #baseFrame {
      display: none;
    }

    #baseFrame {
      border: 0;
    }

    #overlayLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #overlayLayer video,
    #overlayLayer img,
    #overlayLayer iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hud {
      position: absolute;
      left: 16px;
      top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .hud.hidden {
      display: none;
    }

    .hudTitle {
      font-weight: 600;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="playerFrame">
    <video id="baseVideo" playsinline preload="metadata"></video>
    <img id="baseImage" alt="" />
    <iframe id="baseFrame" title="Base URL" loading="eager"></iframe>
    <div id="overlayLayer"></div>
    <div class="hud hidden" id="hud">
      <div class="hudTitle" id="hudTitle">Timeline Player</div>
      <div>Node: <span id="hudNode">—</span>/<span id="hudTotal">—</span></div>
      <div>t: <span id="hudTime">0.00</span>s / <span id="hudDur">0.00</span>s</div>
    </div>
  </div>

  <script src="./timeline-utils.js"></script>
  <script>
    const {
      classifyUrl,
      decodeTimelinePayload,
      getDurationHintSeconds,
      getPlaybackStartIndex,
      parseNodeText
    } = window.ProgramMonitorUtils || {};

    const DEFAULT_IMAGE_DURATION_SECONDS = 5;

    const elements = {
      baseVideo: document.getElementById("baseVideo"),
      baseImage: document.getElementById("baseImage"),
      baseFrame: document.getElementById("baseFrame"),
      overlayLayer: document.getElementById("overlayLayer"),
      hud: document.getElementById("hud"),
      hudTitle: document.getElementById("hudTitle"),
      hudNode: document.getElementById("hudNode"),
      hudTotal: document.getElementById("hudTotal"),
      hudTime: document.getElementById("hudTime"),
      hudDur: document.getElementById("hudDur")
    };

    const state = {
      nodes: [],
      activeIndex: 0,
      playing: false,
      stopRequested: false,
      durationInfo: { duration: 0, source: "none" }
    };

    let overlayVideos = [];
    let overlayAudios = [];
    let rafId = null;
    let baseEndedHandler = null;
    let activeBaseKind = "video";
    let baseStartTime = 0;

    function setBaseKind(kind, url) {
      activeBaseKind = kind;
      if (kind === "page" || kind === "image") {
        elements.baseVideo.pause();
        elements.baseVideo.removeAttribute("src");
        elements.baseVideo.style.display = "none";
        if (kind === "image") {
          elements.baseFrame.style.display = "none";
          elements.baseFrame.removeAttribute("src");
          elements.baseImage.style.display = "block";
          elements.baseImage.src = url || "";
        } else {
          elements.baseImage.style.display = "none";
          elements.baseImage.removeAttribute("src");
          elements.baseFrame.style.display = "block";
          elements.baseFrame.src = url || "about:blank";
        }
      } else {
        elements.baseFrame.removeAttribute("src");
        elements.baseFrame.style.display = "none";
        elements.baseImage.removeAttribute("src");
        elements.baseImage.style.display = "none";
        elements.baseVideo.style.display = "block";
      }
    }

    function clearLayers() {
      overlayVideos.forEach((video) => video.pause());
      overlayAudios.forEach((audio) => audio.pause());
      overlayVideos = [];
      overlayAudios = [];
      elements.overlayLayer.innerHTML = "";
    }

    function clearBaseHandlers() {
      if (baseEndedHandler) {
        elements.baseVideo.removeEventListener("ended", baseEndedHandler);
        baseEndedHandler = null;
      }
    }

    function loadVideoMeta(videoEl, url) {
      return new Promise((resolve, reject) => {
        const onLoaded = () => {
          cleanup();
          resolve(videoEl.duration || 0);
        };
        const onErr = () => {
          cleanup();
          reject(new Error(`Failed to load video metadata: ${url}`));
        };
        const cleanup = () => {
          videoEl.removeEventListener("loadedmetadata", onLoaded);
          videoEl.removeEventListener("error", onErr);
        };

        videoEl.addEventListener("loadedmetadata", onLoaded, { once: true });
        videoEl.addEventListener("error", onErr, { once: true });
        videoEl.src = url;
        videoEl.load();
      });
    }

    function resolveDurationInfo({ baseKind, baseUrl, overrideSeconds, baseDuration, durationHintSeconds }) {
      const override = Number.isFinite(overrideSeconds) && overrideSeconds > 0 ? overrideSeconds : 0;
      const base = Number.isFinite(baseDuration) && baseDuration > 0 ? baseDuration : 0;
      const hintValue = Number.isFinite(durationHintSeconds) ? durationHintSeconds : getDurationHintSeconds(baseUrl);
      const hint = Number.isFinite(hintValue) && hintValue > 0 ? hintValue : 0;

      if (baseKind === "image") {
        if (override) {
          return { duration: override, source: "override" };
        }
        return { duration: DEFAULT_IMAGE_DURATION_SECONDS, source: "default" };
      }

      if (baseKind === "page") {
        if (override) {
          return { duration: override, source: "override" };
        }
        if (hint) {
          return { duration: hint, source: "hint" };
        }
        return { duration: 0, source: "none" };
      }

      if (override) {
        return { duration: override, source: "override" };
      }
      if (base) {
        return { duration: base, source: "base" };
      }
      if (hint) {
        return { duration: hint, source: "hint" };
      }
      return { duration: 0, source: "none" };
    }

    function updateHud(current, duration) {
      if (!elements.hud || elements.hud.classList.contains("hidden")) {
        return;
      }
      elements.hudNode.textContent = state.activeIndex >= 0 ? String(state.activeIndex + 1) : "—";
      elements.hudTotal.textContent = state.nodes.length ? String(state.nodes.length) : "—";
      elements.hudTime.textContent = (Number.isFinite(current) ? current : 0).toFixed(2);
      elements.hudDur.textContent = (Number.isFinite(duration) ? duration : 0).toFixed(2);
    }

    async function primeNode(index) {
      clearLayers();
      clearBaseHandlers();

      const node = state.nodes[index];
      if (!node) {
        setBaseKind("video");
        elements.baseVideo.removeAttribute("src");
        elements.baseImage.removeAttribute("src");
        elements.baseFrame.removeAttribute("src");
        state.durationInfo = { duration: 0, source: "none" };
        updateHud(0, 0);
        return;
      }

      const parsed = parseNodeText(node.text);
      const overrideSeconds = Number(node.durationOverride);
      const baseKind = classifyUrl(parsed.baseUrl);
      const durationHintSeconds = getDurationHintSeconds(parsed.baseUrl);

      if (!parsed.baseUrl) {
        setBaseKind("video");
        elements.baseVideo.removeAttribute("src");
        elements.baseImage.removeAttribute("src");
        elements.baseFrame.removeAttribute("src");
        state.durationInfo = { duration: 0, source: "none" };
        updateHud(0, 0);
        return;
      }

      if (baseKind === "page" || baseKind === "image") {
        setBaseKind(baseKind, parsed.baseUrl);
      } else {
        setBaseKind("video", parsed.baseUrl);
      }

      let duration = 0;
      if (baseKind === "page" || baseKind === "image") {
        duration = resolveDurationInfo({
          baseKind,
          baseUrl: parsed.baseUrl,
          overrideSeconds,
          baseDuration: 0,
          durationHintSeconds
        }).duration;
      } else {
        elements.baseVideo.loop = false;
        elements.baseVideo.muted = false;
        elements.baseVideo.playsInline = true;
        elements.baseVideo.preload = "metadata";

        try {
          duration = await loadVideoMeta(elements.baseVideo, parsed.baseUrl);
        } catch (error) {
          duration = 0;
        }
      }

      state.durationInfo = resolveDurationInfo({
        baseKind,
        baseUrl: parsed.baseUrl,
        overrideSeconds,
        baseDuration: duration,
        durationHintSeconds
      });

      parsed.layers.forEach((url) => {
        const kind = classifyUrl(url);
        if (kind === "audio") {
          const audio = document.createElement("audio");
          audio.src = url;
          audio.loop = true;
          audio.preload = "auto";
          overlayAudios.push(audio);
          return;
        }

        if (kind === "image") {
          const image = document.createElement("img");
          image.src = url;
          image.alt = "";
          elements.overlayLayer.appendChild(image);
          return;
        }

        if (kind === "page") {
          const frame = document.createElement("iframe");
          frame.src = url;
          frame.title = "Overlay URL";
          frame.loading = "eager";
          frame.setAttribute("aria-hidden", "true");
          elements.overlayLayer.appendChild(frame);
          return;
        }

        const video = document.createElement("video");
        video.src = url;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.preload = "auto";
        elements.overlayLayer.appendChild(video);
        overlayVideos.push(video);
      });
    }

    async function playActive() {
      state.stopRequested = false;
      state.playing = true;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      const startIndex = getPlaybackStartIndex(state.activeIndex, state.nodes.length);
      if (startIndex === -1) {
        state.playing = false;
        return;
      }

      if (startIndex !== state.activeIndex) {
        state.activeIndex = startIndex;
      }

      const index = state.activeIndex;
      const overrideSeconds = Number(state.nodes[index].durationOverride);

      await primeNode(index);

      const parsed = parseNodeText(state.nodes[index].text);
      const durationHintSeconds = getDurationHintSeconds(parsed.baseUrl);
      if (!parsed.baseUrl) {
        state.playing = false;
        return;
      }

      const baseKind = classifyUrl(parsed.baseUrl);
      activeBaseKind = baseKind;
      baseStartTime = performance.now();

      overlayVideos.forEach((video) => {
        video.currentTime = 0;
        video.play().catch(() => {});
      });
      overlayAudios.forEach((audio) => {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      });

      if (baseKind !== "page" && baseKind !== "image") {
        elements.baseVideo.currentTime = 0;
        await elements.baseVideo.play().catch(() => {
          state.playing = false;
        });
      }

      let advanced = false;
      const advance = () => {
        if (advanced) {
          return;
        }
        advanced = true;

        overlayVideos.forEach((video) => video.pause());
        overlayAudios.forEach((audio) => audio.pause());
        elements.baseVideo.pause();

        if (state.stopRequested) {
          state.playing = false;
          return;
        }

        if (state.activeIndex < state.nodes.length - 1) {
          state.activeIndex += 1;
          playActive().catch(() => {});
        } else {
          state.playing = false;
        }
      };

      clearBaseHandlers();
      if (baseKind !== "page" && baseKind !== "image") {
        baseEndedHandler = () => {
          if (state.playing) {
            advance();
          }
        };
        elements.baseVideo.addEventListener("ended", baseEndedHandler);
      }

      const tick = () => {
        if (!state.playing) {
          return;
        }

        const current = activeBaseKind === "page" || activeBaseKind === "image"
          ? (performance.now() - baseStartTime) / 1000
          : (elements.baseVideo.currentTime || 0);

        const durationInfo = resolveDurationInfo({
          baseKind: activeBaseKind,
          baseUrl: parsed.baseUrl,
          overrideSeconds,
          baseDuration: elements.baseVideo.duration,
          durationHintSeconds
        });
        const duration = durationInfo.duration;

        updateHud(current, duration);

        const shouldAdvanceOnDuration = duration > 0
          && (activeBaseKind === "page" || activeBaseKind === "image" || durationInfo.source === "override");

        if (shouldAdvanceOnDuration && current >= duration - 0.05) {
          advance();
          return;
        }

        rafId = requestAnimationFrame(tick);
      };

      rafId = requestAnimationFrame(tick);
    }

    function loadTimeline() {
      const params = new URLSearchParams(window.location.search);
      const data = params.get("data");
      const name = params.get("name");
      const autoplay = params.get("autoplay") !== "0";
      const hudEnabled = params.get("hud") === "1" || params.get("hud") === "true";

      elements.hud.classList.toggle("hidden", !hudEnabled);
      if (name) {
        elements.hudTitle.textContent = name;
      }

      const payload = decodeTimelinePayload ? decodeTimelinePayload(data) : null;
      let fallback = null;
      try {
        const stored = window.localStorage.getItem("program-monitor.timeline.v1");
        fallback = stored ? JSON.parse(stored) : null;
      } catch (error) {
        fallback = null;
      }
      const timeline = payload && Array.isArray(payload.nodes) ? payload : fallback;

      if (!timeline || !Array.isArray(timeline.nodes) || !timeline.nodes.length) {
        console.warn("Missing timeline payload. Provide ?data= in the URL.");
        return { autoplay: false };
      }

      state.nodes = timeline.nodes;
      state.activeIndex = getPlaybackStartIndex(timeline.activeIndex ?? 0, state.nodes.length);
      return { autoplay };
    }

    const { autoplay } = loadTimeline();
    if (state.nodes.length && autoplay) {
      primeNode(state.activeIndex).catch(() => {});
      playActive().catch(() => {});
    }
  </script>
</body>
</html>
