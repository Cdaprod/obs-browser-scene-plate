<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Procedural Video URL Compiler</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="hdr">
      <div class="title">
        <div class="title-main">Procedural Video URL Compiler</div>
        <div class="title-sub">Program + Monitor for stacked URL nodes</div>
      </div>
      <div class="row">
        <button id="btnSave" type="button">Save</button>
        <button id="btnExport" type="button">Export JSON</button>
        <button id="btnImport" type="button">Import JSON</button>
        <button id="btnValidate" type="button">Validate</button>
        <button id="btnOpenBase" type="button">Open Base</button>
      </div>
    </header>

    <section class="stage">
      <div class="stageFrame">
        <video id="baseVideo" playsinline preload="metadata"></video>
        <div id="overlayLayer"></div>
        <div class="stageLabel">Video Preview (Stage)</div>
      </div>

      <div class="transport">
        <button id="btnPrev" type="button">⟵</button>
        <button id="btnStop" type="button">■</button>
        <button id="btnPlay" type="button">▶</button>
        <button id="btnPause" type="button">❚❚</button>
        <button id="btnNext" type="button">⟶</button>

        <div class="status">
          <div>Node: <span id="statNode">1</span>/<span id="statTotal">1</span></div>
          <div>t: <span id="statT">0.00</span>s / <span id="statDur">0.00</span>s</div>
        </div>
      </div>
      <div class="message" id="message"></div>
    </section>

    <section class="controls">
      <button id="btnAdd" type="button">Add Node</button>
      <button id="btnDelete" type="button">Delete Node</button>
    </section>

    <section class="nodes">
      <div id="nodeList"></div>
    </section>
  </div>

  <input id="fileImport" type="file" accept="application/json" hidden />
  <script type="module" src="./app.js"></script>
</body>
</html>
