<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Procedural Video URL Compiler</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="hdr">
      <div class="title">
        <div class="title-main">Procedural Video URL Compiler</div>
        <div class="title-sub">Program + Monitor for stacked URL nodes</div>
      </div>
      <div class="row">
        <button id="btnTogglePreview" class="pill" type="button">Preview</button>
        <button id="btnProjects" class="pill" type="button" aria-expanded="false" aria-controls="projectToolbar">Projects</button>
        <button id="btnOpenStage" class="pill" type="button">Open Stage</button>
        <button id="btnSave" type="button">Save</button>
        <button id="btnExport" type="button">Export JSON</button>
        <button id="btnImport" type="button">Import JSON</button>
        <button id="btnValidate" type="button">Validate</button>
        <button id="btnOpenBase" type="button">Open Base</button>
      </div>
    </header>

    <section class="projectToolbar hidden" id="projectToolbar" aria-hidden="true">
      <div class="projectRow">
        <label for="projectName">Project name</label>
        <input id="projectName" type="text" placeholder="e.g. Show Open v2" autocomplete="off" />
        <button id="projectSave" type="button">Save Project</button>
      </div>
      <div class="projectRow">
        <div class="projectLabel">Saved projects</div>
        <div class="projectList" id="projectList"></div>
      </div>
    </section>

    <div class="layout">
      <aside class="previewPanel" id="previewPanel">
        <div class="stage">
          <div class="stageFrame">
            <video id="baseVideo" playsinline preload="metadata"></video>
            <img id="baseImage" alt="" />
            <iframe id="baseFrame" title="Base URL Preview" loading="eager"></iframe>
            <div id="overlayLayer"></div>
            <div class="stageLabel">Video Preview (Stage)</div>
          </div>

          <div class="transport">
            <button id="btnPrev" type="button">⟵</button>
            <button id="btnStop" type="button">■</button>
            <button id="btnPlay" type="button">▶</button>
            <button id="btnPause" type="button">❚❚</button>
            <button id="btnNext" type="button">⟶</button>

            <div class="status">
              <div>Node: <span id="statNode">1</span>/<span id="statTotal">1</span></div>
              <div>Mode: <span id="statMode">All Nodes</span></div>
              <div>t: <span id="statT">0.00</span>s / <span id="statDur">0.00</span>s</div>
              <div>Duration: <span id="statDurSource">auto</span></div>
            </div>
          </div>
          <div class="message" id="message"></div>
        </div>
      </aside>

      <main class="mainPanel">
        <section class="controls">
          <button id="btnAdd" type="button">Add Node</button>
          <button id="btnDelete" type="button">Delete Node</button>
        </section>

        <section class="exports">
          <button id="btnExportNode" type="button">Export Node MOV</button>
          <button id="btnExportTimeline" type="button">Export Timeline MOV</button>
          <span class="exportStatus" id="exportStatus">Idle</span>
          <a class="exportLink hidden" id="downloadLink" download>Download MOV</a>
        </section>

        <section class="obsPanel" id="obsPanel" aria-label="OBS Control">
          <div class="obsHeader">
            <div>
              <div class="obsTitle">OBS Control</div>
              <div class="obsSub">Send the compiled timeline player URL to ASSET_MEDIA.</div>
            </div>
            <div class="obsHeaderActions">
              <button id="btnToggleObs" type="button" aria-expanded="false" aria-controls="obsPanelBody">Show OBS</button>
              <button id="btnSendTimelineObs" class="pill" type="button">Send Timeline → OBS</button>
            </div>
          </div>
          <div class="obsBody" id="obsPanelBody" aria-hidden="true">
            <div class="obsFields">
              <label>
                WebSocket URL
                <input id="obsAddress" type="text" placeholder="ws://localhost:4455" />
              </label>
              <label>
                Password
                <input id="obsPassword" type="password" placeholder="optional" />
              </label>
              <label>
                Scene name
                <input id="obsScene" type="text" placeholder="ASSET_SCENE" />
              </label>
              <label>
                Input name
                <input id="obsInput" type="text" placeholder="ASSET_MEDIA" />
              </label>
            </div>
            <div class="obsOptions">
              <label><input id="obsTakeScene" type="checkbox" /> Take scene after send</label>
              <label><input id="obsAutoplay" type="checkbox" checked /> Autoplay timeline</label>
              <label><input id="obsHud" type="checkbox" /> HUD overlay</label>
            </div>
          </div>
        </section>

        <section class="nodes">
          <div id="nodeList"></div>
        </section>
      </main>
    </div>
  </div>

  <input id="fileImport" type="file" accept="application/json" hidden />
  <script src="./obs-auth.js"></script>
  <script src="./timeline-utils.js"></script>
  <script src="./app.js" defer></script>
  <script type="module" src="./import_listener.js"></script>
</body>
</html>
