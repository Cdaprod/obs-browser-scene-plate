<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>transition-phone-bridge-plate-3</title>
  <style>
    :root {
      --accent: #b07cff;
      --plate-bg: rgba(8, 6, 14, 0.9);
      --text: rgba(246, 236, 255, 0.96);
      --muted: rgba(221, 202, 255, 0.7);
      --scale: 1;
      --x: 50%;
      --y: 50%;
      --blur: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: transparent;
      font-family: "SF Pro Text", "Inter", system-ui, -apple-system, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #loadingPlate {
      position: absolute;
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%) scale(var(--scale));
      min-width: min(84vw, 1040px);
      padding: clamp(18px, 2.6vw, 32px) clamp(20px, 3.8vw, 52px);
      background: var(--plate-bg);
      border: 1px solid color-mix(in srgb, var(--accent) 65%, transparent);
      border-radius: 20px;
      box-shadow:
        0 0 28px color-mix(in srgb, var(--accent) 24%, transparent),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      filter: blur(var(--blur));
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    #loadingPlate.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loadingPlate::before,
    #loadingPlate::after {
      content: "";
      position: absolute;
      left: 20px;
      right: 20px;
      height: 1px;
      background: color-mix(in srgb, var(--accent) 55%, transparent);
      opacity: 0.7;
    }

    #loadingPlate::before {
      top: 18px;
    }

    #loadingPlate::after {
      bottom: 18px;
    }

    .label {
      font-size: clamp(20px, 2.2vw, 36px);
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .sub {
      margin-top: 12px;
      font-size: clamp(12px, 1.2vw, 18px);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .indicator {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .indicator span {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 70%, transparent);
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent);
      animation: pulse 1.35s infinite ease-in-out;
    }

    .indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.85);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
      }
      100% {
        transform: scale(0.85);
        opacity: 0.4;
      }
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    iframe.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loadingPlate">
    <div class="label" id="label"></div>
    <div class="sub" id="sub"></div>
    <div class="indicator" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
  <iframe id="phoneFrame" class="hidden" title="Phone bridge plate variant 3"></iframe>

  <script>
    /**
     * transition_phone_bridge_plate_3.html — phone bridge plate (variant 3)
     *
     * Default URL (full params): http://<HOST_IP>:8789/transitions/transition_phone_bridge_plate_3.html?label=BRIDGING%20PHONE&sub=LINK%20ESTABLISHED&accent=b07cff&bg=08060e&alpha=0.9&scale=1&x=50&y=50&blur=0&loading=3.5&tilt=-12
     *
     * Params:
     *  label=TEXT      (loading headline)
     *  sub=TEXT        (loading sub label)
     *  accent=HEX      (accent color without #)
     *  bg=HEX          (loading plate background without #)
     *  alpha=0..1      (loading plate background alpha)
     *  scale=0.5..2    (overall scale)
     *  x=0..100        (horizontal position percentage)
     *  y=0..100        (vertical position percentage)
     *  loading=0..10   (loading duration seconds)
     *  tilt=-45..45    (rotation angle)
     *  blur=0..20      (blur px)
     */

    const srcPath = "/transitions/transition_phone_bridge_plate_src.html";
    const defaults = {
      label: "BRIDGING PHONE",
      sub: "LINK ESTABLISHED",
      accent: "b07cff",
      bg: "08060e",
      alpha: "0.9",
      scale: "1",
      x: "50",
      y: "50",
      loading: "3.5",
      tilt: "-12",
      blur: "0"
    };

    const params = new URLSearchParams(window.location.search);
    Object.entries(defaults).forEach(([key, value]) => {
      if (!params.has(key)) {
        params.set(key, value);
      }
    });

    const label = (params.get("label") || defaults.label).slice(0, 48);
    const sub = (params.get("sub") || defaults.sub).slice(0, 64);
    const accent = sanitizeHex(params.get("accent") || defaults.accent);
    const bg = sanitizeHex(params.get("bg") || defaults.bg);
    const alpha = clamp(parseFloat(params.get("alpha") || defaults.alpha), 0, 1);
    const scale = clamp(parseFloat(params.get("scale") || defaults.scale), 0.5, 2);
    const x = clamp(parseFloat(params.get("x") || defaults.x), 0, 100);
    const y = clamp(parseFloat(params.get("y") || defaults.y), 0, 100);
    const blur = clamp(parseFloat(params.get("blur") || defaults.blur), 0, 20);
    const tilt = clamp(parseFloat(params.get("tilt") || defaults.tilt), -45, 45);
    const loadingSeconds = clamp(parseFloat(params.get("loading") || defaults.loading), 0, 10);

    document.getElementById("label").textContent = label;
    document.getElementById("sub").textContent = sub;

    const root = document.documentElement;
    root.style.setProperty("--accent", `#${accent}`);
    root.style.setProperty("--plate-bg", `rgba(${hexToRgb(bg).join(", ")}, ${alpha})`);
    root.style.setProperty("--scale", scale.toString());
    root.style.setProperty("--x", `${x}%`);
    root.style.setProperty("--y", `${y}%`);
    root.style.setProperty("--blur", `${blur}px`);

    const body = sanitizeHex(params.get("body") || bg);
    const glow = sanitizeHex(params.get("glow") || accent);
    const glowAlpha = clamp(parseFloat(params.get("glowAlpha") || String(alpha)), 0, 1);

    ["label", "sub", "bg", "alpha", "loading"].forEach((key) => params.delete(key));
    params.set("accent", accent);
    params.set("body", body);
    params.set("glow", glow);
    params.set("glowAlpha", glowAlpha.toString());
    params.set("scale", scale.toString());
    params.set("x", x.toString());
    params.set("y", y.toString());
    params.set("tilt", tilt.toString());
    params.set("blur", blur.toString());

    const srcUrl = new URL(srcPath, window.location.origin);
    srcUrl.search = params.toString();
    if (window.location.hash && !srcUrl.hash) {
      srcUrl.hash = window.location.hash;
    }

    const phoneFrame = document.getElementById("phoneFrame");
    phoneFrame.src = srcUrl.toString();

    const loadingPlate = document.getElementById("loadingPlate");
    if (loadingSeconds <= 0) {
      loadingPlate.classList.add("hidden");
      phoneFrame.classList.remove("hidden");
    } else {
      window.setTimeout(() => {
        loadingPlate.classList.add("hidden");
        phoneFrame.classList.remove("hidden");
      }, loadingSeconds * 1000);
    }

    function sanitizeHex(value) {
      const cleaned = (value || "").replace(/[^0-9a-f]/gi, "").toLowerCase();
      if (cleaned.length === 3) {
        return cleaned
          .split("")
          .map((char) => `${char}${char}`)
          .join("");
      }
      if (cleaned.length >= 6) {
        return cleaned.slice(0, 6);
      }
      return "000000";
    }

    function hexToRgb(hex) {
      const safe = sanitizeHex(hex);
      const r = parseInt(safe.slice(0, 2), 16);
      const g = parseInt(safe.slice(2, 4), 16);
      const b = parseInt(safe.slice(4, 6), 16);
      return [r, g, b];
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }
  </script>
</body>
</html>
