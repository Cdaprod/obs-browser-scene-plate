<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>glitch-wipe-lastframe</title>
  <style>
    :root{
      --bg-alpha: 0;
      --fade-in-ms: 16;
      --fade-out-ms: 160;
    }
    html, body{ height:100%; margin:0; background: rgba(0,0,0,var(--bg-alpha)); overflow:hidden; }
    #wrap{
      position:absolute; inset:0;
      opacity:0;
      transition: opacity calc(var(--fade-in-ms)*1ms) linear;
      will-change: opacity;
    }
    canvas{ position:absolute; inset:0; width:100%; height:100%; transform: translateZ(0); }
    .on #wrap{ opacity:1; }
    .off #wrap{ opacity:0; transition: opacity calc(var(--fade-out-ms)*1ms) linear; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
  </div>

  <script>
    /**
     * glitch_wipe_lastframe.html
     *
     * Requires: lastframe.jpg in same folder (or set img=... param)
     *
     * Default URL (full params):
     *  http://<HOST_IP>:8789/transitions/glitch_wipe_lastframe.html?mode=burst&ms=650&int=0.9&dir=lr&band=0.22&feather=0.12&img=lastframe.jpg
     *
     * Params:
     *  ms=650            duration
     *  int=0..1          intensity
     *  dir=lr|rl|tb|bt   wipe direction
     *  band=0.22         band thickness fraction
     *  feather=0.12      edge softness fraction of band
     *  img=lastframe.jpg image file name/path
     *  mode=burst|loop
     */

    const qs = new URLSearchParams(location.search);
    const MODE = (qs.get("mode") || "burst").toLowerCase();
    const MS   = clamp(parseFloat(qs.get("ms") || "650"), 120, 8000);
    const INT  = clamp(parseFloat(qs.get("int") || "0.9"), 0, 1);
    const DIR  = (qs.get("dir") || "lr").toLowerCase();
    const BAND = clamp(parseFloat(qs.get("band") || "0.22"), 0.08, 0.60);
    const FEAT = clamp(parseFloat(qs.get("feather") || "0.12"), 0.0, 0.5);
    const IMG  = (qs.get("img") || "lastframe.jpg");

    function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
    function lerp(a,b,t){ return a + (b-a)*t; }
    function smoothstep(a,b,x){
      const t = clamp((x-a)/(b-a), 0, 1);
      return t*t*(3-2*t);
    }

    // RNG
    let seed = (Date.now() & 0x7fffffff) >>> 0;
    function rnd(){
      seed ^= seed << 13; seed >>>= 0;
      seed ^= seed >> 17; seed >>>= 0;
      seed ^= seed << 5;  seed >>>= 0;
      return (seed >>> 0) / 4294967296;
    }
    function rndi(a,b){ return (a + Math.floor(rnd()*(b-a+1)))|0; }

    const c = document.getElementById("c");
    const ctx = c.getContext("2d", { alpha:true, desynchronized:true });

    function fit(){
      const dpr = Math.min(2, devicePixelRatio || 1);
      c.width  = Math.floor(innerWidth * dpr);
      c.height = Math.floor(innerHeight * dpr);
      c.style.width = "100%";
      c.style.height = "100%";
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    addEventListener("resize", fit, { passive:true });
    fit();

    // Load last frame image
    const img = new Image();
    img.src = IMG + (IMG.includes("?") ? "" : ("?v=" + Date.now())); // cache-bust for OBS refresh
    img.crossOrigin = "anonymous";

    // Intensity knobs
    const I = INT;
    const noiseAlpha = lerp(0.18, 0.75, I);
    const jitterPx   = lerp(1, 10, I);
    const sliceChance= lerp(0.16, 0.50, I);
    const flashChance= lerp(0.04, 0.14, I);
    const chromaPx   = lerp(1, 6, I);

    function bandRect(p){
      const w = innerWidth, h = innerHeight;
      if (DIR === "lr" || DIR === "rl"){
        const bw = w * BAND;
        const f  = bw * FEAT;
        const lead = (DIR === "lr") ? (p*(w+bw)-bw) : ((1-p)*(w+bw)-bw);
        return { axis:"x", x: lead, y:0, bw, bh:h, f, w, h };
      } else {
        const bh = h * BAND;
        const f  = bh * FEAT;
        const lead = (DIR === "tb") ? (p*(h+bh)-bh) : ((1-p)*(h+bh)-bh);
        return { axis:"y", x:0, y: lead, bw:w, bh, f, w, h };
      }
    }

    function drawMask(b){
      ctx.save();
      if (b.axis === "x"){
        const left = b.x, right = b.x + b.bw, f = Math.max(1, b.f);
        ctx.beginPath();
        ctx.rect(Math.floor(left - f), 0, Math.floor(b.bw + 2*f), Math.floor(b.h));
        ctx.clip();
        const g = ctx.createLinearGradient(left - f, 0, right + f, 0);
        g.addColorStop(0, "rgba(255,255,255,0)");
        g.addColorStop(smoothstep(0,1,(f/(b.bw+2*f))), "rgba(255,255,255,1)");
        g.addColorStop(1 - smoothstep(0,1,(f/(b.bw+2*f))), "rgba(255,255,255,1)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(Math.floor(left - f), 0, Math.floor(b.bw + 2*f), Math.floor(b.h));
      } else {
        const top = b.y, bot = b.y + b.bh, f = Math.max(1, b.f);
        ctx.beginPath();
        ctx.rect(0, Math.floor(top - f), Math.floor(b.w), Math.floor(b.bh + 2*f));
        ctx.clip();
        const g = ctx.createLinearGradient(0, top - f, 0, bot + f);
        g.addColorStop(0, "rgba(255,255,255,0)");
        g.addColorStop(smoothstep(0,1,(f/(b.bh+2*f))), "rgba(255,255,255,1)");
        g.addColorStop(1 - smoothstep(0,1,(f/(b.bh+2*f))), "rgba(255,255,255,1)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, Math.floor(top - f), Math.floor(b.w), Math.floor(b.bh + 2*f));
      }
      ctx.restore();
    }

    function drawNoiseInBand(b){
      // coarse noise into band bounds
      const x = Math.floor((b.axis==="x") ? (b.x - b.f) : 0);
      const y = Math.floor((b.axis==="y") ? (b.y - b.f) : 0);
      const W = Math.max(1, Math.floor((b.axis==="x") ? (b.bw + 2*b.f) : b.w));
      const H = Math.max(1, Math.floor((b.axis==="y") ? (b.bh + 2*b.f) : b.h));

      const step = 2;
      const imgd = ctx.createImageData(W, H);
      const data = imgd.data;
      for (let yy=0; yy<H; yy+=step){
        for (let xx=0; xx<W; xx+=step){
          const v = (rnd()*255)|0;
          const a = (rnd()*255*noiseAlpha)|0;
          for (let y2=0;y2<step;y2++){
            for (let x2=0;x2<step;x2++){
              const i = ((yy+y2)*W + (xx+x2))*4;
              data[i]=v; data[i+1]=v; data[i+2]=v; data[i+3]=a;
            }
          }
        }
      }
      ctx.putImageData(imgd, x, y);
    }

    function tearInBand(b){
      const x = Math.max(0, Math.floor(b.x));
      const y = Math.max(0, Math.floor(b.y));
      const bw = Math.floor((b.axis==="x") ? b.bw : b.w);
      const bh = Math.floor((b.axis==="y") ? b.bh : b.h);
      const slices = rndi(3, 9);
      for (let s=0; s<slices; s++){
        if (rnd() > sliceChance) continue;
        const sy = y + rndi(0, Math.max(0, bh-1));
        const sh = rndi(6, Math.floor(lerp(16, 64, I)));
        const dx = rndi(-Math.floor(jitterPx), Math.floor(jitterPx));
        ctx.globalAlpha = lerp(0.55, 0.95, rnd());
        ctx.drawImage(c, x, sy, bw, sh, x+dx, sy + rndi(-2,2), bw, sh);
      }
      ctx.globalAlpha = 1;
    }

    function chroma(b){
      const x = Math.max(0, Math.floor(b.x));
      const y = Math.max(0, Math.floor(b.y));
      const bw = Math.floor((b.axis==="x") ? b.bw : b.w);
      const bh = Math.floor((b.axis==="y") ? b.bh : b.h);
      ctx.globalCompositeOperation = "screen";
      ctx.globalAlpha = 0.20 * I;
      if (b.axis === "x"){
        ctx.drawImage(c, x - chromaPx, y, bw, bh, x, y, bw, bh);
        ctx.drawImage(c, x + chromaPx, y, bw, bh, x, y, bw, bh);
      } else {
        ctx.drawImage(c, x, y - chromaPx, bw, bh, x, y, bw, bh);
        ctx.drawImage(c, x, y + chromaPx, bw, bh, x, y, bw, bh);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }

    function flash(){
      if (rnd() < flashChance){
        ctx.fillStyle = `rgba(255,255,255,${lerp(0.03, 0.16, I)})`;
        ctx.fillRect(0,0,innerWidth,innerHeight);
      }
    }

    function microJitter(){
      const x = rndi(-Math.floor(jitterPx), Math.floor(jitterPx));
      const y = rndi(-Math.floor(jitterPx/2), Math.floor(jitterPx/2));
      c.style.transform = `translate(${x}px, ${y}px)`;
      c.style.filter = `contrast(${lerp(1.02, 1.14, I).toFixed(2)}) saturate(${lerp(1.02, 1.18, I).toFixed(2)})`;
    }

    function setOn(){
      document.body.classList.add("on");
      document.body.classList.remove("off");
    }
    function setOff(){
      document.body.classList.add("off");
      document.body.classList.remove("on");
      ending = true;
    }

    let start = performance.now();
    let ending = false;
    const frameInterval = 1000 / 60;
    let lastFrame = 0;

    function tick(t){
      if (t - lastFrame < frameInterval && !ending){
        requestAnimationFrame(tick);
        return;
      }
      lastFrame = t;

      const elapsed = t - start;
      const p = (MODE === "loop") ? ((elapsed % MS) / MS) : clamp(elapsed / MS, 0, 1);

      ctx.clearRect(0,0,innerWidth,innerHeight);

      // 1) Create band alpha mask
      const b = bandRect(p);
      drawMask(b);

      // 2) Inside mask, draw the last-frame image (revealed in the wipe band)
      ctx.globalCompositeOperation = "source-in";
      if (img.complete && img.naturalWidth){
        // cover fit
        const iw = img.naturalWidth, ih = img.naturalHeight;
        const sw = innerWidth, sh = innerHeight;
        const scale = Math.max(sw/iw, sh/ih);
        const dw = iw * scale, dh = ih * scale;
        const dx = (sw - dw)/2, dy = (sh - dh)/2;
        ctx.drawImage(img, dx, dy, dw, dh);
      } else {
        // fallback: dim transparent fill until image loads
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.fillRect(0,0,innerWidth,innerHeight);
      }

      // 3) Add noise/slices on top (still constrained to band)
      ctx.globalCompositeOperation = "source-atop";
      drawNoiseInBand(b);
      tearInBand(b);

      // 4) Overlays
      ctx.globalCompositeOperation = "source-over";
      chroma(b);
      flash();
      microJitter();

      if (MODE === "burst" && !ending && elapsed >= MS){
        setOff();
        return;
      }
      requestAnimationFrame(tick);
    }

    setOn();
    requestAnimationFrame(tick);

    addEventListener("pointerdown", ()=>{
      seed = (Date.now() & 0x7fffffff) >>> 0;
      start = performance.now();
      ending = false;
      document.body.classList.remove("off");
      document.body.classList.add("on");
      // force reload
      img.src = IMG + (IMG.includes("?") ? "" : ("?v=" + Date.now()));
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
