<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>glitch</title>
  <style>
    :root{
      /* Default behavior (can be overridden via query params) */
      --fade-in-ms: 20;
      --fade-out-ms: 120;
      --bg-alpha: 0;         /* keep 0 for transparent */
      --scanline-alpha: 0.18;
      --vignette-alpha: 0.55;
      --crt-warp: 0.012;     /* subtle barrel warp */
    }

    html, body { height: 100%; margin: 0; background: rgba(0,0,0,var(--bg-alpha)); overflow: hidden; }
    body { position: relative; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

    /* Canvas renders the glitch overlay (alpha-based, so it can sit on top of your scene) */
    #c {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity calc(var(--fade-in-ms) * 1ms) linear;
      will-change: opacity, transform, filter;
    }

    /* Scanlines layer */
    #scanlines {
      position: absolute; inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,var(--scanline-alpha)) 0px,
          rgba(255,255,255,0) 2px,
          rgba(0,0,0,0) 4px
        );
      mix-blend-mode: overlay;
      opacity: 0;
      transition: opacity calc(var(--fade-in-ms) * 1ms) linear;
    }

    /* CRT vignette + slight chroma vibe */
    #vignette {
      position: absolute; inset: -10%;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0) 30%,
        rgba(0,0,0,var(--vignette-alpha)) 75%,
        rgba(0,0,0,0.95) 100%
      );
      opacity: 0;
      transition: opacity calc(var(--fade-in-ms) * 1ms) linear;
      mix-blend-mode: multiply;
      filter: blur(0.6px);
    }

    /* Optional ARG text flashes */
    #msg {
      position: absolute;
      left: 4.2%;
      top: 6%;
      color: rgba(220,255,220,0.92);
      text-shadow:
        0 0 6px rgba(150,255,170,0.45),
        -2px 0 rgba(255,0,0,0.25),
        2px 0 rgba(0,180,255,0.25);
      letter-spacing: 0.06em;
      font-size: clamp(14px, 2.0vw, 30px);
      opacity: 0;
      transform: translateY(-2px);
      user-select: none;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    /* “Signal lost” block */
    #block {
      position: absolute;
      left: 0; right: 0;
      top: 0; bottom: 0;
      opacity: 0;
      pointer-events: none;
      background: rgba(0,0,0,0.0);
    }

    /* When active, everything ramps in quickly */
    .on #c, .on #scanlines, .on #vignette { opacity: 1; }
    .on #msg { opacity: 1; transform: translateY(0); }

    /* When ending, fade out */
    .off #c, .off #scanlines, .off #vignette, .off #msg { opacity: 0; transition: opacity calc(var(--fade-out-ms) * 1ms) linear; }

    /* Subtle CRT warp */
    .warp #c {
      transform: perspective(800px) translateZ(0) scale(1.02);
      filter: contrast(1.06) saturate(1.08);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="block"></div>
  <div id="msg"></div>

  <!-- OPTIONAL: If you want audio from the Browser Source:
       1) Put a file next to glitch.html, e.g. glitch.wav
       2) Uncomment below and set the src
       Note: OBS Browser Source audio requires "Control Audio via OBS" / audio monitoring settings. -->
  <!-- <audio id="sfx" src="./glitch.wav" preload="auto"></audio> -->

  <script>
    /**
     * OBS Browser Source “ARG Glitch” overlay.
     *
     * Default URL (full params):
     *  http://<HOST_IP>:8789/transitions/glitch.html?mode=burst&ms=1200&int=0.85&fps=60&theme=lost&msg=SIGNAL%20LOST
     *
     * URL query params (examples):
     *  glitch.html?mode=burst&ms=650&int=0.95&msg=SIGNAL%20LOST
     *  glitch.html?mode=loop&int=0.55
     *  glitch.html?mode=burst&ms=420&theme=hijack&msg=UNAUTHORIZED%20BROADCAST
     *
     * Params:
     *  mode   = "burst" | "loop"   (default burst)
     *  ms     = duration for burst (default 600)
     *  int    = intensity 0..1     (default 0.85)
     *  fps    = target fps         (default 60)
     *  msg    = optional overlay text (default depends on theme)
     *  theme  = "lost" | "hijack" | "corrupt" (default lost)
     *  seed   = integer for repeatable randomness
     */

    const qs = new URLSearchParams(location.search);
    const MODE  = (qs.get("mode") || "burst").toLowerCase();
    const MS    = clampNum(parseFloat(qs.get("ms") || "1200"), 120, 8000);
    const INT   = clampNum(parseFloat(qs.get("int") || "0.85"), 0, 1);
    const FPS   = clampNum(parseFloat(qs.get("fps") || "60"), 10, 120);
    const THEME = (qs.get("theme") || "lost").toLowerCase();
    const SEED0 = (qs.get("seed") ? parseInt(qs.get("seed"), 10) : (Date.now() & 0x7fffffff)) >>> 0;

    const MSG_EL = document.getElementById("msg");
    const msgDefault =
      THEME === "hijack"  ? "UNAUTHORIZED BROADCAST" :
      THEME === "corrupt" ? "MEMORY CORRUPTION" :
                            "SIGNAL LOST";
    const MSG = (qs.get("msg") || msgDefault).slice(0, 64);
    MSG_EL.textContent = MSG;

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
    const block = document.getElementById("block");

    // Optional audio
    const sfx = document.getElementById("sfx");
    let audioPrimed = false;

    // RNG (xorshift32) for deterministic chaos
    let seed = SEED0;
    function rnd() {
      seed ^= seed << 13; seed >>>= 0;
      seed ^= seed >> 17; seed >>>= 0;
      seed ^= seed << 5;  seed >>>= 0;
      return (seed >>> 0) / 4294967296;
    }
    function rndi(a, b) { return (a + Math.floor(rnd() * (b - a + 1))) | 0; }
    function clampNum(x, a, b){ return Math.max(a, Math.min(b, x)); }

    // Resize
    function fit() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width  = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", fit, { passive: true });
    fit();

    // Visual knobs derived from intensity + theme
    const themeMul =
      THEME === "hijack"  ? 1.05 :
      THEME === "corrupt" ? 1.15 : 1.0;

    const I = clampNum(INT * themeMul, 0, 1);
    const sliceChance   = lerp(0.12, 0.42, I);  // frequency of horizontal tear slices
    const flashChance   = lerp(0.05, 0.18, I);  // white flashes
    const blockChance   = lerp(0.02, 0.08, I);  // full-frame “signal drop”
    const chromaShiftPx = lerp(1, 6, I);
    const jitterPx      = lerp(1, 12, I);
    const noiseAlpha    = lerp(0.18, 0.75, I);

    function lerp(a,b,t){ return a + (b-a)*t; }

    // Prebuild noise row for speed
    let lastNoiseT = 0;
    function drawNoise(w, h, t) {
      // Update noise at ~24fps-ish even if rendering faster
      if (t - lastNoiseT < 42) return;
      lastNoiseT = t;

      const img = ctx.createImageData(w, h);
      const data = img.data;
      // Coarse noise (fast) — step pixels in 2x2 blocks
      const step = 2;
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const v = (rnd() * 255) | 0;
          const a = (rnd() * 255 * noiseAlpha) | 0;
          for (let yy = 0; yy < step; yy++) {
            for (let xx = 0; xx < step; xx++) {
              const i = ((y + yy) * w + (x + xx)) * 4;
              data[i+0] = v;
              data[i+1] = v;
              data[i+2] = v;
              data[i+3] = a;
            }
          }
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    function chromaGhost(w, h) {
      // Cheap chroma split: draw shifted copies with low alpha
      ctx.globalCompositeOperation = "screen";
      ctx.globalAlpha = 0.32 * I;

      // Red channel-ish overlay
      ctx.drawImage(canvas, -chromaShiftPx, 0, w, h);
      // Blue channel-ish overlay
      ctx.drawImage(canvas,  chromaShiftPx, 0, w, h);

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }

    function tearSlices(w, h) {
      const slices = rndi(2, 8);
      for (let s = 0; s < slices; s++) {
        if (rnd() > sliceChance) continue;

        const y = rndi(0, h-1);
        const sliceH = rndi(6, Math.floor(lerp(18, 70, I)));
        const dx = rndi(-Math.floor(jitterPx), Math.floor(jitterPx));

        // Copy a band and re-draw it offset
        ctx.globalAlpha = lerp(0.55, 0.95, rnd());
        ctx.drawImage(canvas,
          0, y, w, sliceH,
          dx, y + rndi(-2, 2), w, sliceH
        );

        // Add a thin bright line sometimes
        if (rnd() < 0.35 * I) {
          ctx.fillStyle = `rgba(255,255,255,${lerp(0.05, 0.22, I)})`;
          ctx.fillRect(0, y + rndi(0, 2), w, 1);
        }
      }
      ctx.globalAlpha = 1;
    }

    function flash(w, h) {
      if (rnd() < flashChance) {
        ctx.fillStyle = `rgba(255,255,255,${lerp(0.04, 0.16, I)})`;
        ctx.fillRect(0, 0, w, h);
      }
    }

    function signalDrop() {
      // “Signal lost” block: rapid opacity spikes
      if (rnd() < blockChance) {
        block.style.opacity = String(lerp(0.25, 0.85, rnd()));
        block.style.background = rnd() < 0.5 ? "rgba(0,0,0,0.85)" : "rgba(255,255,255,0.10)";
        setTimeout(() => { block.style.opacity = "0"; }, rndi(40, 140));
      }
    }

    function msgFlicker() {
      // Text flicker + micro-jitter
      const o = (rnd() < 0.35) ? lerp(0.25, 0.95, rnd()) : 1;
      MSG_EL.style.opacity = String(o * lerp(0.4, 1.0, I));
      MSG_EL.style.transform = `translate(${rndi(-2,2)}px, ${rndi(-1,2)}px)`;
      MSG_EL.style.letterSpacing = `${lerp(0.03, 0.12, rnd())}em`;
    }

    function cssJitter() {
      // Tiny viewport jitter to sell the “unstable camera / hacked feed”
      const x = rndi(-Math.floor(jitterPx), Math.floor(jitterPx));
      const y = rndi(-Math.floor(jitterPx/2), Math.floor(jitterPx/2));
      canvas.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Simple frame limiter
    const frameInterval = 1000 / FPS;
    let lastFrame = 0;
    let start = performance.now();
    let ending = false;

    function setOn() {
      document.body.classList.add("on", "warp");
      document.body.classList.remove("off");
      // ramp canvas visible
      requestAnimationFrame(() => (canvas.style.opacity = "1"));
    }

    function setOff() {
      document.body.classList.add("off");
      document.body.classList.remove("on");
      // Let CSS handle fade out; also stop drawing soon
      ending = true;
    }

    function primeAudio() {
      if (audioPrimed) return;
      audioPrimed = true;

      // If the <audio> element exists, try to play it. This may be blocked until a user gesture
      // in a normal browser, but OBS Browser Source usually allows it when audio is enabled.
      if (sfx) {
        try {
          sfx.currentTime = 0;
          const p = sfx.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
        } catch (_) {}
      } else {
        // Fallback: synth a short static burst with WebAudio (no external file).
        // This is intentionally abrasive for ARG vibes.
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          const ac = new AC();
          const dur = Math.min(0.22, Math.max(0.08, MS / 4000));
          const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < data.length; i++) {
            const n = (Math.random() * 2 - 1);
            // shape burst: fast attack, fast decay
            const t = i / data.length;
            const env = (t < 0.08 ? t / 0.08 : Math.exp(-10 * (t - 0.08)));
            data[i] = n * env * (0.55 + 0.45 * I);
          }
          const src = ac.createBufferSource();
          src.buffer = buf;

          // bandpass “radio”
          const bp = ac.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = 900 + 900 * I;
          bp.Q.value = 0.7 + 2.2 * I;

          const gain = ac.createGain();
          gain.gain.value = 0.9;

          src.connect(bp);
          bp.connect(gain);
          gain.connect(ac.destination);

          src.start();
          setTimeout(() => { try { ac.close(); } catch(_){} }, (dur * 1000) + 120);
        } catch (_) {}
      }
    }

    function loop(t) {
      if (t - lastFrame < frameInterval && !ending) {
        requestAnimationFrame(loop);
        return;
      }
      lastFrame = t;

      const w = canvas.width;
      const h = canvas.height;

      // Clear to transparent each frame, then draw noise
      ctx.clearRect(0, 0, w, h);

      // Draw noise as full canvas imageData (in device pixels)
      drawNoise(w, h, t);

      // Tear and mess with it
      tearSlices(w, h);
      chromaGhost(w, h);
      flash(w, h);

      // Extra vibe
      signalDrop();
      msgFlicker();
      cssJitter();

      // Auto-end if burst
      if (MODE === "burst") {
        const elapsed = t - start;
        if (!ending && elapsed >= MS) {
          setOff();
          // stop drawing after fade-out
          setTimeout(() => {
            // Freeze fully transparent (keeps alpha clean if OBS keeps source active)
            canvas.style.opacity = "0";
          }, parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fade-out-ms"), 10) + 10);
        }
      }

      // Continue
      if (!ending || MODE === "loop") {
        requestAnimationFrame(loop);
      }
    }

    // Kick it off
    setOn();
    primeAudio();
    requestAnimationFrame(loop);

    // Quality-of-life: if you click the Browser Source preview in OBS (or open in browser),
    // re-trigger the burst quickly.
    window.addEventListener("pointerdown", () => {
      seed = (Date.now() & 0x7fffffff) >>> 0;
      start = performance.now();
      ending = false;
      document.body.classList.remove("off");
      document.body.classList.add("on");
      canvas.style.opacity = "1";
      primeAudio();
      requestAnimationFrame(loop);
    });

    // Helpers
    function clampNum(x, a, b){ return Math.max(a, Math.min(b, x)); }
  </script>
</body>
</html>
