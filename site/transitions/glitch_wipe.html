<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>glitch-wipe</title>
  <style>
    :root{
      --fade-in-ms: 18;
      --fade-out-ms: 140;
      --bg-alpha: 0;           /* transparent background for OBS */
      --edge-soft: 0.10;       /* wipe edge softness */
    }
    html, body{ height:100%; margin:0; background: rgba(0,0,0,var(--bg-alpha)); overflow:hidden; }
    body{ position:relative; }

    #wrap{
      position:absolute; inset:0;
      opacity:0;
      transition: opacity calc(var(--fade-in-ms)*1ms) linear;
      will-change: opacity, transform, filter;
    }

    /* Canvas draws the wipe + glitch noise */
    #c{
      position:absolute; inset:0;
      width:100%; height:100%;
      opacity:1;
      will-change: transform, filter;
      transform: translateZ(0);
    }

    /* Scanlines overlay */
    #scan{
      position:absolute; inset:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.11) 0px,
          rgba(255,255,255,0.00) 2px,
          rgba(0,0,0,0.00) 4px
        );
      opacity: 0.0;
      mix-blend-mode: overlay;
      transition: opacity calc(var(--fade-in-ms)*1ms) linear;
    }

    /* Subtle vignette to sell CRT */
    #vig{
      position:absolute; inset:-10%;
      pointer-events:none;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0) 35%,
        rgba(0,0,0,0.55) 78%,
        rgba(0,0,0,0.92) 100%);
      opacity: 0.0;
      mix-blend-mode: multiply;
      filter: blur(0.8px);
      transition: opacity calc(var(--fade-in-ms)*1ms) linear;
    }

    /* Optional label */
    #msg{
      position:absolute;
      left: 4.5%;
      top: 6%;
      color: rgba(220,255,220,0.92);
      text-shadow:
        0 0 6px rgba(150,255,170,0.45),
        -2px 0 rgba(255,0,0,0.22),
        2px 0 rgba(0,180,255,0.22);
      letter-spacing: 0.10em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: clamp(12px, 2.0vw, 24px);
      opacity: 0;
      user-select:none;
      pointer-events:none;
      mix-blend-mode: screen;
      transform: translateY(-2px);
      transition: opacity 60ms linear;
      white-space: pre;
    }

    /* Active / end */
    .on #wrap{ opacity:1; }
    .on #scan{ opacity: 0.75; }
    .on #vig{ opacity: 0.75; }
    .on #msg{ opacity: 1; transform: translateY(0); }

    .off #wrap{
      opacity:0;
      transition: opacity calc(var(--fade-out-ms)*1ms) linear;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="scan"></div>
    <div id="vig"></div>
    <div id="msg"></div>
  </div>

  <!-- Optional external audio next to this file -->
  <!-- <audio id="sfx" src="./wipe.wav" preload="auto"></audio> -->

  <script>
    /**
     * glitch_wipe.html — “WIPING GLITCH” overlay
     *
     * What it does:
     *  - A moving wipe band sweeps across the frame (L→R by default)
     *  - Inside the band you get aggressive noise + slice tearing
     *  - Band edge gets chroma split + occasional flash
     *
     * Query params:
     *  mode=burst|loop         (default burst)
     *  ms=650                  (burst duration)
     *  int=0..1                (intensity, default 0.9)
     *  dir=lr|rl|tb|bt         (direction: left-right, right-left, top-bottom, bottom-top)
     *  band=0.22               (band thickness as fraction of screen, 0.08..0.6)
     *  feather=0.10            (edge softness fraction of band, 0..0.5)
     *  fps=60
     *  msg=TEXT                (optional)
     *  seed=123
     *
     * Examples:
     *  glitch_wipe.html?mode=burst&ms=520&int=0.95&dir=lr&band=0.18&msg=TRANSMISSION%20SHIFT
     *  glitch_wipe.html?mode=burst&ms=720&int=1&dir=tb&band=0.26&feather=0.12&msg=SIGNAL%20OVERRIDE
     */

    const qs = new URLSearchParams(location.search);
    const MODE = (qs.get("mode") || "burst").toLowerCase();
    const MS   = clamp(parseFloat(qs.get("ms") || "650"), 120, 8000);
    const INT  = clamp(parseFloat(qs.get("int") || "0.9"), 0, 1);
    const DIR  = (qs.get("dir") || "lr").toLowerCase();
    const BAND = clamp(parseFloat(qs.get("band") || "0.22"), 0.08, 0.60);
    const FEAT = clamp(parseFloat(qs.get("feather") || getComputedStyle(document.documentElement).getPropertyValue("--edge-soft") || "0.10"), 0.0, 0.5);
    const FPS  = clamp(parseFloat(qs.get("fps") || "60"), 10, 120);
    let seed   = (qs.get("seed") ? parseInt(qs.get("seed"), 10) : (Date.now() & 0x7fffffff)) >>> 0;

    const msgEl = document.getElementById("msg");
    const msg = (qs.get("msg") || "").slice(0, 64);
    if (msg) msgEl.textContent = msg;

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });

    const sfx = document.getElementById("sfx");
    let audioPrimed = false;

    // RNG (xorshift32)
    function rnd(){
      seed ^= seed << 13; seed >>>= 0;
      seed ^= seed >> 17; seed >>>= 0;
      seed ^= seed << 5;  seed >>>= 0;
      return (seed >>> 0) / 4294967296;
    }
    function rndi(a,b){ return (a + Math.floor(rnd()*(b-a+1)))|0; }
    function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
    function lerp(a,b,t){ return a + (b-a)*t; }
    function smoothstep(a,b,x){
      const t = clamp((x-a)/(b-a), 0, 1);
      return t*t*(3-2*t);
    }

    function fit(){
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener("resize", fit, { passive:true });
    fit();

    function primeAudio(){
      if (audioPrimed) return;
      audioPrimed = true;

      if (sfx){
        try { sfx.currentTime = 0; const p = sfx.play(); if (p?.catch) p.catch(()=>{}); } catch(_){}
        return;
      }
      // WebAudio “wipe zap”
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ac = new AC();
        const dur = Math.min(0.22, Math.max(0.08, MS/4200));

        // noise burst buffer
        const buf = ac.createBuffer(1, Math.floor(ac.sampleRate*dur), ac.sampleRate);
        const arr = buf.getChannelData(0);
        for (let i=0;i<arr.length;i++){
          const t = i/arr.length;
          const env = t < 0.06 ? (t/0.06) : Math.exp(-12*(t-0.06));
          arr[i] = (Math.random()*2-1) * env * (0.45 + 0.50*INT);
        }
        const src = ac.createBufferSource(); src.buffer = buf;

        // “zap sweep” oscillator
        const osc = ac.createOscillator();
        osc.type = "sawtooth";
        const now = ac.currentTime;
        osc.frequency.setValueAtTime(250 + 200*INT, now);
        osc.frequency.exponentialRampToValueAtTime(1400 + 900*INT, now + dur);

        const gOsc = ac.createGain();
        gOsc.gain.setValueAtTime(0.0001, now);
        gOsc.gain.linearRampToValueAtTime(0.55, now + 0.01);
        gOsc.gain.exponentialRampToValueAtTime(0.0001, now + dur);

        const bp = ac.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = 900 + 900*INT;
        bp.Q.value = 0.8 + 2.2*INT;

        const g = ac.createGain();
        g.gain.value = 0.9;

        src.connect(bp);
        osc.connect(gOsc);

        bp.connect(g);
        gOsc.connect(g);
        g.connect(ac.destination);

        src.start();
        osc.start();
        osc.stop(now + dur);

        setTimeout(()=>{ try{ac.close();}catch(_){ } }, dur*1000 + 200);
      }catch(_){}
    }

    // Intensity knobs
    const I = INT;
    const jitterPx = lerp(1, 12, I);
    const sliceChance = lerp(0.18, 0.55, I);
    const flashChance = lerp(0.05, 0.16, I);
    const chromaPx = lerp(1, 6, I);
    const noiseAlpha = lerp(0.25, 0.85, I);

    let start = performance.now();
    let ending = false;

    const frameInterval = 1000 / FPS;
    let lastFrame = 0;
    let lastNoiseT = 0;

    function drawNoiseBand(w, h, t, bandRect){
      // Update noise ~24fps-ish
      if (t - lastNoiseT < 42) return;
      lastNoiseT = t;

      // bandRect in CSS pixels
      const {x,y,bw,bh} = bandRect;

      // Draw coarse noise into just the band area
      const step = 2;
      const W = Math.max(1, Math.floor(bw));
      const H = Math.max(1, Math.floor(bh));
      const img = ctx.createImageData(W, H);
      const data = img.data;

      for (let yy=0; yy<H; yy+=step){
        for (let xx=0; xx<W; xx+=step){
          const v = (rnd()*255)|0;
          const a = (rnd()*255*noiseAlpha)|0;
          for (let y2=0; y2<step; y2++){
            for (let x2=0; x2<step; x2++){
              const i = ((yy+y2)*W + (xx+x2))*4;
              data[i+0]=v; data[i+1]=v; data[i+2]=v; data[i+3]=a;
            }
          }
        }
      }
      ctx.putImageData(img, Math.floor(x), Math.floor(y));
    }

    function tearWithinBand(bandRect){
      // Slice tearing: copy small bands inside the wipe and offset them
      const {x,y,bw,bh} = bandRect;
      const slices = rndi(3, 10);
      for (let s=0; s<slices; s++){
        if (rnd() > sliceChance) continue;
        const sy = y + rndi(0, Math.max(0, Math.floor(bh-1)));
        const sh = rndi(6, Math.floor(lerp(18, 70, I)));
        const dx = rndi(-Math.floor(jitterPx), Math.floor(jitterPx));

        ctx.globalAlpha = lerp(0.55, 0.95, rnd());
        ctx.drawImage(canvas,
          Math.floor(x), Math.floor(sy), Math.floor(bw), sh,
          Math.floor(x + dx), Math.floor(sy + rndi(-2,2)), Math.floor(bw), sh
        );

        if (rnd() < 0.35 * I){
          ctx.fillStyle = `rgba(255,255,255,${lerp(0.05, 0.22, I)})`;
          ctx.fillRect(Math.floor(x), Math.floor(sy + rndi(0,2)), Math.floor(bw), 1);
        }
      }
      ctx.globalAlpha = 1;
    }

    function chromaEdge(bandRect){
      // Chroma split around the band edge
      const {x,y,bw,bh} = bandRect;
      ctx.globalCompositeOperation = "screen";
      ctx.globalAlpha = 0.22 * I;

      // left/right or top/bottom shift depends on wipe direction
      if (DIR === "lr" || DIR === "rl"){
        ctx.drawImage(canvas, Math.floor(x - chromaPx), Math.floor(y), Math.floor(bw), Math.floor(bh),
                           Math.floor(x), Math.floor(y), Math.floor(bw), Math.floor(bh));
        ctx.drawImage(canvas, Math.floor(x + chromaPx), Math.floor(y), Math.floor(bw), Math.floor(bh),
                           Math.floor(x), Math.floor(y), Math.floor(bw), Math.floor(bh));
      } else {
        ctx.drawImage(canvas, Math.floor(x), Math.floor(y - chromaPx), Math.floor(bw), Math.floor(bh),
                           Math.floor(x), Math.floor(y), Math.floor(bw), Math.floor(bh));
        ctx.drawImage(canvas, Math.floor(x), Math.floor(y + chromaPx), Math.floor(bw), Math.floor(bh),
                           Math.floor(x), Math.floor(y), Math.floor(bw), Math.floor(bh));
      }

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }

    function flash(){
      if (rnd() < flashChance){
        ctx.fillStyle = `rgba(255,255,255,${lerp(0.04, 0.18, I)})`;
        ctx.fillRect(0,0,innerWidth,innerHeight);
      }
    }

    function calcBandRect(progress){
      // progress 0..1
      const w = innerWidth, h = innerHeight;

      if (DIR === "lr" || DIR === "rl"){
        const bw = w * BAND;
        const feather = bw * FEAT;

        const lead = (DIR === "lr") ? (progress * (w + bw) - bw) : ((1-progress) * (w + bw) - bw);
        const x0 = lead;
        const x = x0;
        return { x, y: 0, bw, bh: h, feather, axis:"x", lead:x0, w, h };
      } else {
        const bh = h * BAND;
        const feather = bh * FEAT;

        const lead = (DIR === "tb") ? (progress * (h + bh) - bh) : ((1-progress) * (h + bh) - bh);
        const y0 = lead;
        const y = y0;
        return { x: 0, y, bw: w, bh, feather, axis:"y", lead:y0, w, h };
      }
    }

    function drawBandMask(b){
      // soft-edged band mask using gradient alpha
      // We'll draw a rect with a feathered gradient on both sides of the wipe band.
      ctx.save();
      ctx.globalCompositeOperation = "source-over";

      if (b.axis === "x"){
        const left = b.x, right = b.x + b.bw;
        const f = Math.max(1, b.feather);

        // Build a clip region for band + feather, then use gradient alpha.
        ctx.beginPath();
        ctx.rect(Math.floor(left - f), 0, Math.floor(b.bw + 2*f), Math.floor(b.h));
        ctx.clip();

        // clear band area (it’s an overlay, so we control alpha)
        // We’ll paint a transparent-to-opaque gradient "alpha ramp" by drawing black with alpha,
        // but since we’re drawing noise later, this mostly shapes the band edges.
        const g = ctx.createLinearGradient(left - f, 0, right + f, 0);
        g.addColorStop(0.0, `rgba(255,255,255,0)`);
        g.addColorStop(smoothstep(0,1,(f/(b.bw+2*f))), `rgba(255,255,255,1)`);
        g.addColorStop(1.0 - smoothstep(0,1,(f/(b.bw+2*f))), `rgba(255,255,255,1)`);
        g.addColorStop(1.0, `rgba(255,255,255,0)`);

        ctx.fillStyle = g;
        ctx.globalAlpha = 1;
        ctx.fillRect(Math.floor(left - f), 0, Math.floor(b.bw + 2*f), Math.floor(b.h));
      } else {
        const top = b.y, bot = b.y + b.bh;
        const f = Math.max(1, b.feather);

        ctx.beginPath();
        ctx.rect(0, Math.floor(top - f), Math.floor(b.w), Math.floor(b.bh + 2*f));
        ctx.clip();

        const g = ctx.createLinearGradient(0, top - f, 0, bot + f);
        g.addColorStop(0.0, `rgba(255,255,255,0)`);
        g.addColorStop(smoothstep(0,1,(f/(b.bh+2*f))), `rgba(255,255,255,1)`);
        g.addColorStop(1.0 - smoothstep(0,1,(f/(b.bh+2*f))), `rgba(255,255,255,1)`);
        g.addColorStop(1.0, `rgba(255,255,255,0)`);

        ctx.fillStyle = g;
        ctx.globalAlpha = 1;
        ctx.fillRect(0, Math.floor(top - f), Math.floor(b.w), Math.floor(b.bh + 2*f));
      }
      ctx.restore();
    }

    function microJitter(){
      const x = rndi(-Math.floor(jitterPx), Math.floor(jitterPx));
      const y = rndi(-Math.floor(jitterPx/2), Math.floor(jitterPx/2));
      canvas.style.transform = `translate(${x}px, ${y}px)`;
      canvas.style.filter = `contrast(${lerp(1.04, 1.16, I).toFixed(2)}) saturate(${lerp(1.05, 1.22, I).toFixed(2)})`;
    }

    function setOn(){
      document.body.classList.add("on");
      document.body.classList.remove("off");
    }
    function setOff(){
      document.body.classList.add("off");
      document.body.classList.remove("on");
      ending = true;
    }

    function tick(t){
      if (t - lastFrame < frameInterval && !ending){
        requestAnimationFrame(tick);
        return;
      }
      lastFrame = t;

      const elapsed = t - start;
      const p = (MODE === "loop") ? ((elapsed % MS) / MS) : clamp(elapsed / MS, 0, 1);

      // Clear transparent
      ctx.clearRect(0,0,innerWidth,innerHeight);

      // Compute band
      const b = calcBandRect(p);

      // Mask (creates soft alpha region)
      // We draw the mask "white" to establish alpha, then draw noise/slices in it using compositing.
      // Step 1: draw band alpha mask into canvas
      drawBandMask(b);

      // Step 2: draw noise only where alpha exists
      ctx.globalCompositeOperation = "source-in";
      drawNoiseBand(innerWidth, innerHeight, t, { x: Math.max(-200, b.x - b.feather), y: Math.max(-200, b.y - b.feather), bw: (b.axis==="x" ? b.bw + 2*b.feather : b.bw), bh: (b.axis==="y" ? b.bh + 2*b.feather : b.bh) });

      // Step 3: add tearing within band (still source-in-ish but we can use source-atop now)
      ctx.globalCompositeOperation = "source-atop";
      tearWithinBand({ x: Math.max(0, b.x), y: Math.max(0, b.y), bw: (b.axis==="x" ? b.bw : innerWidth), bh: (b.axis==="y" ? b.bh : innerHeight) });

      // Step 4: chroma edges & flashes on top
      ctx.globalCompositeOperation = "source-over";
      chromaEdge({ x: Math.max(0, b.x), y: Math.max(0, b.y), bw: (b.axis==="x" ? b.bw : innerWidth), bh: (b.axis==="y" ? b.bh : innerHeight) });
      flash();
      microJitter();

      if (MODE === "burst" && !ending && elapsed >= MS){
        setOff();
        return;
      }
      requestAnimationFrame(tick);
    }

    // Start
    setOn();
    primeAudio();
    requestAnimationFrame(tick);

    // Click retrigger in a browser
    addEventListener("pointerdown", ()=>{
      seed = (Date.now() & 0x7fffffff) >>> 0;
      start = performance.now();
      ending = false;
      document.body.classList.remove("off");
      document.body.classList.add("on");
      primeAudio();
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
