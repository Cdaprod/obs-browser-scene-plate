<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorer — Zoom v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg: #09090f;
–card-bg: #111120;
–border: rgba(255,255,255,0.07);
–text: #e8e8f0;
–muted: rgba(255,255,255,0.35);
–accent: #5b7fff;
–gap: 5px;
–radius: 9px;
}

html, body {
width: 100%; height: 100%;
background: var(–bg);
color: var(–text);
font-family: ‘Syne’, sans-serif;
overflow: hidden;
-webkit-font-smoothing: antialiased;
user-select: none;
}

/* ── FIXED CHROME (parallax layer — stays in front) ── */
#chrome {
position: fixed;
inset: 0;
z-index: 50;
pointer-events: none;
display: flex;
flex-direction: column;
justify-content: space-between;
}

/* Letterbox bars */
#bar-top, #bar-bottom {
background: #09090f;
height: 0px; /* animated */
flex-shrink: 0;
pointer-events: none;
}

/* Header sits inside top bar area */
#header {
position: fixed;
top: 0; left: 0; right: 0;
z-index: 60;
display: flex; align-items: center; justify-content: space-between;
padding: 14px 18px;
pointer-events: all;
}
.logo {
font-size: 12px; font-weight: 800; letter-spacing: 0.1em;
text-transform: uppercase;
}
.logo em { color: var(–accent); font-style: normal; }
.item-count {
font-family: ‘DM Mono’, monospace;
font-size: 10px; color: var(–muted); letter-spacing: 0.06em;
}
.col-btns {
display: flex; gap: 5px;
}
.col-btn {
font-family: ‘DM Mono’, monospace; font-size: 9px;
padding: 3px 9px; border-radius: 20px;
border: 1px solid var(–border);
background: transparent; color: var(–muted);
cursor: pointer; transition: all 0.2s; letter-spacing: 0.05em;
pointer-events: all;
}
.col-btn.active, .col-btn:hover {
border-color: var(–accent); color: var(–accent);
background: rgba(91,127,255,0.1);
}

/* ── SCROLL VIEWPORT ──────────────────────────────── */
#viewport {
position: fixed;
top: 44px; left: 0; right: 0; bottom: 0;
overflow-y: auto;
overflow-x: hidden;
z-index: 1;
}
#viewport.locked { overflow: hidden; }

/* ── GRID ─────────────────────────────────────────── */
#grid {
padding: var(–gap);
columns: 4;
column-gap: var(–gap);
will-change: transform;
transform-origin: center top; /* updated on click */
}

.card {
break-inside: avoid;
margin-bottom: var(–gap);
border-radius: var(–radius);
overflow: hidden;
position: relative;
cursor: pointer;
background: var(–card-bg);
border: 1px solid var(–border);
will-change: transform, opacity;
display: block;
}

.card img {
width: 100%; display: block; object-fit: cover;
}
.card.tall img  { aspect-ratio: 9/16; }
.card.wide img  { aspect-ratio: 16/9; }
.card.sq img    { aspect-ratio: 1/1; }

.card.audio {
display: flex; flex-direction: column;
align-items: center; justify-content: center;
height: 80px; gap: 5px;
}
.card.audio .aud-icon {
width: 24px; height: 24px; border-radius: 50%;
border: 1px solid rgba(255,255,255,0.1);
display: flex; align-items: center; justify-content: center;
color: var(–muted); font-size: 10px;
}
.card.audio .aud-label {
font-family: ‘DM Mono’, monospace; font-size: 8px;
letter-spacing: 0.12em; color: var(–muted); text-transform: uppercase;
}

/* ── DETAIL OVERLAY (parallax front layer) ──────── */
#detail {
position: fixed;
inset: 0; z-index: 55;
pointer-events: none;
opacity: 0;
display: flex; flex-direction: column;
justify-content: flex-end;
padding: 0 24px 52px;
}
#detail.open { pointer-events: all; }

#detail-title {
font-size: 22px; font-weight: 800;
margin-bottom: 6px;
transform: translateY(10px);
opacity: 0;
}
#detail-meta {
font-family: ‘DM Mono’, monospace;
font-size: 10px; color: var(–muted); letter-spacing: 0.06em;
transform: translateY(8px);
opacity: 0;
}

/* ── CLOSE (parallax front layer) ───────────────── */
#close-btn {
position: fixed; top: 14px; right: 18px;
z-index: 70;
width: 32px; height: 32px; border-radius: 50%;
background: rgba(255,255,255,0.08);
border: 1px solid rgba(255,255,255,0.1);
color: var(–text); font-size: 14px;
display: flex; align-items: center; justify-content: center;
cursor: pointer; opacity: 0; pointer-events: none;
backdrop-filter: blur(12px);
}
#close-btn.visible { opacity: 1; pointer-events: all; }

/* ── EASING LAB ──────────────────────────────────── */
#lab {
position: fixed; bottom: 16px; left: 50%;
transform: translateX(-50%);
z-index: 70;
display: flex; gap: 4px; align-items: center;
background: rgba(9,9,15,0.88);
border: 1px solid var(–border);
border-radius: 28px; padding: 7px 12px;
backdrop-filter: blur(24px);
font-family: ‘DM Mono’, monospace; font-size: 9px; color: var(–muted);
letter-spacing: 0.06em;
transition: opacity 0.3s;
}
#lab.hidden { opacity: 0; pointer-events: none; }
#lab span { margin-right: 4px; }
.lb {
padding: 3px 9px; border-radius: 20px;
border: 1px solid transparent;
background: transparent; color: var(–muted);
font-family: ‘DM Mono’, monospace; font-size: 9px;
cursor: pointer; transition: all 0.2s; letter-spacing: 0.04em;
}
.lb.active { border-color: var(–accent); color: var(–accent); background: rgba(91,127,255,0.1); }
.lb:hover { color: var(–text); }

/* scale slider */
#scale-wrap {
display: flex; align-items: center; gap: 6px; margin-left: 8px;
padding-left: 8px; border-left: 1px solid var(–border);
}
#scale-slider {
-webkit-appearance: none; appearance: none;
width: 70px; height: 2px; background: rgba(255,255,255,0.12);
border-radius: 2px; outline: none; cursor: pointer;
}
#scale-slider::-webkit-slider-thumb {
-webkit-appearance: none; width: 10px; height: 10px;
border-radius: 50%; background: var(–accent); cursor: pointer;
}
#scale-val { font-size: 9px; color: var(–accent); min-width: 18px; }
</style>

</head>
<body>

<!-- Parallax chrome layer -->

<div id="chrome">
  <div id="bar-top"></div>
  <div id="bar-bottom"></div>
</div>

<div id="header">
  <div class="logo"><em>C</em>DAPROD · EXPLORER</div>
  <div class="item-count" id="item-count"></div>
  <div class="col-btns">
    <button class="col-btn active" onclick="setCols(4,this)">4</button>
    <button class="col-btn" onclick="setCols(3,this)">3</button>
    <button class="col-btn" onclick="setCols(2,this)">2</button>
  </div>
</div>

<div id="viewport">
  <div id="grid"></div>
</div>

<!-- Detail text (parallax, stays at front) -->

<div id="detail">
  <div id="detail-title"></div>
  <div id="detail-meta"></div>
</div>

<button id="close-btn" onclick="closeDetail()">✕</button>

<!-- Lab controls -->

<div id="lab">
  <span>EASE ·</span>
  <button class="lb active" onclick="setEase(this,'power4.inOut')">power4</button>
  <button class="lb" onclick="setEase(this,'power2.inOut')">power2</button>
  <button class="lb" onclick="setEase(this,'expo.inOut')">expo</button>
  <button class="lb" onclick="setEase(this,'circ.inOut')">circ</button>
  <div id="scale-wrap">
    <span>SCALE</span>
    <input id="scale-slider" type="range" min="2" max="10" step="0.5" value="5"
      oninput="document.getElementById('scale-val').textContent=this.value; zoomScale=+this.value">
    <span id="scale-val">5</span>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
let currentEase = 'power4.inOut';
let zoomScale   = 5;
let zoomDur     = 1.8;
let isOpen      = false;
let currentAsset = null;
let tl = null; // active timeline

// ── ASSETS ─────────────────────────────────────────────
const ASSETS = [
  { id:1,  type:'wide', src:'https://picsum.photos/seed/a1/600/340',  title:'Setup Overview',      meta:'IMG · 3.2MB · 2024-03-12' },
  { id:2,  type:'tall', src:'https://picsum.photos/seed/a2/400/700',  title:'Self Portrait',       meta:'IMG · 2.1MB · 2024-03-11' },
  { id:3,  type:'sq',   src:'https://picsum.photos/seed/a3/500/500',  title:'Close Up Study',      meta:'IMG · 1.8MB · 2024-03-10' },
  { id:4,  type:'sq',   src:'https://picsum.photos/seed/a4/500/500',  title:'Night Drive',         meta:'VID · 47MB  · 2024-03-09' },
  { id:5,  type:'tall', src:'https://picsum.photos/seed/a5/400/700',  title:'Street Sign',         meta:'IMG · 1.4MB · 2024-03-09' },
  { id:6,  type:'sq',   src:'https://picsum.photos/seed/a6/500/500',  title:'Trash Day',           meta:'IMG · 2.7MB · 2024-03-08' },
  { id:7,  type:'wide', src:'https://picsum.photos/seed/a7/600/340',  title:'Walking Trail',       meta:'VID · 91MB  · 2024-03-07' },
  { id:8,  type:'tall', src:'https://picsum.photos/seed/a8/400/700',  title:'Lava Lamp Green',     meta:'VID · 34MB  · 2024-03-06' },
  { id:9,  type:'sq',   src:'https://picsum.photos/seed/a9/500/500',  title:'Kids at Target',      meta:'IMG · 1.9MB · 2024-03-06' },
  { id:10, type:'wide', src:'https://picsum.photos/seed/a10/600/340', title:'Black Car Snow',      meta:'VID · 55MB  · 2024-03-05' },
  { id:11, type:'tall', src:'https://picsum.photos/seed/a11/400/700', title:'Drink Closeup',       meta:'VID · 22MB  · 2024-03-05' },
  { id:12, type:'sq',   src:'https://picsum.photos/seed/a12/500/500', title:'Sand Pour',           meta:'VID · 18MB  · 2024-03-04' },
  { id:13, type:'audio',src:null,                                      title:'Voice Memo 01',       meta:'AUD · 4.2MB · 2024-03-04' },
  { id:14, type:'tall', src:'https://picsum.photos/seed/a14/400/700', title:'Camera Rig',          meta:'IMG · 3.1MB · 2024-03-03' },
  { id:15, type:'wide', src:'https://picsum.photos/seed/a15/600/340', title:'Toys Aisle',          meta:'VID · 62MB  · 2024-03-03' },
  { id:16, type:'sq',   src:'https://picsum.photos/seed/a16/500/500', title:'Lava Lamp Blue',      meta:'VID · 29MB  · 2024-03-02' },
  { id:17, type:'tall', src:'https://picsum.photos/seed/a17/400/700', title:'Smoke Driveway',      meta:'VID · 77MB  · 2024-03-02' },
  { id:18, type:'sq',   src:'https://picsum.photos/seed/a18/500/500', title:'Paulding County',     meta:'IMG · 1.2MB · 2024-03-01' },
  { id:19, type:'audio',src:null,                                      title:'Voice Memo 02',       meta:'AUD · 2.8MB · 2024-03-01' },
  { id:20, type:'tall', src:'https://picsum.photos/seed/a20/400/700', title:'Sunglasses Self',     meta:'IMG · 2.3MB · 2024-02-28' },
  { id:21, type:'wide', src:'https://picsum.photos/seed/a21/600/340', title:'Code Screenshot',     meta:'SCN · 0.9MB · 2024-02-27' },
  { id:22, type:'sq',   src:'https://picsum.photos/seed/a22/500/500', title:'Shopping Carts',      meta:'IMG · 1.7MB · 2024-02-27' },
  { id:23, type:'audio',src:null,                                      title:'Voice Memo 03',       meta:'AUD · 6.1MB · 2024-02-26' },
  { id:24, type:'wide', src:'https://picsum.photos/seed/a24/600/340', title:'County Sign Wide',    meta:'IMG · 2.0MB · 2024-02-26' },
  { id:25, type:'sq',   src:'https://picsum.photos/seed/a25/500/500', title:'Holding Device',      meta:'IMG · 1.5MB · 2024-02-25' },
  { id:26, type:'tall', src:'https://picsum.photos/seed/a26/400/700', title:'Concert Lights',      meta:'VID · 48MB  · 2024-02-25' },
  { id:27, type:'audio',src:null,                                      title:'Voice Memo 04',       meta:'AUD · 3.4MB · 2024-02-24' },
  { id:28, type:'sq',   src:'https://picsum.photos/seed/a28/500/500', title:'Document Scan',       meta:'DOC · 0.4MB · 2024-02-24' },
];

// ── BUILD GRID ─────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  document.getElementById('item-count').textContent = `${ASSETS.length} items`;

  ASSETS.forEach((asset, i) => {
    const card = document.createElement('div');
    card.className = `card ${asset.type}`;
    card.dataset.id = asset.id;

    if (asset.type === 'audio') {
      card.innerHTML = `<div class="aud-icon">♪</div><div class="aud-label">AUDIO</div>`;
    } else {
      card.innerHTML = `<img src="${asset.src}" alt="${asset.title}" loading="lazy" draggable="false">`;
    }

    // Stagger entrance
    gsap.set(card, { opacity: 0, y: 14, scale: 0.96 });
    gsap.to(card, {
      opacity: 1, y: 0, scale: 1,
      duration: 0.55, ease: 'power3.out',
      delay: 0.03 + i * 0.022
    });

    card.addEventListener('click', () => openDetail(asset, card));
    grid.appendChild(card);
  });
}

// ── OPEN ──────────────────────────────────────────────
function openDetail(asset, cardEl) {
  if (isOpen) return;
  isOpen = true;
  currentAsset = asset;

  const grid    = document.getElementById('grid');
  const vp      = document.getElementById('viewport');
  const barTop  = document.getElementById('bar-top');
  const barBot  = document.getElementById('bar-bottom');
  const detail  = document.getElementById('detail');
  const dtitle  = document.getElementById('detail-title');
  const dmeta   = document.getElementById('detail-meta');
  const closeBtn= document.getElementById('close-btn');
  const lab     = document.getElementById('lab');

  // Set detail text
  dtitle.textContent = asset.title;
  dmeta.textContent  = asset.meta;

  // Lock scroll
  vp.classList.add('locked');

  // Compute transform-origin from card center in GRID space
  const cardRect = cardEl.getBoundingClientRect();
  const vpRect   = vp.getBoundingClientRect();
  const scrollY  = vp.scrollTop;

  // Card center relative to grid element top
  const originX = cardRect.left + cardRect.width  / 2 - vpRect.left;
  const originY = cardRect.top  + cardRect.height / 2 - vpRect.top + scrollY;

  grid.style.transformOrigin = `${originX}px ${originY}px`;

  // Build timeline
  tl = gsap.timeline();

  // 1. Grid zooms in — the power shot
  tl.to(grid, {
    scale: zoomScale,
    duration: zoomDur,
    ease: currentEase,
  });

  // Grid fades as it scales (starts ~40% through)
  tl.to(grid, {
    opacity: 0,
    duration: zoomDur * 0.6,
    ease: 'power2.in',
  }, zoomDur * 0.35);

  // 2. Letterbox bars grow in (slightly delayed, shorter duration = snappier entrance)
  const barH = window.innerHeight * 0.12;
  tl.to(barTop,  { height: barH, duration: zoomDur * 0.55, ease: 'power3.inOut' }, 0.08);
  tl.to(barBot,  { height: barH, duration: zoomDur * 0.55, ease: 'power3.inOut' }, 0.08);

  // 3. Detail info fades + rises (parallax: appears in front of zooming grid)
  tl.to(detail,  { opacity: 1, duration: 0.01 }, 0);
  detail.classList.add('open');
  tl.to(dtitle,  { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, zoomDur * 0.6);
  tl.to(dmeta,   { opacity: 1, y: 0, duration: 0.4,  ease: 'power3.out' }, zoomDur * 0.65);

  // 4. Close button appears
  tl.to(closeBtn, { opacity: 1, duration: 0.25, ease: 'power2.out' }, zoomDur * 0.55);
  closeBtn.classList.add('visible');

  // 5. Hide lab
  lab.classList.add('hidden');
}

// ── CLOSE ─────────────────────────────────────────────
function closeDetail() {
  if (!isOpen) return;

  const grid    = document.getElementById('grid');
  const vp      = document.getElementById('viewport');
  const barTop  = document.getElementById('bar-top');
  const barBot  = document.getElementById('bar-bottom');
  const detail  = document.getElementById('detail');
  const dtitle  = document.getElementById('detail-title');
  const dmeta   = document.getElementById('detail-meta');
  const closeBtn= document.getElementById('close-btn');
  const lab     = document.getElementById('lab');

  if (tl) tl.kill();

  const collapseDur = zoomDur * 0.65;

  const ctl = gsap.timeline({ onComplete: () => {
    isOpen = false;
    currentAsset = null;
    vp.classList.remove('locked');
    detail.classList.remove('open');
    // Reset text for next open
    gsap.set([dtitle, dmeta], { opacity: 0, y: 10 });
    lab.classList.remove('hidden');
    closeBtn.classList.remove('visible');
  }});

  // Text + close out fast
  ctl.to([dtitle, dmeta, closeBtn], { opacity: 0, duration: 0.2, ease: 'power2.in' }, 0);

  // Grid retract
  ctl.to(grid, { opacity: 1, duration: collapseDur * 0.5, ease: 'power2.out' }, 0.1);
  ctl.to(grid, { scale: 1, duration: collapseDur, ease: 'power3.inOut' }, 0.1);

  // Bars retract
  ctl.to(barTop, { height: 0, duration: collapseDur * 0.7, ease: 'power3.inOut' }, 0.05);
  ctl.to(barBot, { height: 0, duration: collapseDur * 0.7, ease: 'power3.inOut' }, 0.05);

  // Detail overlay off
  ctl.to(detail, { opacity: 0, duration: 0.25 }, 0);
}

// ── UTILS ──────────────────────────────────────────────
function setCols(n, btn) {
  if (isOpen) return;
  document.getElementById('grid').style.columns = n;
  document.querySelectorAll('.col-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function setEase(btn, name) {
  currentEase = name;
  document.querySelectorAll('.lb').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ESC to close
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
// Click scrim (grid area) to close when open
document.getElementById('viewport').addEventListener('click', e => {
  if (isOpen && e.target === document.getElementById('viewport')) closeDetail();
});

buildGrid();
</script>

</body>
</html>
