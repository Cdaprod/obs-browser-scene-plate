<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OBS Browser Scene Plate • Browser</title>
    <style>
        :root {
            --bg: #0b0d12;
            --panel: rgba(255,255,255,0.06);
            --panel2: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.10);
            --fg: rgba(255,255,255,0.92);
            --muted: rgba(255,255,255,0.62);
            --accent: rgba(120,190,255,0.95);

            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            --ui: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--ui);
            overflow: hidden;
        }

        header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            box-sizing: border-box;
            gap: 12px;
        }

        header .title {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        header .title .name {
            font-weight: 900;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        header .title .sub {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        header .right {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
            min-width: 0;
        }

        .chip {
            font-family: var(--mono);
            font-size: 11px;
            color: rgba(255,255,255,0.70);
            border: 1px solid rgba(255,255,255,0.10);
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(0,0,0,0.25);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        .chip:hover {
            border-color: rgba(120,190,255,0.28);
            background: rgba(120,190,255,0.10);
        }

        .wrap {
            height: calc(100% - 56px);
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 12px;
            padding: 12px;
            box-sizing: border-box;
            min-height: 0;
        }

        @media (max-width: 980px) {
            .wrap {
                grid-template-columns: 1fr;
                grid-template-rows: 320px 1fr;
            }
        }

        .pane {
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--panel);
            overflow: hidden;
            display: grid;
            grid-template-rows: auto 1fr;
            min-width: 0;
            min-height: 0;
        }

        .pane .bar {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            background: var(--panel2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-sizing: border-box;
        }

        .pane .bar .label {
            font-size: 12px;
            font-weight: 800;
            color: var(--fg);
            white-space: nowrap;
        }

        .pane .bar input {
            flex: 1;
            min-width: 0;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 10px;
            padding: 8px 10px;
            color: var(--fg);
            outline: none;
            font-family: var(--mono);
            font-size: 11px;
        }

        .pane .bar input::placeholder {
            color: rgba(255,255,255,0.35);
        }

        .tree {
            overflow: auto;
            padding: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .group {
            margin: 10px 6px 6px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .group .gname {
            font-family: var(--mono);
            font-size: 11px;
            color: rgba(255,255,255,0.65);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .group .gcount {
            font-family: var(--mono);
            font-size: 10px;
            color: rgba(255,255,255,0.40);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 999px;
            padding: 2px 8px;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            border: 1px solid transparent;
        }

        .item:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.06);
        }

        .item.active {
            background: rgba(120,190,255,0.12);
            border-color: rgba(120,190,255,0.22);
        }

        .item .path {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--fg);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .item .tag {
            font-family: var(--mono);
            font-size: 10px;
            color: rgba(255,255,255,0.60);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 999px;
            padding: 2px 8px;
            white-space: nowrap;
        }

        .previewWrap {
            overflow: hidden;
            display: grid;
            grid-template-rows: auto auto 1fr;
            min-width: 0;
            min-height: 0;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .btn {
            font-family: var(--mono);
            font-size: 11px;
            border-radius: 10px;
            padding: 8px 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.25);
            color: var(--fg);
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: rgba(120,190,255,0.28);
            background: rgba(120,190,255,0.10);
        }

        .url {
            flex: 1;
            min-width: 0;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .hint {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            padding: 10px 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.90);
            font-family: var(--mono);
            font-size: 11px;
            padding: 10px 12px;
            border-radius: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <header>
        <div class="title">
            <div class="name">OBS Browser Scene Plate</div>
            <div class="sub" id="baseInfo">Select an item to preview • Copy URL into OBS Browser Source</div>
        </div>
        <div class="right">
            <div class="chip" id="openBrowse">/browse/</div>
            <div class="chip" id="openDefault">Open Default Plate</div>
        </div>
    </header>

    <div class="wrap">
        <section class="pane">
            <div class="bar">
                <div class="label">Files</div>
                <input id="filter" placeholder="filter (e.g. overlays, glitch, plate-)" />
            </div>
            <div class="tree" id="tree"></div>
        </section>

        <section class="pane previewWrap">
            <div class="bar">
                <div class="label">Preview</div>
                <div class="url" id="urlText">Select a file…</div>
            </div>

            <div class="actions">
                <button class="btn" id="copyBtn">Copy URL</button>
                <button class="btn" id="openBtn">Open Tab</button>
                <button class="btn" id="reloadBtn">Reload</button>
                <div class="url" id="urlText2"></div>
            </div>

            <iframe id="frame" src="about:blank"></iframe>
            <div class="hint">
                Tip: overlays/transitions often accept query params. Copy the URL, then append <span style="color:rgba(120,190,255,0.95);">?key=value</span> in OBS.
            </div>
        </section>
    </div>

    <div class="toast" id="toast">Copied</div>

    <script>
        const TREE_URL = "/tree.json";

        // Your renamed plates
        const PREFERRED_DEFAULT = "/plate-default.html";

        const treeEl = document.getElementById("tree");
        const filterEl = document.getElementById("filter");
        const frame = document.getElementById("frame");
        const urlText = document.getElementById("urlText");
        const urlText2 = document.getElementById("urlText2");
        const copyBtn = document.getElementById("copyBtn");
        const openBtn = document.getElementById("openBtn");
        const reloadBtn = document.getElementById("reloadBtn");
        const toast = document.getElementById("toast");

        const openBrowse = document.getElementById("openBrowse");
        const openDefault = document.getElementById("openDefault");
        const baseInfo = document.getElementById("baseInfo");

        let items = [];
        let activePath = "";

        function showToast(text) {
            toast.textContent = text;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 900);
        }

        function tagFor(path) {
            if (path.includes("/overlays/")) return "overlay";
            if (path.includes("/transitions/")) return "transition";
            if (path.endsWith(".mp4") || path.endsWith(".webm")) return "media";
            if (path.startsWith("/plate-")) return "plate";
            return "page";
        }

        function groupFor(path) {
            if (path.startsWith("/plate-")) return "Plates";
            if (path.includes("/overlays/")) return "Overlays";
            if (path.includes("/transitions/")) return "Transitions";
            if (path.endsWith(".mp4") || path.endsWith(".webm")) return "Media";
            return "Other";
        }

        function render() {
            const q = (filterEl.value || "").toLowerCase().trim();
            treeEl.innerHTML = "";

            const filtered = items.filter(p => p.toLowerCase().includes(q));

            // Grouped listing
            const groups = {};
            filtered.forEach(p => {
                const g = groupFor(p);
                if (!groups[g]) groups[g] = [];
                groups[g].push(p);
            });

            const order = ["Plates", "Overlays", "Transitions", "Media", "Other"];
            order.forEach(g => {
                const arr = groups[g] || [];
                if (!arr.length) return;

                const gh = document.createElement("div");
                gh.className = "group";
                gh.innerHTML = `<div class="gname">${g}</div><div class="gcount">${arr.length}</div>`;
                treeEl.appendChild(gh);

                arr.forEach(path => {
                    const div = document.createElement("div");
                    div.className = "item" + (path === activePath ? " active" : "");
                    div.innerHTML = `
                        <div class="path">${path}</div>
                        <div class="tag">${tagFor(path)}</div>
                    `;
                    div.onclick = () => select(path);
                    treeEl.appendChild(div);
                });
            });
        }

        function select(path) {
            activePath = path;
            const full = location.origin + path;

            urlText.textContent = full;
            urlText2.textContent = full;
            baseInfo.textContent = `Selected: ${path}`;

            // Load in preview
            frame.src = path;
            render();
        }

        copyBtn.onclick = async () => {
            const text = urlText2.textContent || "";
            if (!text || text.startsWith("Select")) return;

            try {
                await navigator.clipboard.writeText(text);
                showToast("Copied URL");
            } catch (_) {
                window.prompt("Copy URL:", text);
            }
        };

        openBtn.onclick = () => {
            const text = urlText2.textContent || "";
            if (!text || text.startsWith("Select")) return;
            window.open(text, "_blank");
        };

        reloadBtn.onclick = () => {
            frame.src = frame.src;
            showToast("Reloaded");
        };

        openBrowse.onclick = () => {
            window.open("/browse/", "_blank");
        };

        openDefault.onclick = () => {
            select(PREFERRED_DEFAULT);
        };

        filterEl.addEventListener("input", render);

        function pickPreferred() {
            const preferred =
                items.find(p => p === PREFERRED_DEFAULT) ||
                items.find(p => p === "/plate-wall.html") ||
                items.find(p => p === "/plate-procedural.html") ||
                items.find(p => p === "/plate-procedural-enhanced.html") ||
                items.find(p => p.endsWith(".html")) ||
                items[0];

            if (preferred) select(preferred);
        }

        async function boot() {
            const res = await fetch(TREE_URL, { cache: "no-store" });
            const data = await res.json();

            items = (data.files || [])
                .filter(f =>
                    f.endsWith(".html") ||
                    f.endsWith(".mp4") ||
                    f.endsWith(".webm")
                )
                .sort((a, b) => a.localeCompare(b));

            render();
            pickPreferred();
        }

        boot().catch(err => {
            treeEl.innerHTML = "<div style='padding:12px;color:rgba(255,255,255,0.65);font-family:var(--mono);font-size:12px;'>Failed to load /tree.json. Ensure the generator script is running in the container.</div>";
            console.error(err);
        });
    </script>
</body>
</html>
