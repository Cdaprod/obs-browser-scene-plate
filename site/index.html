<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OBS Browser Scene Plate • Browser</title>
    <style>
        :root {
            --bg: #0b0d12;
            --panel: rgba(255,255,255,0.06);
            --panel2: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.10);
            --fg: rgba(255,255,255,0.92);
            --muted: rgba(255,255,255,0.62);
            --accent: rgba(120,190,255,0.95);

            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            --ui: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--ui);
            overflow: hidden;
        }

        header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            box-sizing: border-box;
            gap: 12px;
        }

        header .title {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        header .title .name {
            font-weight: 900;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        header .title .sub {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        header .right {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
            min-width: 0;
            flex-wrap: wrap;
        }

        .chip {
            font-family: var(--mono);
            font-size: 11px;
            color: rgba(255,255,255,0.70);
            border: 1px solid rgba(255,255,255,0.10);
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(0,0,0,0.25);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        .chip:hover {
            border-color: rgba(120,190,255,0.28);
            background: rgba(120,190,255,0.10);
        }

        .wrap {
            height: calc(100% - 56px);
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 12px;
            padding: 12px;
            box-sizing: border-box;
            min-height: 0;
        }

        @media (max-width: 980px) {
            .wrap {
                grid-template-columns: 1fr;
                grid-template-rows: 320px 1fr;
            }
        }

        .pane {
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--panel);
            overflow: hidden;
            display: grid;
            grid-template-rows: auto 1fr;
            min-width: 0;
            min-height: 0;
        }

        .files-pane .tree {
            min-height: 0;
        }

        .pane .bar {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            background: var(--panel2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-sizing: border-box;
        }

        .pane .bar .label {
            font-size: 12px;
            font-weight: 800;
            color: var(--fg);
            white-space: nowrap;
        }

        .pane .bar input {
            flex: 1;
            min-width: 0;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 10px;
            padding: 8px 10px;
            color: var(--fg);
            outline: none;
            font-family: var(--mono);
            font-size: 11px;
        }

        .pane .bar input::placeholder {
            color: rgba(255,255,255,0.35);
        }

        .tree {
            overflow: auto;
            padding: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .group {
            margin: 10px 6px 6px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .group .gname {
            font-family: var(--mono);
            font-size: 11px;
            color: rgba(255,255,255,0.65);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .group .gcount {
            font-family: var(--mono);
            font-size: 10px;
            color: rgba(255,255,255,0.40);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 999px;
            padding: 2px 8px;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            border: 1px solid transparent;
        }

        .item:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.06);
        }

        .item.active {
            background: rgba(120,190,255,0.12);
            border-color: rgba(120,190,255,0.22);
        }

        .item .path {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--fg);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .item .tag {
            font-family: var(--mono);
            font-size: 10px;
            color: rgba(255,255,255,0.60);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 999px;
            padding: 2px 8px;
            white-space: nowrap;
        }

        .previewWrap {
            overflow: hidden;
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr) auto;
            min-width: 0;
            min-height: 0;
        }

        .preview-stage {
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-stage iframe {
            width: 100%;
            height: 100%;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
        }

        .btn {
            font-family: var(--mono);
            font-size: 11px;
            border-radius: 10px;
            padding: 8px 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.25);
            color: var(--fg);
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: rgba(120,190,255,0.28);
            background: rgba(120,190,255,0.10);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .recent-wrap {
            position: relative;
            max-width: 100%;
        }

        .recent-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            min-width: 240px;
            max-width: min(360px, 80vw);
            width: min(360px, calc(100vw - 24px));
            box-sizing: border-box;
            max-height: 280px;
            overflow-y: auto;
            background: rgba(12, 16, 24, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
        }

        .recent-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.3);
            text-decoration: none;
            color: var(--fg);
            cursor: pointer;
            text-align: left;
            width: 100%;
            font-family: inherit;
        }

        .recent-item:hover {
            border-color: rgba(120, 190, 255, 0.35);
            background: rgba(120, 190, 255, 0.12);
        }

        .recent-name {
            font-family: var(--mono);
            font-size: 11px;
            color: rgba(220, 235, 255, 0.95);
        }

        .recent-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-family: var(--mono);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.55);
            flex-wrap: wrap;
        }

        .recent-url {
            font-family: var(--mono);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            word-break: break-all;
        }

        .recent-empty {
            font-family: var(--mono);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            padding: 6px 8px;
        }

        .input {
            font-family: var(--mono);
            font-size: 11px;
            border-radius: 10px;
            padding: 8px 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.35);
            color: var(--fg);
            min-width: 90px;
        }

        .input::placeholder {
            color: rgba(255,255,255,0.35);
        }

        .url {
            flex: 1;
            min-width: 0;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .url-builder {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 6px;
            font-family: var(--mono);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.85);
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .url-builder.empty {
            color: rgba(255, 255, 255, 0.5);
        }

        .url-segment {
            color: rgba(255, 255, 255, 0.75);
        }

        .url-path {
            color: rgba(214, 234, 255, 0.92);
        }

        .url-fragment {
            color: rgba(160, 200, 255, 0.75);
        }

        .url-sep {
            color: rgba(255, 255, 255, 0.4);
            padding: 0 1px;
        }

        .url-key {
            color: rgba(170, 210, 255, 0.9);
        }

        .url-value {
            min-width: 36px;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(130, 180, 255, 0.18);
            color: rgba(255, 255, 255, 0.92);
            outline: none;
            border: 1px solid rgba(130, 180, 255, 0.3);
            box-shadow: inset 0 0 0 1px rgba(130, 180, 255, 0.08);
            white-space: pre-wrap;
        }

        .url-value:focus {
            border-color: rgba(130, 200, 255, 0.75);
            box-shadow: 0 0 0 2px rgba(130, 200, 255, 0.2);
        }

        .status {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
        }

        .hidden {
            display: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .hint {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            padding: 10px 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.90);
            font-family: var(--mono);
            font-size: 11px;
            padding: 10px 12px;
            border-radius: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
        }

        .toast.show {
            opacity: 1;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(6, 8, 12, 0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 40;
        }

        .modal.hidden {
            display: none;
        }

        .modal-card {
            width: min(720px, 92vw);
            background: rgba(12, 16, 24, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .modal-title {
            font-family: var(--mono);
            font-size: 12px;
            color: rgba(220, 235, 255, 0.95);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-meta {
            font-family: var(--mono);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.55);
        }

        .modal-video {
            width: 100%;
            max-height: 420px;
            border-radius: 12px;
            background: #000;
        }

        .modal-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 720px) {
            header {
                height: auto;
                flex-wrap: wrap;
                padding: 10px 12px;
            }

            .wrap {
                grid-template-rows: 300px 1fr;
            }

            .actions {
                align-items: flex-start;
            }

            .url {
                flex-basis: 100%;
                white-space: normal;
                overflow-wrap: anywhere;
            }

            .url-builder {
                flex-basis: 100%;
                white-space: normal;
            }
        }

        @media (max-width: 720px) and (orientation: portrait) {
            .wrap {
                position: relative;
                grid-template-columns: 1fr;
                grid-template-rows: 1fr;
                height: calc(100dvh - 56px);
            }

            .files-pane {
                position: absolute;
                inset: 0 auto 0 0;
                width: min(300px, 78%);
                height: 100%;
                z-index: 6;
                box-shadow: 6px 0 16px rgba(0, 0, 0, 0.35);
                background: rgba(8, 10, 14, 0.96);
                border-color: rgba(255, 255, 255, 0.14);
            }

            .files-pane .bar {
                flex-wrap: wrap;
            }

            .files-pane .bar input {
                flex-basis: 100%;
            }

            .files-toggle::after {
                content: "▾";
                margin-left: 6px;
                font-size: 11px;
                color: rgba(255, 255, 255, 0.6);
            }

            body.files-collapsed .files-pane .bar input,
            body.files-collapsed .files-pane .tree {
                display: none;
            }

            body.files-collapsed .files-pane {
                width: 0;
                border: none;
                background: transparent;
                box-shadow: none;
                overflow: hidden;
            }

            body.files-collapsed .files-toggle::after {
                content: "▸";
            }

            .previewWrap {
                grid-template-rows: auto auto minmax(0, 1fr);
            }

            .hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="title">
            <div class="name">OBS Browser Scene Plate</div>
            <div class="sub" id="baseInfo">Select an item to preview • Copy URL into OBS Browser Source</div>
        </div>
        <div class="right">
            <button class="chip files-toggle" id="filesToggle" type="button" aria-expanded="true">Files</button>
            <div class="chip" id="openBrowse">/browse/</div>
            <div class="chip" id="openDefault">Open Default Plate</div>
        </div>
    </header>

    <div class="wrap">
        <section class="pane files-pane">
            <div class="bar">
                <div class="label">Files</div>
                <input id="filter" placeholder="filter (e.g. overlays, glitch, plate-)" />
            </div>
            <div class="tree" id="tree"></div>
        </section>

        <section class="pane previewWrap">
            <div class="bar">
                <div class="label">Preview</div>
                <div class="url-builder empty" id="urlBuilder">Select a file…</div>
            </div>

            <div class="actions">
                <button class="btn" id="copyBtn">Copy URL</button>
                <button class="btn" id="openBtn">Open Tab</button>
                <button class="btn" id="reloadBtn">Reload</button>
                <button class="btn" id="exportBtn">Export MOV</button>
                <div class="recent-wrap">
                    <button class="btn" id="recentBtn" type="button">Recent Exports</button>
                    <div class="recent-menu hidden" id="recentMenu"></div>
                </div>
                <input class="input" id="secondsInput" type="number" min="0" step="0.1" placeholder="auto sec" />
                <span class="status" id="exportStatus">Idle</span>
                <a class="btn hidden" id="downloadBtn" download>Download MOV</a>
            </div>

            <div class="preview-stage">
                <iframe id="frame" src="about:blank"></iframe>
            </div>
            <div class="hint">
                Tip: overlays/transitions often accept query params. Copy the URL, then append <span style="color:rgba(120,190,255,0.95);">?key=value</span> in OBS.
            </div>
        </section>
    </div>

    <div class="toast" id="toast">Copied</div>

    <div class="modal hidden" id="exportModal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
            <div class="modal-header">
                <div>
                    <div class="modal-title" id="exportModalTitle">Export Preview</div>
                    <div class="modal-meta" id="exportModalMeta"></div>
                </div>
                <button class="btn" id="exportModalClose" type="button">Close</button>
            </div>
            <video class="modal-video" id="exportModalVideo" controls playsinline></video>
            <div class="modal-actions">
                <a class="btn" id="exportModalDownload" download>Download MOV</a>
                <button class="btn" id="exportModalOpen" type="button">Open in New Tab</button>
            </div>
        </div>
    </div>

    <script src="url-utils.js"></script>
    <script>
        const TREE_URL = "/tree.json";

        // Your renamed plates
        const PREFERRED_DEFAULT = "/plate-default.html";

        const treeEl = document.getElementById("tree");
        const filterEl = document.getElementById("filter");
        const frame = document.getElementById("frame");
        const urlBuilder = document.getElementById("urlBuilder");
        const copyBtn = document.getElementById("copyBtn");
        const openBtn = document.getElementById("openBtn");
        const reloadBtn = document.getElementById("reloadBtn");
        const exportBtn = document.getElementById("exportBtn");
        const secondsInput = document.getElementById("secondsInput");
        const exportStatus = document.getElementById("exportStatus");
        const downloadBtn = document.getElementById("downloadBtn");
        const toast = document.getElementById("toast");
        const recentBtn = document.getElementById("recentBtn");
        const recentMenu = document.getElementById("recentMenu");
        const filesToggle = document.getElementById("filesToggle");
        const exportModal = document.getElementById("exportModal");
        const exportModalTitle = document.getElementById("exportModalTitle");
        const exportModalMeta = document.getElementById("exportModalMeta");
        const exportModalVideo = document.getElementById("exportModalVideo");
        const exportModalDownload = document.getElementById("exportModalDownload");
        const exportModalOpen = document.getElementById("exportModalOpen");
        const exportModalClose = document.getElementById("exportModalClose");

        const openBrowse = document.getElementById("openBrowse");
        const openDefault = document.getElementById("openDefault");
        const baseInfo = document.getElementById("baseInfo");

        const EXPORT_HISTORY_KEY = "obs-browser-export-history";
        const EXPORT_HISTORY_LIMIT = 8;
        const portraitQuery = window.matchMedia("(max-width: 720px) and (orientation: portrait)");

        const encodeQueryValueSafe =
            window.encodeQueryValue
            || ((value) => encodeURIComponent(value ?? ""));
        const decodeQueryValueSafe =
            window.decodeQueryValue
            || ((value) => {
                if (value === null || value === undefined) {
                    return "";
                }

                const normalized = String(value);
                try {
                    return decodeURIComponent(normalized);
                } catch (_) {
                    return String(value);
                }
            });
        const buildRenderDownloadUrlSafe =
            window.buildRenderDownloadUrl
            || (({ downloadBase: base, downloadPath, filename }) => {
                if (!base) {
                    return downloadPath || "";
                }
                const normalizedBase = base.replace(/\/+$/, "");
                if (filename) {
                    return `${normalizedBase}/renders/${encodeURIComponent(filename)}`;
                }
                if (downloadPath) {
                    const normalizedPath = downloadPath.startsWith("/")
                        ? downloadPath
                        : `/${downloadPath}`;
                    return `${normalizedBase}${normalizedPath}`;
                }
                return normalizedBase;
            });

        // ---------------------------------------------------------------------
        // Export endpoints (LAN-first)
        // - render-api is mapped on the host to 8793 (container listens on 8791)
        // - nginx serves /renders via 8789
        // ---------------------------------------------------------------------
        const host = window.location.hostname;   // e.g. 192.168.0.25
        const renderApiPort = 8793;
        const webPort = window.location.port || 8789;

        const renderApiBase = `http://${host}:${renderApiPort}`;
        const downloadBase = `http://${host}:${webPort}`;

        let items = [];
        let activePath = "";
        let currentFullUrl = "";
        let pollTimer = null;
        let selectionToken = 0;
        let urlUpdateTimer = null;

        function showToast(text) {
            toast.textContent = text;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 900);
        }

        function setFilesCollapsed(collapsed) {
            const nextState = Boolean(collapsed);
            document.body.classList.toggle("files-collapsed", nextState);
            if (filesToggle) {
                filesToggle.setAttribute("aria-expanded", String(!nextState));
            }
        }

        function syncFilesCollapseFromViewport() {
            if (portraitQuery.matches) {
                setFilesCollapsed(true);
            } else {
                setFilesCollapsed(false);
            }
        }

        function loadExportHistory() {
            try {
                const stored = window.localStorage.getItem(EXPORT_HISTORY_KEY);
                if (!stored) return [];
                const parsed = JSON.parse(stored);
                return Array.isArray(parsed) ? parsed : [];
            } catch (_) {
                return [];
            }
        }

        function saveExportHistory(entries) {
            try {
                window.localStorage.setItem(EXPORT_HISTORY_KEY, JSON.stringify(entries));
            } catch (_) {
                // Ignore storage errors (private mode, quota, etc.)
            }
        }

        function formatExportTime(timestamp) {
            if (!timestamp) return "";
            const date = new Date(timestamp);
            if (Number.isNaN(date.getTime())) return "";
            return date.toLocaleString(undefined, {
                month: "short",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function formatBytes(bytes) {
            if (!Number.isFinite(bytes) || bytes <= 0) return "";
            const units = ["B", "KB", "MB", "GB"];
            let index = 0;
            let value = bytes;
            while (value >= 1024 && index < units.length - 1) {
                value /= 1024;
                index += 1;
            }
            return `${value.toFixed(value >= 10 || index === 0 ? 0 : 1)} ${units[index]}`;
        }

        function renderExportHistory(entries) {
            recentMenu.innerHTML = "";

            if (!entries.length) {
                const empty = document.createElement("div");
                empty.className = "recent-empty";
                empty.textContent = "No recent exports yet.";
                recentMenu.appendChild(empty);
                return;
            }

            entries.forEach((entry) => {
                const link = document.createElement("button");
                link.type = "button";
                link.className = "recent-item";
                link.dataset.url = entry.url;
                link.dataset.name = entry.name || "export";
                link.dataset.createdAt = entry.createdAt ? String(entry.createdAt) : "";
                link.dataset.sizeBytes = Number.isFinite(entry.sizeBytes)
                    ? String(entry.sizeBytes)
                    : "";

                const name = document.createElement("div");
                name.className = "recent-name";
                name.textContent = entry.name || "export";

                const meta = document.createElement("div");
                meta.className = "recent-meta";

                const time = document.createElement("span");
                time.textContent = formatExportTime(entry.createdAt) || "just now";
                meta.appendChild(time);

                const size = document.createElement("span");
                size.textContent = formatBytes(entry.sizeBytes) || "Download MOV";
                meta.appendChild(size);

                const urlText = document.createElement("div");
                urlText.className = "recent-url";
                urlText.textContent = entry.url;

                link.appendChild(name);
                link.appendChild(meta);
                link.appendChild(urlText);
                recentMenu.appendChild(link);
            });
        }

        function positionRecentMenu() {
            if (recentMenu.classList.contains("hidden")) return;
            recentMenu.style.left = "0";
            recentMenu.style.right = "auto";
            recentMenu.style.transform = "translateX(0)";
            const menuRect = recentMenu.getBoundingClientRect();
            const viewportPadding = 8;
            let shift = 0;
            const overflowRight = menuRect.right - (window.innerWidth - viewportPadding);
            if (overflowRight > 0) {
                shift -= overflowRight;
            }
            const overflowLeft = viewportPadding - (menuRect.left + shift);
            if (overflowLeft > 0) {
                shift += overflowLeft;
            }
            recentMenu.style.transform = `translateX(${shift}px)`;
        }

        function updateExportHistory(entry) {
            if (!entry || !entry.url) return;
            const history = loadExportHistory();
            const next = [
                entry,
                ...history.filter((item) => item.url !== entry.url)
            ].slice(0, EXPORT_HISTORY_LIMIT);
            saveExportHistory(next);
            renderExportHistory(next);
        }

        async function fetchRecentExports() {
            const url = `${renderApiBase}/api/renders?limit=${EXPORT_HISTORY_LIMIT}`;
            try {
                const res = await fetch(url, { cache: "no-store" });
                const data = await res.json();
                if (!res.ok || !data.ok) {
                    throw new Error(data.error || "recent_failed");
                }
                const entries = (data.renders || []).map((item) => {
                    const downloadUrl = buildRenderDownloadUrlSafe({
                        downloadBase,
                        downloadPath: item.download_url,
                        filename: item.filename
                    });
                    return {
                        url: downloadUrl,
                        name: item.filename || "export",
                        createdAt: item.updated_at ? Date.parse(item.updated_at) : Date.now(),
                        sizeBytes: item.size_bytes ?? null
                    };
                });
                const sorted = entries.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                saveExportHistory(sorted);
                return sorted;
            } catch (err) {
                console.warn("Recent exports unavailable, using cached history.", err);
                return loadExportHistory();
            }
        }

        function openExportModal(entry) {
            if (!entry || !entry.url) return;
            exportModalTitle.textContent = entry.name || "Export Preview";
            const timeLabel = formatExportTime(entry.createdAt);
            const sizeLabel = formatBytes(entry.sizeBytes);
            exportModalMeta.textContent = [timeLabel, sizeLabel].filter(Boolean).join(" • ");
            exportModalVideo.src = entry.url;
            exportModalDownload.href = entry.url;
            exportModalDownload.download = entry.name || "";
            exportModalOpen.onclick = () => window.open(entry.url, "_blank");
            exportModal.classList.remove("hidden");
            exportModal.setAttribute("aria-hidden", "false");
        }

        function closeExportModal() {
            exportModal.classList.add("hidden");
            exportModal.setAttribute("aria-hidden", "true");
            exportModalVideo.pause();
            exportModalVideo.removeAttribute("src");
            exportModalVideo.load();
        }

        function tagFor(path) {
            if (path.includes("/overlays/")) return "overlay";
            if (path.includes("/transitions/")) return "transition";
            if (path.endsWith(".mp4") || path.endsWith(".webm")) return "media";
            if (path.startsWith("/plate-")) return "plate";
            return "page";
        }

        function groupFor(path) {
            if (path.startsWith("/plate-")) return "Plates";
            if (path.includes("/overlays/")) return "Overlays";
            if (path.includes("/transitions/")) return "Transitions";
            if (path.endsWith(".mp4") || path.endsWith(".webm")) return "Media";
            return "Other";
        }

        function inferNameFromPath(path) {
            return (path || "export")
                .replace(/^\/+/, "")
                .replace(/\.[a-z0-9]+$/i, "")
                .replace(/[\/]+/g, "_");
        }

        function render() {
            const q = (filterEl.value || "").toLowerCase().trim();
            treeEl.innerHTML = "";

            const filtered = items.filter(p => p.toLowerCase().includes(q));

            // Grouped listing
            const groups = {};
            filtered.forEach(p => {
                const g = groupFor(p);
                if (!groups[g]) groups[g] = [];
                groups[g].push(p);
            });

            const order = ["Plates", "Overlays", "Transitions", "Media", "Other"];
            order.forEach(g => {
                const arr = groups[g] || [];
                if (!arr.length) return;

                const gh = document.createElement("div");
                gh.className = "group";
                gh.innerHTML = `<div class="gname">${g}</div><div class="gcount">${arr.length}</div>`;
                treeEl.appendChild(gh);

                arr.forEach(path => {
                    const div = document.createElement("div");
                    div.className = "item" + (path === activePath ? " active" : "");
                    div.innerHTML = `
                        <div class="path">${path}</div>
                        <div class="tag">${tagFor(path)}</div>
                    `;
                    div.onclick = () => select(path);
                    treeEl.appendChild(div);
                });
            });
        }

        function createUrlSpan(className, text) {
            const span = document.createElement("span");
            span.className = className;
            span.textContent = text;
            return span;
        }

        function createSeparator(text) {
            return createUrlSpan("url-sep", text);
        }

        function renderUrlBuilder(url) {
            urlBuilder.innerHTML = "";

            if (!url || url.startsWith("Select")) {
                urlBuilder.classList.add("empty");
                urlBuilder.textContent = "Select a file…";
                urlBuilder.removeAttribute("data-full-url");
                urlBuilder.removeAttribute("data-origin");
                urlBuilder.removeAttribute("data-pathname");
                urlBuilder.removeAttribute("data-hash");
                urlBuilder.removeAttribute("title");
                return;
            }

            const parsed = new URL(url, window.location.origin);
            urlBuilder.classList.remove("empty");
            urlBuilder.dataset.fullUrl = parsed.toString();
            urlBuilder.dataset.origin = parsed.origin;
            urlBuilder.dataset.pathname = parsed.pathname;
            urlBuilder.dataset.hash = parsed.hash || "";
            urlBuilder.title = parsed.toString();

            urlBuilder.appendChild(createUrlSpan("url-segment url-base", parsed.origin));
            urlBuilder.appendChild(createUrlSpan("url-segment url-path", parsed.pathname));

            const params = Array.from(parsed.searchParams.entries());
            if (params.length) {
                urlBuilder.appendChild(createSeparator("?"));
            }

            params.forEach(([key, value], index) => {
                if (index > 0) {
                    urlBuilder.appendChild(createSeparator("&"));
                }

                urlBuilder.appendChild(createUrlSpan("url-key", key));
                urlBuilder.appendChild(createSeparator("="));

                const valueSpan = createUrlSpan("url-value", decodeQueryValueSafe(value));
                valueSpan.setAttribute("contenteditable", "true");
                valueSpan.setAttribute("data-url-value", "true");
                valueSpan.setAttribute("data-key", key);
                valueSpan.spellcheck = false;
                urlBuilder.appendChild(valueSpan);
            });

            if (parsed.hash) {
                urlBuilder.appendChild(createUrlSpan("url-fragment", parsed.hash));
            }
        }

        function setCurrentUrl(url) {
            currentFullUrl = url;
            renderUrlBuilder(url);
        }

        function syncUrlFromBuilder({ updateFrame = false } = {}) {
            const nextUrl = buildUrlFromBuilder();
            if (!nextUrl) {
                return currentFullUrl || urlBuilder.dataset.fullUrl || "";
            }

            currentFullUrl = nextUrl;
            urlBuilder.dataset.fullUrl = nextUrl;
            urlBuilder.title = nextUrl;
            if (updateFrame) {
                frame.src = nextUrl;
            }
            return nextUrl;
        }

        function buildUrlFromBuilder() {
            const origin = urlBuilder.dataset.origin;
            const pathname = urlBuilder.dataset.pathname || "";
            const hash = urlBuilder.dataset.hash || "";

            if (!origin) {
                return "";
            }

            const params = Array.from(urlBuilder.querySelectorAll("[data-url-value]"))
                .map((valueEl) => {
                    const key = valueEl.dataset.key || "";
                    const value = valueEl.textContent || "";
                    return { key, value };
                })
                .filter((param) => param.key);

            const search = params.length
                ? `?${params.map(param => `${encodeURIComponent(param.key)}=${encodeQueryValueSafe(param.value)}`).join("&")}`
                : "";

            return `${origin}${pathname}${search}${hash}`;
        }

        function scheduleUrlUpdate() {
            if (urlUpdateTimer) {
                clearTimeout(urlUpdateTimer);
            }

            urlUpdateTimer = setTimeout(() => {
                syncUrlFromBuilder({ updateFrame: true });
            }, 120);
        }

        function isTextAsset(path) {
            return /\.(html?|js|json)$/i.test(path || "");
        }

        async function resolveDefaultUrl(path) {
            const baseLocation = window.normalizeBaseLocation(window.location);
            const fallback = window.buildFullUrl({
                path,
                baseLocation
            });

            try {
                if (!isTextAsset(path)) {
                    return fallback;
                }

                const res = await fetch(path, { cache: "no-store" });
                if (!res.ok) {
                    return fallback;
                }

                const contentType = res.headers.get("content-type") || "";
                if (
                    contentType
                    && !contentType.startsWith("text/")
                    && !contentType.includes("javascript")
                    && !contentType.includes("json")
                ) {
                    return fallback;
                }

                const sourceText = await res.text();
                const defaultUrl = window.extractDefaultUrlFromSource(sourceText);
                if (!defaultUrl) {
                    return fallback;
                }

                const replaced = defaultUrl.replace(/<HOST_IP>/g, baseLocation.hostname);
                const resolvedUrl = window.applyBaseToUrl({
                    url: replaced,
                    baseLocation
                });

                const merged = window.mergeBaseParams({
                    url: resolvedUrl,
                    baseLocation
                });

                return merged.toString();
            } catch (_) {
                return fallback;
            }
        }

        function select(path) {
            activePath = path;
            const full = window.buildFullUrl({
                path,
                baseLocation: window.location
            });
            const token = ++selectionToken;
            setCurrentUrl(full);
            baseInfo.textContent = `Selected: ${path}`;

            // Load in preview
            frame.src = full;
            render();

            resolveDefaultUrl(path).then((resolved) => {
                if (token !== selectionToken) return;
                if (!resolved || resolved === currentFullUrl) return;
                setCurrentUrl(resolved);
                frame.src = resolved;
            });
        }

        copyBtn.onclick = async () => {
            const text = syncUrlFromBuilder({ updateFrame: true });
            if (!text || text.startsWith("Select")) return;

            try {
                await navigator.clipboard.writeText(text);
                showToast("Copied URL");
            } catch (_) {
                window.prompt("Copy URL:", text);
            }
        };

        openBtn.onclick = () => {
            const text = syncUrlFromBuilder({ updateFrame: true });
            if (!text || text.startsWith("Select")) return;
            window.open(text, "_blank");
        };

        reloadBtn.onclick = () => {
            frame.src = frame.src;
            showToast("Reloaded");
        };

        function setExportStatus(state, detail) {
            const label = detail ? `${state}: ${detail}` : state;
            exportStatus.textContent = label;
        }

        async function pollJobStatus(statusUrl) {
            const res = await fetch(statusUrl, { cache: "no-store" });
            const data = await res.json();
            if (!res.ok || !data.ok) {
                throw new Error(data.error || "status_failed");
            }

            setExportStatus(data.state || "rendering");

            if (data.state === "ready" && data.download_url) {
                const downloadUrl = buildRenderDownloadUrlSafe({
                    downloadBase,
                    downloadPath: data.download_url,
                    filename: data.filename
                });
                downloadBtn.href = downloadUrl;
                if (data.filename) {
                    downloadBtn.download = data.filename;
                }
                downloadBtn.classList.remove("hidden");
                updateExportHistory({
                    url: downloadUrl,
                    name: data.filename || inferNameFromPath(activePath),
                    createdAt: Date.now()
                });
                exportBtn.disabled = false;
                exportBtn.textContent = "Export MOV";
                showToast("Export ready");
                return true;
            }

            if (data.state === "error") {
                exportBtn.disabled = false;
                exportBtn.textContent = "Export MOV";
                setExportStatus("Error", data.error || "render_failed");
                showToast("Export failed");
                return true;
            }

            return false;
        }

        exportBtn.onclick = async () => {
            const text = syncUrlFromBuilder({ updateFrame: true }) || frame.src;
            if (!text || text.startsWith("Select")) {
                showToast("Select a plate first");
                return;
            }

            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }

            exportBtn.textContent = "Queued…";
            exportBtn.disabled = true;
            downloadBtn.classList.add("hidden");
            setExportStatus("Queued");

            try {
                const secondsOverride = secondsInput.value.trim();
                const payload = {
                    url: text,
                    name: inferNameFromPath(activePath),
                    fps: 60,
                    width: 1080,
                    height: 1920
                };

                if (secondsOverride) {
                    payload.seconds = Number(secondsOverride);
                }

                const res = await fetch(`${renderApiBase}/api/render`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (!res.ok || !data.ok) {
                    throw new Error(data.error || "render_failed");
                }

                if (!data.status_url) {
                    throw new Error("missing_status_url");
                }

                const statusUrl = `${renderApiBase}${data.status_url}`;
                setExportStatus("Rendering");

                pollTimer = setInterval(async () => {
                    try {
                        const done = await pollJobStatus(statusUrl);
                        if (done && pollTimer) {
                            clearInterval(pollTimer);
                            pollTimer = null;
                        }
                    } catch (err) {
                        console.error(err);
                        setExportStatus("Error", "status_failed");
                        exportBtn.disabled = false;
                        exportBtn.textContent = "Export MOV";
                        showToast("Export failed");
                        if (pollTimer) {
                            clearInterval(pollTimer);
                            pollTimer = null;
                        }
                    }
                }, 900);
            } catch (err) {
                console.error(err);
                const msg = (err && err.message) ? err.message : String(err);
                showToast("Export failed");
                alert(`Export failed: ${msg}`);
            } finally {
                if (!pollTimer) {
                    exportBtn.textContent = "Export MOV";
                    exportBtn.disabled = false;
                }
            }
        };

        openBrowse.onclick = () => {
            window.open("/browse/", "_blank");
        };

        openDefault.onclick = () => {
            select(PREFERRED_DEFAULT);
        };

        recentBtn.onclick = (event) => {
            event.stopPropagation();
            fetchRecentExports().then((history) => {
                renderExportHistory(history);
                recentMenu.classList.toggle("hidden");
                if (!recentMenu.classList.contains("hidden")) {
                    requestAnimationFrame(positionRecentMenu);
                }
            });
        };

        if (filesToggle) {
            filesToggle.addEventListener("click", () => {
                if (!portraitQuery.matches) {
                    return;
                }
                const isCollapsed = document.body.classList.contains("files-collapsed");
                setFilesCollapsed(!isCollapsed);
            });
        }

        portraitQuery.addEventListener("change", syncFilesCollapseFromViewport);
        syncFilesCollapseFromViewport();

        document.addEventListener("click", (event) => {
            if (recentMenu.classList.contains("hidden")) return;
            if (event.target.closest(".recent-wrap")) return;
            recentMenu.classList.add("hidden");
        });

        window.addEventListener("resize", () => {
            if (recentMenu.classList.contains("hidden")) return;
            positionRecentMenu();
        });

        recentMenu.addEventListener("click", (event) => {
            const item = event.target.closest(".recent-item");
            if (!item) return;
            const entry = {
                url: item.dataset.url,
                name: item.dataset.name,
                createdAt: item.dataset.createdAt ? Number(item.dataset.createdAt) : null,
                sizeBytes: item.dataset.sizeBytes ? Number(item.dataset.sizeBytes) : null
            };
            openExportModal(entry);
            recentMenu.classList.add("hidden");
        });

        exportModalClose.addEventListener("click", closeExportModal);
        exportModal.addEventListener("click", (event) => {
            if (event.target === exportModal) {
                closeExportModal();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !exportModal.classList.contains("hidden")) {
                closeExportModal();
            }
        });

        filterEl.addEventListener("input", render);

        urlBuilder.addEventListener("focusin", (event) => {
            if (!event.target.matches("[data-url-value]")) return;
            event.target.dataset.originalValue = event.target.textContent;
        });

        urlBuilder.addEventListener("input", (event) => {
            if (!event.target.matches("[data-url-value]")) return;
            scheduleUrlUpdate();
        });

        urlBuilder.addEventListener("focusout", (event) => {
            if (!event.target.matches("[data-url-value]")) return;
            scheduleUrlUpdate();
        });

        urlBuilder.addEventListener("keydown", (event) => {
            if (!event.target.matches("[data-url-value]")) return;
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                event.target.blur();
                scheduleUrlUpdate();
            }
            if (event.key === "Escape") {
                event.preventDefault();
                if (event.target.dataset.originalValue !== undefined) {
                    event.target.textContent = event.target.dataset.originalValue;
                }
                event.target.blur();
                scheduleUrlUpdate();
            }
        });

        function pickPreferred() {
            const preferred =
                items.find(p => p === PREFERRED_DEFAULT) ||
                items.find(p => p === "/plate-wall.html") ||
                items.find(p => p === "/plate-procedural.html") ||
                items.find(p => p === "/plate-procedural-enhanced.html") ||
                items.find(p => p.endsWith(".html")) ||
                items[0];

            if (preferred) select(preferred);
        }

        async function boot() {
            const res = await fetch(TREE_URL, { cache: "no-store" });
            const data = await res.json();

            items = (data.files || [])
                .filter(f =>
                    f.endsWith(".html") ||
                    f.endsWith(".mp4") ||
                    f.endsWith(".webm")
                )
                .sort((a, b) => a.localeCompare(b));

            render();
            fetchRecentExports().then(renderExportHistory);
            pickPreferred();
        }

        boot().catch(err => {
            treeEl.innerHTML = "<div style='padding:12px;color:rgba(255,255,255,0.65);font-family:var(--mono);font-size:12px;'>Failed to load /tree.json. Ensure the generator script is running in the container.</div>";
            console.error(err);
        });
    </script>
</body>
</html>
