  SCENES  (left sidebar 01–08)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  01  MEMBRANE      Biopunk pulsing skin. Domain-warped fBm surface with
                    faked surface normals, specular sheen, wet veins.
                    Bass = shockwave that physically warps video beneath it.
                    Mask = amplifies vein density on foreground subject.
                    Video composited as dark underlay.

  02  OSCILLATOR    CRT industrial phosphor scope. 180-sample Lissajous
                    XY trace driven by spectrum. Waveform line + spectrum
                    bars. Beat flash scanline. Phosphor persistence via
                    feedback buffer. Video as dark green tint underlay.

  03  VOID FIELD    64-step SDF raymarcher. Rotating orbiting camera.
                    Spectrum texture displaces shell geometry radially.
                    Smooth-min blend of shell + inner sphere. Fake AO,
                    rim lighting, volume scatter fog glow. Tonemapped.

  04  DATAMOSH      Pixel-sort rows/cols by spectrum amplitude. Datamosh:
                    fBm motion vectors smear previous frame on beat.
                    RGB channel separation driven by treble. Glitch block
                    rows fire on beat hash. Neon edge detection overlay.

  05  CHROMA KEY    Foreground video keyed over fully generative background.
                    Key mask fed from CHROMA mask pass. 5×5 edge feather
                    on mask boundary. Despill removes color cast from edges.
                    Background = spectrum ring + domain-warp nebula + audio.
                    Auto-enables CHROMA mask when selected.

  06  MOT MASK      Visualizes the active mask buffer directly. Neon burn
                    on masked area. Sobel-style edge detection glow at
                    mask boundary. Spectrum-warped boundary shift on bass.
                    Centroid crosshair + tracking circle drawn in-shader.
                    Auto-enables MOTION mask when selected.

  07  PARALLAX      Fake depth segmentation into 3 bands (near/mid/far).
                    Depth proxy = blend of vertical Y position + mask value.
                    Each band UV-shifted by centroid position for parallax.
                    Far band: noise-offset DOF blur + desaturation + haze.
                    Near band: sharpened + contrast boosted.
                    Neon contour lines on depth boundaries.
                    Generative nebula fallback with no video.

  08  SUBJECT       Foreground sharp + cinematic grade, background abstract.
                    FG: warm tone, shadow lift, RMS exposure pump, treble
                    rim light in neon green, despill-style treatment.
                    BG: domain-warp + crushed+cooled video blend + generative.
                    Edge glow at mask boundary driven by RMS + beat.
                    Auto-enables BG SUB mask when selected.

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  MASK MODES  (bottom bar: MASK group, amber buttons)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  OFF       No mask computed. uMask texture = black. Scenes that read
            getMask() receive 0.0 everywhere (FG everywhere).

  MOTION    Frame differencing. Compares current video frame against
            previous frame stored in fbPrevVid. Threshold: smoothstep
            (0.06, 0.18) on pixel delta magnitude * 2.5. Temporally
            smoothed: mix(prevMask * 0.7, newMask, 0.55). Mask value
            1.0 = moving pixel.

  BG SUB    Running average background model. Two GPU passes per frame:
            1) BGUPDATE: lerp bg toward current frame at rate 0.02,
               suppressed by (1 - mask * 0.9) so foreground pixels are
               excluded from model learning.
            2) BGMASK: |current - bg| * 2.2, smoothstep (0.08, 0.22).
            BG model initializes over first ~60 frames. Reset on new
            camera. Mask value 1.0 = differs from background = foreground.

  CHROMA    YCbCr-space chroma distance from picked key color.
            Luma component removed: measures chroma channel distance only.
            Tolerance slider: range 0.05 – 0.60 (default 0.20).
            Color picker: default #00b140 (broadcast green).
            Mask value 1.0 = IS key color (background), 0.0 = foreground.
            NOTE: mask polarity inverted vs MOTION/BGSUB for chroma.

  TRACK       Enables readback pipeline (20Hz) + amber centroid dot HUD.
              Dot position = weighted centroid of mask pixels.
              Opacity = motEnergy clamped to 1.0.
              Centroid fed to scenes as uCX, uCY uniforms.
              Auto-enables MOTION mask if none active.
              Status shown in top-right as TRK X:0.xx Y:0.xx

  PARALLAX    Jumps to scene 07 and enables parallax depth mode.
              centX/centY drive per-band UV offsets.

  TRIGGERS    Enables event trigger system:
              BEAT trigger  — fires on every kick onset detection.
              MOTION trigger — fires when motEnergy > 0.6, debounced 800ms.
              Each trigger: logs to event overlay, fires colored flash div,
              and writes to window.FLUXORGAN.lastEvent.

  MASK VIEW   Shows 100×56px mask preview thumbnail (top-right corner).
              Sampled from readback buffer (64×36). Grayscale: white=masked.

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  GPU PIPELINE  (per frame, in order)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  Each “pass” = 1 full-screen TRIANGLE_STRIP draw call.
  All FBOs = RGBA UNSIGNED_BYTE, LINEAR filtering, CLAMP_TO_EDGE.

  ┌─────────────────────────────────────────────────────────┐
  │  STEP 1 — VIDEO UPLOAD (CPU→GPU)                        │
  │  vidEl → vidTex via gl.texImage2D each frame            │
  │  Y-axis flipped in shader via vidUV(uv) = vec2(x,1-y)  │
  └─────────────────────────────────────────────────────────┘
  ┌─────────────────────────────────────────────────────────┐
  │  STEP 2 — MASK PASS (conditional, based on maskMode)    │
  │                                                         │
  │  maskMode=1 MOTION:                                     │
  │    FS_MOTMASK  →  fbMaskB                               │
  │    reads: vidTex (cur), fbPrevVid (prev), fbMask (prev) │
  │    swap: [fbMask, fbMaskB] = [fbMaskB, fbMask]          │
  │                                                         │
  │  maskMode=2 BG SUB:                                     │
  │    FS_BGUPDATE → fbBG   (update background model)       │
  │    FS_BGMASK   → fbMaskB (compute diff from model)      │
  │    reads: vidTex, fbBG, fbMask                          │
  │    swap: [fbMask, fbMaskB] = [fbMaskB, fbMask]          │
  │                                                         │
  │  maskMode=3 CHROMA:                                     │
  │    FS_CHROMAMASK → fbMaskB                              │
  │    reads: vidTex (+ uKeyColor, uKeyTol uniforms)        │
  │    swap: [fbMask, fbMaskB] = [fbMaskB, fbMask]          │
  └─────────────────────────────────────────────────────────┘
  ┌─────────────────────────────────────────────────────────┐
  │  STEP 3 — READBACK (CPU, max 20Hz, if track/triggers)   │
  │  Downsample fbMask → fbReadback (64×36)                 │
  │  gl.readPixels → rbBuf (Uint8Array 64×36×4)             │
  │  CPU: weighted centroid sum → centX, centY              │
  │  CPU: pixel sum → motEnergy (0..1)                      │
  └─────────────────────────────────────────────────────────┘
  ┌─────────────────────────────────────────────────────────┐
  │  STEP 4 — SCENE RENDER                                  │
  │  sceneProgs[currentScene] → fbScene                     │
  │  reads: uSpec(0), fbPing(1), vidTex(2), fbMask(3), fbBG(4) │
  └─────────────────────────────────────────────────────────┘
  ┌─────────────────────────────────────────────────────────┐
  │  STEP 5 — POST PASS → SCREEN                            │
  │  FS_POST → null (canvas)                                │
  │  Chromatic aberration (TREB+BEAT driven split)          │
  │  Scanlines: sin(y * res.y * 1.5) ^ 8 * 0.05            │
  │  Grain: hash(uv*res + fract(T*197)) * 0.04 - 0.02       │
  │  Vignette: pow(1 - len(p)*1.55, 1.3)                   │
  │  Halation: bright-pixel glow via lum threshold          │
  └─────────────────────────────────────────────────────────┘
  ┌─────────────────────────────────────────────────────────┐
  │  STEP 6 — PING-PONG COPY                                │
  │  FS_POST(fbScene) → fbPing  (prev frame for next tick)  │
  │                                                         │
  │  STEP 6B — PREV VIDEO COPY (motion mask only)           │
  │  FS_POST(vidTex) → fbPrevVid  (prev raw frame)          │
  └─────────────────────────────────────────────────────────┘

  FRAMEBUFFER INVENTORY:
  fbPing      W×H   Previous composite frame (feedback source)
  fbPong      W×H   Unused reserve (available for second feedback)
  fbScene     W×H   Current scene render before post
  fbMask      W×H   Active mask (ping) — swapped each frame
  fbMaskB     W×H   Active mask (pong) — swapped each frame
  fbBG        W×H   Running background model (BG SUB mode)
  fbPrevVid   W×H   Previous raw video frame (motion diff source)
  fbReadback  64×36 Downsampled mask for CPU readback

  TEXTURE UNITS (every shader):
  TEXTURE0 → uSpec   256×1 RGBA  Spectrum (FFT bins as grayscale)
  TEXTURE1 → uFB     W×H  RGBA   Previous frame / ping-pong source
  TEXTURE2 → uVid    W×H  RGBA   Live video frame (camera or clip)
  TEXTURE3 → uMask   W×H  RGBA   Current mask buffer (.r channel used)
  TEXTURE4 → uBG     W×H  RGBA   Background model texture

  vec2  R          Canvas size in pixels
  float T          Elapsed seconds (performance.now * 0.001)
  float BASS       0..1  FFT bins 0–5   (~20–215 Hz avg)
  float MID        0..1  FFT bins 6–30  (~215–1290 Hz avg)
  float TREB       0..1  FFT bins 31–100 (~1.3–4.3 kHz avg)
  float RMS        0..1  Root-mean-square of all 256 bins
  float BEAT       0..1  Decays 0.038/frame, spiked to 1.0 on onset
  float uMOT       0..1  Motion energy from 64×36 readback
  float uCX        0..1  Centroid X (from readback weighted sum)
  float uCY        0..1  Centroid Y (from readback weighted sum, Y-flipped)
  float uHasVid    0 or 1   Video texture active
  float uMaskMode  0=off 1=motion 2=bgsub 3=chroma
  float uParallax  0=off 1=on
  float uScene     0..7  Current scene index
  vec3  uKeyColor  RGB 0..1   Chroma key color (from color picker)
  float uKeyTol    0.05..0.60 Chroma key tolerance (from slider)
  float uLearning  0.02  BG model update rate (masked pixels excluded)

  GLSL COMMON HELPERS (injected into every shader via COMMON string):
  float hash(vec2)          Fast 2D hash → 0..1
  float noise(vec2)         Smooth value noise
  float fbm(vec2)           6-octave fBm (fractal Brownian motion)
  vec2  warp(vec2, float)   Domain warp using fBm (strength param)
  float spec(float t)       Sample spectrum texture at t ∈ [0,1]
  vec3  palDark(float t)    Dark iq-cosine palette with neon accent spikes
                            a=(0.05,0.06,0.08) b=(0.04,0.05,0.06)
                            c=(1,1,1) d=(0,0.15,0.25)
  vec2  squareP(vec2 uv)    Normalize UV to square aspect-safe coords
                            max(asp,1/asp) normalization * 0.6 scale
  vec2  vidUV(vec2 uv)      Flip video Y: vec2(uv.x, 1.0-uv.y)
  float getMask(vec2 uv)    Sample mask texture .r channel

  AudioContext → AnalyserNode → destination
  fftSize = 512  (256 bins)
  smoothingTimeConstant = 0.82
  getByteFrequencyData() → fftData[256] each frame

  Band ranges (bin indices, ~43Hz/bin at 44100Hz sample rate):
    BASS  bins  0–5    sum/5
    MID   bins  6–30   sum/25
    TREB  bins 31–100  sum/70
    RMS   sqrt(sum(v²)/256) across all bins

  Beat detector:
    43-frame rolling average of bass energy (beatHist ring buffer)
    Onset: bassNow > avg * 1.38  AND  bassNow > 0.12
    200ms debounce gate (lastBeat)
    beat float: spiked to 1.0 on onset, decays 0.038 per frame
    BPM: rolling average of last 8 inter-onset intervals

  Sources:
    MIC   → getUserMedia({audio:true}) → MediaStreamSource
    TAB   → getDisplayMedia({audio:true,video:true}) → MediaStreamSource
    FILE  → <audio> element → MediaElementSource

  MOBILE / IOS COMPATIBILITY NOTES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  Must run on HTTPS or localhost (getUserMedia requirement)
  iOS Safari: no tab audio capture (getDisplayMedia not supported)
  iOS GLSL compiler is stricter than desktop:
    ✗ “. 5” (space in float literal) — will crash shader compilation
    ✗ “1e9” scientific notation — use 99999.0 instead
    ✗ bool variables declared mid-scope + used after loop break
      → use float hitT = -1.0; check hitT > 0.0 instead
    ✗ mediump may lose precision on some effects — use highp throughout
  squareP() uses max(asp, 1/asp) normalization * 0.6 to keep
  geometry within viewport on both portrait and landscape

  1. Write const FS_MYSCENE = COMMON + `void main(){...}`;
     All COMMON uniforms + helpers available automatically.
  2. Add mkP(FS_MYSCENE) to sceneProgs[] array.
  3. Add a <button class=“sc-btn” data-s=“N”> to #scenes in HTML.
  4. Add scene name string to sceneNames[] array.
  5. Update cycleScene() modulus if needed (currently %8).
  6. Optionally add auto-mask logic in setScene() switch.

  ADDING A NEW MASK MODE
  1. Write const FS_MYMASK = COMMON + `void main(){...}`;
     Output: gl_FragColor = vec4(maskVal, maskVal, maskVal, 1.0)
     maskVal 0.0 = foreground, 1.0 = background (chroma convention)
     or 1.0 = detected, 0.0 = not detected (motion/bgsub convention)
  2. Add to maskProgs object: { mymode: mkP(FS_MYMASK) }
  3. Add draw call to the mask section of render() with correct FBO routing.
  4. Add button + setMask(n) call.
-->

<script>
// ═══════════════════════════════════════════════════════════════════════
//  WEBGL
// ═══════════════════════════════════════════════════════════════════════
const C=document.getElementById('c');
const gl=C.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:false});
if(!gl){document.body.innerHTML='<p style="color:red;padding:40px">WebGL required</p>';}

function resize(){
  C.width=innerWidth; C.height=innerHeight;
  gl.viewport(0,0,C.width,C.height);
  rebuildFBOs();
  // resize zone overlay
  const zo=document.getElementById('zoneOverlay');
  zo.width=innerWidth; zo.height=innerHeight;
}
window.addEventListener('resize',resize);

// ═══════════════════════════════════════════════════════════════════════
//  GLSL COMMON
// ═══════════════════════════════════════════════════════════════════════
const VS=`attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;

const COMMON=`
precision highp float;
uniform vec2  R;
uniform float T,BASS,MID,TREB,RMS,BEAT;
uniform float uMOT;         // motion energy 0..1
uniform float uCX,uCY;      // centroid 0..1
uniform float uHasVid;
uniform float uMaskMode;    // 0=off 1=motion 2=bgsub 3=chroma
uniform float uParallax;    // 0=off 1=on
uniform float uScene;
uniform sampler2D uSpec,uFB,uVid,uMask,uBG;
uniform vec3  uKeyColor;
uniform float uKeyTol;

float hash(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+19.19);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*noise(p);p=p*2.1+vec2(1.3,7.1);a*=.5;}return v;}
vec2 warp(vec2 p,float s){float wx=fbm(p+vec2(T*.08,0)),wy=fbm(p+vec2(0,T*.08)+4.5);return p+(vec2(wx,wy)-.5)*s;}
float spec(float t){return texture2D(uSpec,vec2(clamp(t,0.,1.),.5)).r;}
vec3 palDark(float t){
  vec3 a=vec3(.05,.06,.08),b=vec3(.04,.05,.06),c=vec3(1.),d=vec3(.0,.15,.25);
  vec3 base=a+b*cos(6.2832*(c*t+d));
  float acc=pow(max(0.,1.-abs(fract(t*3.)-.5)*6.),.5);
  return base+vec3(.1,.9,.5)*acc*.6;}
vec2 squareP(vec2 uv){float asp=R.x/R.y,n=max(asp,1./asp);return(uv-.5)*vec2(asp,1.)/n*.6;}
vec2 vidUV(vec2 uv){return vec2(uv.x,1.-uv.y);}

// Sample mask buffer (R channel)
float getMask(vec2 uv){return texture2D(uMask,uv).r;}
`;

// ───────────────────────────────────────────────
// PASS 1A: MOTION MASK  (frame diff)
// ───────────────────────────────────────────────
const FS_MOTMASK=COMMON+`
void main(){
  vec2 uv=gl_FragCoord.xy/R;
  vec3 cur=texture2D(uVid,vidUV(uv)).rgb;
  vec3 prv=texture2D(uFB,uv).rgb;   // uFB = prev video frame here
  float d=length(cur-prv)*2.5;
  // temporal smooth with previous mask
  float pm=texture2D(uMask,uv).r;
  float m=smoothstep(.06,.18,d);
  m=mix(pm*.7,m,.55);  // temporal smoothing
  gl_FragColor=vec4(m,m,m,1.);
}`;

// ───────────────────────────────────────────────
// PASS 1B: BG MODEL UPDATE  (running average)
// ───────────────────────────────────────────────
const FS_BGUPDATE=COMMON+`
uniform float uLearning; // 0.02 normally, 0 when person present
void main(){
  vec2 uv=gl_FragCoord.xy/R;
  vec3 cur=texture2D(uVid,vidUV(uv)).rgb;
  vec3 bg=texture2D(uBG,uv).rgb;
  float mask=getMask(uv);
  float rate=uLearning*(1.-mask*.9); // don't learn where mask says foreground
  gl_FragColor=vec4(mix(bg,cur,rate),1.);
}`;

// ───────────────────────────────────────────────
// PASS 1C: BG SUBTRACTION MASK
// ───────────────────────────────────────────────
const FS_BGMASK=COMMON+`
void main(){
  vec2 uv=gl_FragCoord.xy/R;
  vec3 cur=texture2D(uVid,vidUV(uv)).rgb;
  vec3 bg=texture2D(uBG,uv).rgb;
  float d=length(cur-bg)*2.2;
  float pm=texture2D(uMask,uv).r;
  float m=smoothstep(.08,.22,d);
  m=mix(pm*.75,m,.5);
  gl_FragColor=vec4(m,m,m,1.);
}`;

// ───────────────────────────────────────────────
// PASS 1D: CHROMA KEY MASK
// ───────────────────────────────────────────────
const FS_CHROMAMASK=COMMON+`
void main(){
  vec2 uv=gl_FragCoord.xy/R;
  vec3 c=texture2D(uVid,vidUV(uv)).rgb;
  // convert to YCbCr-ish chroma distance
  vec3 key=uKeyColor;
  // measure chroma distance (ignore luma)
  float yd=dot(c-key,vec3(.299,.587,.114));
  vec3 chroma=c-key-yd*vec3(.299,.587,.114);
  float d=length(chroma);
  float m=1.-smoothstep(uKeyTol*.5,uKeyTol,d); // 1 = IS key color
  // despill: reduce green cast on edges
  m=clamp(m,0.,1.);
  gl_FragColor=vec4(m,m,m,1.); // 1=background(green), 0=foreground
}`;

// ───────────────────────────────────────────────
// SCENE 0: MEMBRANE (biopunk) — mask modulates vein density
// ───────────────────────────────────────────────
const FS_MEMBRANE=COMMON+`
void main(){
  vec2 uv=gl_FragCoord.xy/R;
  vec2 p=squareP(uv);
  float mask=getMask(uv);

  float shock=BASS*.06+BEAT*.04;
  vec2 shockUV=uv+(normalize(p+.001)*shock*exp(-length(p)*3.));
  vec4 vidCol=texture2D(uVid,vidUV(clamp(shockUV,0.,1.)))*uHasVid;

  float specDisp=spec(length(p)*1.4)*(.3+BASS*.5);
  vec2 wp=warp(p*2.+T*.06,1.2+BASS*3.);
  float membrane=fbm(wp+specDisp);
  float eps=.008;
  float dx=fbm(wp+vec2(eps,0)+specDisp)-fbm(wp-vec2(eps,0)+specDisp);
  float dy=fbm(wp+vec2(0,eps)+specDisp)-fbm(wp-vec2(0,eps)+specDisp);
  vec3 N=normalize(vec3(dx,dy,.15));
  vec3 L=normalize(vec3(sin(T*.3),cos(T*.2),1.));
  float diff=max(0.,dot(N,L));
  float spec2=pow(max(0.,dot(reflect(-L,N),vec3(0,0,1))),12.);
  vec3 base=palDark(membrane*.7+TREB*.2+T*.008)*(.3+RMS*.8);
  vec3 lit=base*(0.4+diff*.8)+vec3(.2,1.,.6)*spec2*(.5+RMS);
  float sheen=pow(1.-abs(dot(N,vec3(0,0,1))),3.)*(.6+TREB*.8);
  lit+=vec3(.05,.8,.4)*sheen*.4;
  // veins stronger on masked/foreground area
  float veinDrive=.3+MID*.6+mask*.8;
  float vein=pow(abs(sin(membrane*18.+T*.5)),20.)*veinDrive;
  lit+=vec3(.6,.05,.1)*vein;
  vec3 col=mix(lit,lit*.4+vidCol.rgb*.7,uHasVid*.7);
  vec3 fb=texture2D(uFB,uv+vec2(dx,dy)*.002).rgb;
  col=mix(col,fb,.18+BEAT*.08);
  col*=1.-smoothstep(.4,.9,length(p)*1.4);
  gl_FragColor=vec4(col,1.);
}`;

// ───────────────────────────────────────────────
// SCENE 1: OSCILLATOR
// ───────────────────────────────────────────────
const FS_OSC=COMMON+`
void main(){
  vec2 uv=gl_FragCoord.xy/R;
  vec2 p=squareP(uv);
  vec3 col=vec3(0.,.02,.01)*(.5+RMS);
  vec2 grid=fract(p*vec2(14.,10.)+T*.01);
  float gline=smoothstep(.04,.03,min(grid.x,grid.y))*.06*(1.+MID*.5);
  col+=vec3(0.,.4,.15)*gline;
  float best=99999.0;
  for(int i=0;i<180;i++){
    float fi=float(i)/180.;
    float fx=fi*6.2832*3.,fy=fi*6.2832*2.+T*.8;
    vec2 lp=vec2(sin(fx+BASS*2.)*(0.28+spec(fi)*.18),sin(fy+MID*1.5)*(0.28+spec(1.-fi)*.18));
    best=min(best,length(p-lp));
  }
  col+=vec3(.1,1.,.5)*exp(-best*80.)*(1.5+RMS*3.);
  float wf=exp(-pow(p.y-(spec(uv.x)*(.25+BASS*.2)-.12),2.)*1200.)*(1.+MID*2.);
  col+=vec3(.05,.9,.4)*wf;
  float bAmp=spec(uv.x)*(.35+BASS*.3);
  col+=vec3(.05,.7,.3)*step(.48-bAmp*.4,uv.y)*step(uv.y,.481)*(.6+RMS);
  col+=vec3(.2,1.,.5)*step(.499,uv.y)*step(uv.y,.501)*BEAT*3.;
  col=mix(col,col*.3+texture2D(uVid,vidUV(uv)).rgb*.2*vec3(.2,.9,.4),uHasVid*.5);
  col=mix(col,texture2D(uFB,uv).rgb,.25);
  col*=1.-smoothstep(.45,.95,length(p)*1.6);
  gl_FragColor=vec4(col,1.);
}`;

// ───────────────────────────────────────────────
// SCENE 2: VOID FIELD (raymarch)
// ───────────────────────────────────────────────
const FS_VOID=COMMON+`
float smin(float a,float b,float k){float h=max(k-abs(a-b),0.)/k;return min(a,b)-h*h*k*.25;}
float map(vec3 q){
  float ang=atan(q.z,q.x)*.15915+.5;
  float sAmp=spec(ang)*(.4+BASS*.6);
  float r=length(q.xz);
  float shell=abs(r-(0.7+sAmp+sin(q.y*4.+T)*MID*.15))-.03;
  float inner=length(q)-.25-BEAT*.15;
  float ridges=abs(sin(q.y*12.+T*2.)*sin(ang*28.+T))*.04;
  return smin(shell-ridges,inner,.1);
}
vec3 nrm(vec3 p){vec2 e=vec2(.002,0);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}
void main(){
  vec2 uv=gl_FragCoord.xy/R;
  vec2 p=squareP(uv);
  vec3 ro=vec3(sin(T*.12)*1.8,cos(T*.07)*.4,cos(T*.12)*1.8);
  vec3 fwd=normalize(-ro),rgt=normalize(cross(fwd,vec3(0,1,0))),up=cross(rgt,fwd);
  vec3 rd=normalize(fwd+p.x*rgt+p.y*up);

  for(int i=0;i<64;i++){float d=map(ro+rd*t2);if(d<.002){hitT=t2;break;}if(t2>6.)break;t2+=d*.6;}
  vec3 col=vec3(0.);
  if(hitT>0.){
    vec3 hp=ro+rd*hitT,N=nrm(hp);
    float ao=1.;for(int k=0;k<4;k++){float s=.05*float(k+1);ao-=(s-map(hp+N*s))*.25;}
    vec3 L=normalize(vec3(sin(T*.5),1.,cos(T*.3)));
    float diff=max(0.,dot(N,L)),rim=pow(1.-max(0.,dot(N,-rd)),3.);
    vec3 base=palDark(atan(hp.z,hp.x)*.15915+.5+T*.02+TREB*.3)*(diff*.6+.2)*ao;
    base+=vec3(.05,.8,.35)*rim*(.4+RMS*.8)+vec3(.8,.1,.05)*pow(diff,8.)*.3;
    col=base;
  }
  float glow=0.,gt=0.;
  for(int i=0;i<20;i++){glow+=exp(-abs(map(ro+rd*(gt+.1)))*12.)*.05;gt+=.15;}
  col+=palDark(T*.01+TREB*.2)*glow*(.5+RMS*1.5);
  col=mix(col,col+texture2D(uVid,vidUV(uv)).rgb*.15,uHasVid*.6);
  col=mix(col,texture2D(uFB,uv+rd.xy*.001).rgb,.12+BEAT*.05);
  col=col/(col+1.);col=pow(col,vec3(.45));
  gl_FragColor=vec4(col,1.);
}`;

function mkS(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))
    console.error(gl.getShaderInfoLog(s).substring(0,500));
  return s;
}
function mkP(fs){
  const p=gl.createProgram();
  gl.attachShader(p,mkS(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,mkS(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));
  return p;
}

function mkFBO(w,h,type=gl.UNSIGNED_BYTE){
  const fb=gl.createFramebuffer(),tx=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,type,null);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tx,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {fb,tx,w,h};
}
// small readback FBO for centroid
const RB_W=64,RB_H=36;
let fbPing,fbPong,fbScene,fbMask,fbMaskB,fbBG,fbPrevVid,fbReadback;
function rebuildFBOs(){
  [fbPing,fbPong,fbScene,fbMask,fbMaskB,fbBG,fbPrevVid].forEach(f=>{if(f){gl.deleteTexture(f.tx);gl.deleteFramebuffer(f.fb);}});
  const W=C.width,H=C.height;
  fbPing=mkFBO(W,H);fbPong=mkFBO(W,H);fbScene=mkFBO(W,H);
  fbMask=mkFBO(W,H);fbMaskB=mkFBO(W,H);
  fbBG=mkFBO(W,H);fbPrevVid=mkFBO(W,H);
  if(!fbReadback)fbReadback=mkFBO(RB_W,RB_H);
}

let keyColor=[0,0.69,0.25];

function setU(prog,extras={}){
  const u=n=>gl.getUniformLocation(prog,n);
  gl.uniform2f(u('R'),C.width,C.height);
  gl.uniform1f(u('T'),extras.T||0);
  gl.uniform1f(u('BASS'),bass);gl.uniform1f(u('MID'),mid);
  gl.uniform1f(u('TREB'),treble);gl.uniform1f(u('RMS'),rms);gl.uniform1f(u('BEAT'),beat);
  gl.uniform1f(u('uMOT'),motEnergy);
  gl.uniform1f(u('uCX'),centX);gl.uniform1f(u('uCY'),centY);
  gl.uniform1f(u('uHasVid'),hasVideo?1:0);
  gl.uniform1f(u('uMaskMode'),maskMode);
  gl.uniform1f(u('uParallax'),parallaxOn?1:0);
  gl.uniform1f(u('uScene'),currentScene);
  gl.uniform3fv(u('uKeyColor'),keyColor);
  gl.uniform1f(u('uKeyTol'),keyTol);
  gl.uniform1f(u('uLearning'),.02);

  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,specTex);gl.uniform1i(u('uSpec'),0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,(extras.fb||fbPing).tx);gl.uniform1i(u('uFB'),1);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,vidTex);gl.uniform1i(u('uVid'),2);
  gl.activeTexture(gl.TEXTURE3);gl.bindTexture(gl.TEXTURE_2D,(extras.mask||fbMask).tx);gl.uniform1i(u('uMask'),3);
  gl.activeTexture(gl.TEXTURE4);gl.bindTexture(gl.TEXTURE_2D,fbBG.tx);gl.uniform1i(u('uBG'),4);
}

function drawFull(prog,fbo,extras={}){

  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER,qBuf);bindQ(prog);
  setU(prog,extras);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

function doReadback(ts){
  if(ts-readbackThrottle<50)return; // max 20Hz

  gl.bindFramebuffer(gl.FRAMEBUFFER,fbReadback.fb);
  gl.viewport(0,0,RB_W,RB_H);
  gl.useProgram(postProg);
  gl.bindBuffer(gl.ARRAY_BUFFER,qBuf);bindQ(postProg);
  // pass mask as FB to post (it just reads uFB)
  setU(postProg,{fb:fbMask});
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  gl.readPixels(0,0,RB_W,RB_H,gl.RGBA,gl.UNSIGNED_BYTE,rbBuf);

  let sumX=0,sumY=0,sumW=0;
  for(let y=0;y<RB_H;y++){
    for(let x=0;x<RB_W;x++){
      const v=rbBuf[(y*RB_W+x)*4]/255;
      sumX+=x*v; sumY+=y*v; sumW+=v;
    }
  }
  if(sumW>5){
    centX=sumX/sumW/RB_W;
    centY=1-(sumY/sumW/RB_H);
  }
  motEnergy=Math.min(1,sumW/(RB_W*RB_H*0.15));
}

// ═══════════════════════════════════════════════════════════════════════
//  WEBAUDIO
// ═══════════════════════════════════════════════════════════════════════
let actx,analyser,srcNode,fftData=new Uint8Array(SPEC_N);
let bass=0,mid=0,treble=0,rms=0,beat=0;
let beatHist=new Array(43).fill(0),beatPtr=0,lastBeat=0,bpmBuf=[],bpmVal=0;

function initACtx(){
  if(!actx){
    actx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=actx.createAnalyser();
    analyser.fftSize=SPEC_N*2;analyser.smoothingTimeConstant=.82;
    analyser.connect(actx.destination);
  }
}
function killSrc(){if(srcNode){try{srcNode.disconnect()}catch(e){}srcNode=null;}}
async function startMic(){initACtx();killSrc();
  const s=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
  srcNode=actx.createMediaStreamSource(s);srcNode.connect(analyser);setAUI('MIC');}
async function startTab(){initACtx();killSrc();
  const s=await navigator.mediaDevices.getDisplayMedia({audio:true,video:true});
  srcNode=actx.createMediaStreamSource(s);srcNode.connect(analyser);setAUI('TAB');}
function startAFile(f){initACtx();killSrc();
  const a=document.getElementById('aEl');a.src=URL.createObjectURL(f);a.play();
  srcNode=actx.createMediaElementSource(a);srcNode.connect(analyser);setAUI('FILE');}
function setAUI(l){
  ['bMic','bTab','bFile'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById('b'+l[0]+l.slice(1).toLowerCase()).classList.add('on');
  document.getElementById('sdot').className='live';
  document.getElementById('slbl').textContent=l+' ACTIVE';}

function analyzeAudio(){
  if(!analyser)return;
  analyser.getByteFrequencyData(fftData);
  let bS=0,mS=0,tS=0,rS=0;
  for(let i=0;i<SPEC_N;i++){
    const v=fftData[i]/255;
    if(i<=5)bS+=v;else if(i<=30)mS+=v;else if(i<=100)tS+=v;
    rS+=v*v;
  }
  bass=Math.min(1,bS/5);mid=Math.min(1,mS/25);treble=Math.min(1,tS/70);
  rms=Math.min(1,Math.sqrt(rS/SPEC_N));
  beatHist[beatPtr%43]=bS/5;beatPtr++;
  const avg=beatHist.reduce((a,b)=>a+b,0)/43,now=performance.now();
  if(bass>avg*1.38&&bass>.12&&now-lastBeat>180){
    beat=1;const dt=now-lastBeat;
    if(dt<2000){bpmBuf.push(60000/dt);if(bpmBuf.length>8)bpmBuf.shift();
      bpmVal=Math.round(bpmBuf.reduce((a,b)=>a+b,0)/bpmBuf.length);}
    lastBeat=now;
    if(autoScene&&beatCount%32===0)cycleScene();
    beatCount++;
    if(triggersOn)fireTrigger('BEAT');
    document.getElementById('beatfl').style.opacity=(.06+bass*.1).toFixed(2);
    setTimeout(()=>document.getElementById('beatfl').style.opacity='0',55);
  }
  beat=Math.max(0,beat-.038);
  // motion trigger
  if(triggersOn&&motEnergy>.6&&now-lastMotTrig>800){
    fireTrigger('MOTION');lastMotTrig=now;}
  // upload spectrum
  for(let i=0;i<SPEC_N;i++){const v=fftData[i];specData[i*4]=specData[i*4+1]=specData[i*4+2]=v;specData[i*4+3]=255;}
  gl.bindTexture(gl.TEXTURE_2D,specTex);
  gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,SPEC_N,1,gl.RGBA,gl.UNSIGNED_BYTE,specData);
}

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
async function buildCamSel(){
  try{
    const devices=await navigator.mediaDevices.enumerateDevices();
    const cams=devices.filter(d=>d.kind==='videoinput');
    const sel=document.getElementById('camSel');
    const prev=sel.value;sel.innerHTML='';
    cams.forEach((cam,i)=>{const o=document.createElement('option');o.value=cam.deviceId;o.textContent=cam.label||'Cam '+(i+1);sel.appendChild(o);});
    if(prev)sel.value=prev;
  }catch(e){}
}
async function startCam(){
  try{
    if(vidEl&&vidEl.srcObject)vidEl.srcObject.getTracks().forEach(t=>t.stop());
    const sel=document.getElementById('camSel');
    const deviceId=sel.value;
    const s=await navigator.mediaDevices.getUserMedia({
      video:deviceId?{deviceId:{exact:deviceId}}:{facingMode:'environment'},audio:false});
    vidEl=document.getElementById('vid');
    vidEl.srcObject=s;await vidEl.play();
    hasVideo=true;setVUI('CAM');
    await buildCamSel();if(deviceId)sel.value=deviceId;
    // reset BG model on new camera
    bgModelReady=false;bgFrameCount=0;
  }catch(e){alert('Camera: '+e.message);}
}
function startVFile(f){
  vidEl=document.getElementById('vidSrc');
  vidEl.src=URL.createObjectURL(f);vidEl.play();
  hasVideo=true;setVUI('CLIP');bgModelReady=false;bgFrameCount=0;
}
function stopVideo(){
  if(vidEl&&vidEl.srcObject)vidEl.srcObject.getTracks().forEach(t=>t.stop());
  if(vidEl)vidEl.src='';
  vidEl=null;hasVideo=false;setVUI('OFF');
  gl.bindTexture(gl.TEXTURE_2D,vidTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
}
function setVUI(s){
  ['bCam','bVid','bVOff'].forEach(id=>document.getElementById(id).classList.remove('on'));
  const m={CAM:'bCam',CLIP:'bVid',OFF:'bVOff'};
  document.getElementById(m[s]).classList.add('on');
}

// ═══════════════════════════════════════════════════════════════════════
//  SCENE / MASK / FX STATE
// ═══════════════════════════════════════════════════════════════════════
let currentScene=0,autoScene=true,beatCount=0;
let maskMode=0; // 0=off 1=motion 2=bgsub 3=chroma
let trackOn=false,parallaxOn=false,triggersOn=false,maskPrevOn=false;
let bgModelReady=false,bgFrameCount=0;
let lastMotTrig=0;

const sceneNames=[
  'SCN_01 MEMBRANE','SCN_02 OSCILLATOR','SCN_03 VOID FIELD','SCN_04 DATAMOSH',
  'SCN_05 CHROMA KEY','SCN_06 MOT MASK','SCN_07 PARALLAX','SCN_08 SUBJECT'
];

function setScene(n){
  currentScene=n;
  document.querySelectorAll('.sc-btn').forEach((b,i)=>b.classList.toggle('on',i===n));
  document.getElementById('sceneTag').textContent='// '+sceneNames[n];
  document.getElementById('sscn').textContent='SCN '+(n+1)+'/8';
  // auto-enable useful mask for new scene
  if(n===4&&maskMode!==3)setMask(3); // chroma scene → chroma mask
  if(n===5&&maskMode===0)setMask(1); // motion vis → motion mask
  if(n===7&&maskMode===0)setMask(2); // subject → bgsub
}
function cycleScene(){setScene((currentScene+1)%8);}

function setMask(m){
  maskMode=m;
  ['bMaskOff','bMaskMot','bMaskBG','bMaskChroma'].forEach((id,i)=>document.getElementById(id).classList.toggle('on',i===m));
  const maskNames=['MASK: OFF','MASK: MOTION','MASK: BG SUB','MASK: CHROMA'];
  document.getElementById('maskTag').textContent=m>0?maskNames[m]:'';
  document.getElementById('chromaRow').style.display=m===3?'flex':'none';
}

// EVENT LOG
function logEv(msg){
  const el=document.getElementById('evlog');
  const d=document.createElement('div');
  d.className='evlog-line';d.textContent='> '+msg;
  el.appendChild(d);
  setTimeout(()=>d.remove(),2200);
  // expose to window for OBS/external
  window.FLUXORGAN=window.FLUXORGAN||{};
  window.FLUXORGAN.lastEvent={type:msg,ts:Date.now(),centX,centY,motEnergy,bass,rms};
}
function fireTrigger(type){
  logEv(type);
  // visual flash
  const gfl=document.getElementById('gfl');
  const colors={BEAT:'rgba(255,45,78,0.12)',MOTION:'rgba(57,255,143,0.1)',SCENE:'rgba(0,238,255,0.1)'};
  gfl.style.background=colors[type]||'rgba(255,255,255,0.08)';
  gfl.style.opacity='1';
  setTimeout(()=>{gfl.style.opacity='0';},80);
}

// CHROMA KEY COLOR PICKER
document.getElementById('chromaColor').addEventListener('input',e=>{
  const hex=e.target.value;
  const r=parseInt(hex.slice(1,3),16)/255;
  const g=parseInt(hex.slice(3,5),16)/255;
  const b=parseInt(hex.slice(5,7),16)/255;
  keyColor=[r,g,b];
});
document.getElementById('chromaTol').addEventListener('input',e=>{keyTol=parseFloat(e.target.value);});

// MASK PREVIEW (renders mask to 2D canvas each frame)
const mpCanvas=document.getElementById('maskPrev');
const mpCtx=mpCanvas.getContext('2d');
mpCanvas.width=100;mpCanvas.height=56;
const mpBuf=new Uint8Array(100*56*4);
function updateMaskPreview(){
  if(!maskPrevOn)return;
  // sample from readback buffer
  for(let i=0;i<mpBuf.length;i+=4){
    const v=rbBuf[Math.floor(i/4*4/100*RB_W/56*RB_H)*4]||0; // rough sample
    mpBuf[i]=v;mpBuf[i+1]=v;mpBuf[i+2]=v;mpBuf[i+3]=255;
  }
  const img=new ImageData(new Uint8ClampedArray(mpBuf),100,56);
  mpCtx.putImageData(img,0,0);
}

// TRACKING DOT + ZONE DRAW
function updateTrackHUD(){
  const dot=document.getElementById('centroidDot');
  if(trackOn&&motEnergy>.05){
    dot.style.display='block';
    dot.style.left=(centX*100)+'%';
    dot.style.top=((1-centY)*100)+'%';
    dot.style.opacity=Math.min(1,motEnergy*2).toFixed(2);
    document.getElementById('strk').textContent=
      'TRK X:'+(centX).toFixed(2)+' Y:'+(centY).toFixed(2);
  } else {
    dot.style.display='none';
    document.getElementById('strk').textContent='TRK —';
  }
}

// expose state to window (OBS/external layer)
function updateWindowState(){
  window.FLUXORGAN=window.FLUXORGAN||{};
  Object.assign(window.FLUXORGAN,{
    scene:currentScene,maskMode,
    bass,mid,treble,rms,beat,
    motEnergy,centX,centY,bpmVal,
    hasVideo,triggersOn
  });
}

// ═══════════════════════════════════════════════════════════════════════
//  MINI SPECTRUM
// ═══════════════════════════════════════════════════════════════════════
const sc2=document.getElementById('sc2'),s2=sc2.getContext('2d');
sc2.width=140;sc2.height=40;
function drawMiniSpec(){
  s2.clearRect(0,0,140,40);
  s2.fillStyle='rgba(0,0,0,.5)';s2.fillRect(0,0,140,40);
  for(let i=0;i<56;i++){
    const v=(fftData[i*2]||0)/255,h=v*38;
    s2.fillStyle=`rgba(${Math.floor(v*30)},${Math.floor(140+v*115)},${Math.floor(50+v*70)},.9)`;
    s2.fillRect(i*2.5,40-h,2,h);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  UI METERS
// ═══════════════════════════════════════════════════════════════════════
function updateUI(){
  const sm=(id,vid,v)=>{document.getElementById(id).style.width=(v*100)+'%';document.getElementById(vid).textContent=v.toFixed(2);};
  sm('mB','vB',bass);sm('mM','vM',mid);sm('mT','vT',treble);sm('mR','vR',rms);
  sm('mMot','vMot',motEnergy);
  const bd=document.getElementById('bdot');
  bd.style.background=beat>.3?`rgba(57,255,143,${beat})`:'transparent';
  bd.style.boxShadow=beat>.3?`0 0 ${beat*14}px rgba(57,255,143,.8)`:'none';
  if(bpmVal)document.getElementById('sbpm').textContent=bpmVal+' BPM';
  const me=document.getElementById('smot');
  me.textContent='MOT '+motEnergy.toFixed(2);
  me.className=motEnergy>.4?'warn':motEnergy>.1?'live':'dead';
}

// ═══════════════════════════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════════════════════════
let lastFT=performance.now(),fCnt=0;

function render(ts){
  requestAnimationFrame(render);
  fCnt++;
  if(ts-lastFT>500){
    document.getElementById('sfps').textContent=Math.round(fCnt*1000/(ts-lastFT))+' FPS';
    fCnt=0;lastFT=ts;
  }
  const t=ts*.001;
  analyzeAudio();
  uploadVideoFrame();
  drawMiniSpec();

  // ── MASK PIPELINE ─────────────────────────────────────────
  if(maskMode===1){
    // motion: use prev video frame as reference
    drawFull(maskProgs.motion,fbMaskB,{fb:fbPrevVid,mask:fbMask,T:t});
    // ping-pong mask buffers
    [fbMask,fbMaskB]=[fbMaskB,fbMask];
  } else if(maskMode===2){
    // BG sub: update BG model first
    if(!bgModelReady){
      // fast init: copy current frame as initial BG
      drawFull(maskProgs.bgupdate,fbBG,{fb:fbBG,mask:fbMask,T:t});
      bgFrameCount++;
      if(bgFrameCount>60)bgModelReady=true;
    } else {
      drawFull(maskProgs.bgupdate,fbBG,{fb:fbBG,mask:fbMask,T:t});
    }
    drawFull(maskProgs.bgmask,fbMaskB,{fb:fbBG,mask:fbMask,T:t});
    [fbMask,fbMaskB]=[fbMaskB,fbMask];
  } else if(maskMode===3){
    drawFull(maskProgs.chroma,fbMaskB,{fb:fbMask,mask:fbMask,T:t});
    [fbMask,fbMaskB]=[fbMaskB,fbMask];
  }

  // ── READBACK (centroid / motion energy) ───────────────────
  if(trackOn||triggersOn)doReadback(ts);

  // ── SCENE RENDER ──────────────────────────────────────────
  drawFull(sceneProgs[currentScene],fbScene,{T:t,fb:fbPing,mask:fbMask});

  // ── POST ──────────────────────────────────────────────────
  drawFull(postProg,null,{T:t,fb:fbScene,mask:fbMask}); // → screen

  // ── STORE PREV VIDEO FRAME (for motion diff) ──────────────
  if(maskMode===1){
    drawFull(postProg,fbPrevVid,{T:t,fb:fbScene,mask:fbMask});
    // actually we want raw video not scene — hack: sample vid directly
    // we reuse postProg to copy vidTex into fbPrevVid by routing through scene
    // Better: just blit the raw current frame
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbPrevVid.fb);
    gl.viewport(0,0,fbPrevVid.w,fbPrevVid.h);
    gl.useProgram(postProg);
    gl.bindBuffer(gl.ARRAY_BUFFER,qBuf);bindQ(postProg);
    // pass current vidTex as uFB so post just copies it
    setU(postProg,{T:t,fb:{tx:vidTex}});
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  }

  // ── PING PONG ─────────────────────────────────────────────
  drawFull(postProg,fbPing,{T:t,fb:fbScene});
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);

  // ── CPU SIDE UPDATES ──────────────────────────────────────
  updateUI();
  updateTrackHUD();
  updateMaskPreview();
  updateWindowState();
}
requestAnimationFrame(render);

// ═══════════════════════════════════════════════════════════════════════
//  EVENT WIRING
// ═══════════════════════════════════════════════════════════════════════
document.getElementById('bMic').addEventListener('click',startMic);
document.getElementById('bTab').addEventListener('click',startTab);
document.getElementById('bFile').addEventListener('click',()=>document.getElementById('fAud').click());
document.getElementById('fAud').addEventListener('change',e=>{if(e.target.files[0])startAFile(e.target.files[0]);});
document.getElementById('bCam').addEventListener('click',startCam);
document.getElementById('camSel').addEventListener('change',()=>{if(hasVideo)startCam();});
document.getElementById('bVid').addEventListener('click',()=>document.getElementById('fVid').click());
document.getElementById('fVid').addEventListener('change',e=>{if(e.target.files[0])startVFile(e.target.files[0]);});
document.getElementById('bVOff').addEventListener('click',stopVideo);

document.querySelectorAll('.sc-btn').forEach(b=>{
  b.addEventListener('click',()=>{autoScene=false;document.getElementById('bAuto').classList.remove('on');setScene(+b.dataset.s);});
});
document.getElementById('bAuto').addEventListener('click',function(){autoScene=!autoScene;this.classList.toggle('on',autoScene);});

document.getElementById('bMaskOff').addEventListener('click',()=>setMask(0));
document.getElementById('bMaskMot').addEventListener('click',()=>setMask(1));
document.getElementById('bMaskBG').addEventListener('click',()=>setMask(2));
document.getElementById('bMaskChroma').addEventListener('click',()=>setMask(3));

document.getElementById('bTrack').addEventListener('click',function(){
  trackOn=!trackOn;this.classList.toggle('on',trackOn);
  document.getElementById('centroidDot').style.display='none';
  if(trackOn&&maskMode===0)setMask(1);
  logEv(trackOn?'TRACK ON':'TRACK OFF');
});
document.getElementById('bParallax').addEventListener('click',function(){
  parallaxOn=!parallaxOn;this.classList.toggle('on',parallaxOn);
  if(parallaxOn){setScene(6);logEv('PARALLAX ON');}
});
document.getElementById('bTrigger').addEventListener('click',function(){
  triggersOn=!triggersOn;this.classList.toggle('on',triggersOn);
  logEv(triggersOn?'TRIGGERS ON':'TRIGGERS OFF');
});
document.getElementById('bMaskPrev').addEventListener('click',function(){
  maskPrevOn=!maskPrevOn;this.classList.toggle('on',maskPrevOn);
  document.getElementById('maskPrev').style.display=maskPrevOn?'block':'none';
});

// KEYBOARD
window.addEventListener('mousemove',e=>{const c=document.getElementById('cur');c.style.left=e.clientX+'px';c.style.top=e.clientY+'px';});
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='m')startMic();
  if(k==='t')startTab();
  if(k==='c')startCam();
  if(k>='1'&&k<='8')setScene(+k-1);
  if(k===' '){autoScene=!autoScene;document.getElementById('bAuto').classList.toggle('on',autoScene);}
  if(k==='q')setMask(0);
  if(k==='w')setMask(1);
  if(k==='e')setMask(2);
  if(k==='r')setMask(3);
  if(k==='x'){trackOn=!trackOn;document.getElementById('bTrack').classList.toggle('on',trackOn);}
});

setVUI('OFF');
buildCamSel();
logEv('FLUX.cdaPRO v3 READY');
</script>
