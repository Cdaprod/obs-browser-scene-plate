<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID.WAVE — Audio Visualizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --acid: #00ffaa;
    --glitch: #ff003c;
    --dim: rgba(0,0,0,0.7);
    --panel: rgba(5,5,10,0.85);
    --border: rgba(0,255,170,0.25);
  }

  body {
    background: #000;
    color: var(--acid);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: none;
  }

  #canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Custom cursor */
  #cursor {
    position: fixed;
    width: 12px; height: 12px;
    border: 1px solid var(--acid);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
    mix-blend-mode: screen;
    transition: transform 0.1s ease;
  }

  /* HUD overlay */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
  }

  /* Title */
  #title {
    position: fixed;
    top: 28px;
    left: 32px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: 0.3em;
    color: #fff;
    text-shadow: 0 0 20px var(--acid), 0 0 60px var(--acid);
    pointer-events: none;
    z-index: 200;
    mix-blend-mode: screen;
  }
  #title span { color: var(--acid); }

  /* Controls panel */
  #controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 28px;
    background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
    z-index: 200;
    flex-wrap: wrap;
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .ctrl-label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: rgba(0,255,170,0.5);
    text-transform: uppercase;
  }

  /* Source buttons */
  .src-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: rgba(0,255,170,0.5);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .src-btn:hover, .src-btn.active {
    border-color: var(--acid);
    color: var(--acid);
    background: rgba(0,255,170,0.07);
    box-shadow: 0 0 12px rgba(0,255,170,0.2);
  }
  .src-btn.active {
    background: rgba(0,255,170,0.12);
  }

  /* File input */
  #fileInput { display: none; }

  /* Meters */
  .meter-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 120px;
  }
  .meter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.55rem;
    letter-spacing: 0.1em;
  }
  .meter-row span:first-child {
    width: 36px;
    color: rgba(0,255,170,0.45);
    flex-shrink: 0;
  }
  .meter-bar-outer {
    flex: 1;
    height: 3px;
    background: rgba(0,255,170,0.1);
    position: relative;
    overflow: hidden;
  }
  .meter-bar-inner {
    height: 100%;
    background: var(--acid);
    width: 0%;
    transition: width 0.05s linear;
    box-shadow: 0 0 6px var(--acid);
  }
  .meter-val {
    width: 30px;
    text-align: right;
    color: rgba(0,255,170,0.6);
  }

  /* Status line */
  #status {
    position: fixed;
    top: 28px;
    right: 32px;
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    color: rgba(0,255,170,0.4);
    z-index: 200;
    pointer-events: none;
    text-align: right;
    line-height: 1.8;
  }
  #status .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--glitch);
    margin-right: 6px;
    animation: pulse 1s ease-in-out infinite;
  }
  #status .dot.live { background: var(--acid); }

  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

  /* Spectrum mini display */
  #specCanvas {
    position: fixed;
    right: 32px;
    bottom: 80px;
    width: 180px;
    height: 50px;
    opacity: 0.55;
    z-index: 200;
    border-bottom: 1px solid var(--border);
  }

  /* Scanline overlay from CSS */
  #scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.04) 2px,
      rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
    z-index: 150;
    mix-blend-mode: multiply;
  }

  /* Corner decorations */
  .corner {
    position: fixed;
    width: 40px; height: 40px;
    z-index: 200;
    pointer-events: none;
    opacity: 0.4;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: var(--acid);
  }
  .corner::before { width: 1px; height: 100%; }
  .corner::after  { width: 100%; height: 1px; }
  .c-tl { top: 16px; left: 16px; }
  .c-tr { top: 16px; right: 16px; transform: scaleX(-1); }
  .c-bl { bottom: 16px; left: 16px; transform: scaleY(-1); }
  .c-br { bottom: 16px; right: 16px; transform: scale(-1); }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<canvas id="specCanvas"></canvas>

<div id="cursor"></div>
<div id="scanlines"></div>

<div class="corner c-tl"></div>
<div class="corner c-tr"></div>
<div class="corner c-bl"></div>
<div class="corner c-br"></div>

<div id="title">VOID<span>.</span>WAVE</div>

<div id="status">
  <div><span class="dot" id="srcDot"></span><span id="srcLabel">NO SOURCE</span></div>
  <div id="bpmDisplay">BPM —</div>
  <div id="fpsDisplay">— FPS</div>
</div>

<div id="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">Source</span>
    <button class="src-btn" id="btnMic">MIC</button>
    <button class="src-btn" id="btnTab">TAB</button>
    <button class="src-btn" id="btnFile">FILE</button>
    <input type="file" id="fileInput" accept="audio/*,video/*">
  </div>

  <div class="ctrl-group meter-wrap" id="meters">
    <div class="meter-row">
      <span>BASS</span>
      <div class="meter-bar-outer"><div class="meter-bar-inner" id="mBass"></div></div>
      <span class="meter-val" id="vBass">0.00</span>
    </div>
    <div class="meter-row">
      <span>MID</span>
      <div class="meter-bar-outer"><div class="meter-bar-inner" id="mMid"></div></div>
      <span class="meter-val" id="vMid">0.00</span>
    </div>
    <div class="meter-row">
      <span>TREB</span>
      <div class="meter-bar-outer"><div class="meter-bar-inner" id="mTreb"></div></div>
      <span class="meter-val" id="vTreb">0.00</span>
    </div>
    <div class="meter-row">
      <span>RMS</span>
      <div class="meter-bar-outer"><div class="meter-bar-inner" id="mRms"></div></div>
      <span class="meter-val" id="vRms">0.00</span>
    </div>
  </div>

  <div class="ctrl-group" style="margin-left:auto;">
    <span class="ctrl-label">Beat</span>
    <div id="beatFlash" style="width:14px;height:14px;border:1px solid var(--border);border-radius:50%;transition:all 0.05s;"></div>
  </div>
</div>

<!-- Hidden audio element for file playback -->
<audio id="audioEl" crossorigin="anonymous" style="display:none;" controls></audio>

<script>
// ─────────────────────────────────────────────────────────────
//  WEBGL SETUP
// ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if (!gl) { document.body.innerHTML = '<h1 style="color:red;padding:40px">WebGL not supported</h1>'; }

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();
// ─── SHADERS ───────────────────────────────────────────────
const VS = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const FS = `
precision highp float;

uniform vec2  u_res;
uniform float u_time;
uniform float u_bass;
uniform float u_mid;
uniform float u_treble;
uniform float u_rms;
uniform float u_beat;
uniform sampler2D u_spectrum;  // 1D spectrum texture (256x1)

// ── hash / noise helpers ───────────────────────────────────
float hash(vec2 p) {
  p = fract(p * vec2(127.1, 311.7));
  p += dot(p, p + 19.19);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  return mix(
    mix(hash(i), hash(i+vec2(1,0)), f.x),
    mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y
  );
}

float fbm(vec2 p) {
  float v=0.0, a=0.5;
  for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.1+vec2(1.3,7.1); a*=0.5; }
  return v;
}

// ── spectrum sample ────────────────────────────────────────
float spec(float t) {
  return texture2D(u_spectrum, vec2(t, 0.5)).r;
}

// ── SDF shapes ────────────────────────────────────────────
float sdCircle(vec2 p, float r) { return length(p)-r; }
float sdHex(vec2 p, float r) {
  const vec3 k = vec3(-0.866025, 0.5, 0.577350);
  p = abs(p);
  p -= 2.0*min(dot(k.xy,p),0.0)*k.xy;
  p -= vec2(clamp(p.x,-k.z*r,k.z*r), r);
  return length(p)*sign(p.y);
}
float sdStar(vec2 p, float r, float n, float m) {
  float an = 3.14159/n, en = 3.14159/m;
  vec2 acs = vec2(cos(an),sin(an)), ecs = vec2(cos(en),sin(en));
  float bn = mod(atan(p.y,p.x), 2.0*an) - an;
  p = length(p)*vec2(cos(bn),abs(sin(bn)));
  p -= r*acs;
  p += ecs*clamp(-dot(p,ecs), 0.0, r*acs.y/ecs.y);
  return length(p)*sign(p.x);
}

// ── glitch offset ─────────────────────────────────────────
vec2 glitchUV(vec2 uv, float t) {
  float g = u_beat * 0.04 + u_treble * 0.015;
  float s = floor(uv.y * 40.0) / 40.0;
  float r = hash(vec2(s, floor(t*12.0)));
  float shift = (r-0.5) * g * step(0.85, r);
  return uv + vec2(shift, 0.0);
}

// ── RGB split ─────────────────────────────────────────────
vec3 rgbSplit(vec2 uv, float amt) {
  float r = spec(uv.x + amt);
  float g_ch = spec(uv.x);
  float b_ch = spec(uv.x - amt);
  return vec3(r, g_ch, b_ch) * 0.8;
}

// ── Palette ───────────────────────────────────────────────
vec3 palette(float t, float treb) {
  // Treble shifts hue — goes from cold teal → acid green → electric magenta → deep violet
  float h = t + treb * 0.45 + u_time * 0.015;
  vec3 a = vec3(0.5);
  vec3 b = vec3(0.5);
  vec3 c = vec3(1.0, 1.0, 0.9);
  vec3 d = vec3(0.00, 0.33, 0.67);
  return a + b * cos(6.28318 * (c*h + d));
}

// ── Domain warp ───────────────────────────────────────────
vec2 warp(vec2 p, float bass, float time) {
  float wx = fbm(p + vec2(time*0.12, 0.0));
  float wy = fbm(p + vec2(0.0, time*0.12) + 4.5);
  return p + (vec2(wx,wy) - 0.5) * (0.6 + bass * 2.2);
}

void main() {
  vec2 uv  = gl_FragCoord.xy / u_res;
  vec2 guv = glitchUV(uv, u_time);
  vec2 p = (guv - 0.5) * (u_res / min(u_res.x, u_res.y)) * 2.0;

  float t = u_time;
  float bass   = u_bass;
  float mid    = u_mid;
  float treble = u_treble;
  float rms    = u_rms;
  float beat   = u_beat;

  // ── Layer 0: Cosmic nebula base ──────────────────────────
  vec2 wp = warp(p * 1.8, bass, t * 0.3);
  float nebula = fbm(wp + t * 0.07);
  float nebula2 = fbm(wp * 2.0 - t * 0.05 + 1.7);
  vec3 nebulaCol = palette(nebula, treble) * nebula2 * (0.7 + rms * 1.5);

  // ── Layer 1: Spectrum warp ring ──────────────────────────
  float angle = atan(p.y, p.x);
  float radius = length(p);
  float normAngle = (angle / 6.28318) + 0.5;
  float specAmp = spec(normAngle);
  float specRing = abs(radius - (0.25 + bass * 0.18 + specAmp * 0.22));
  float ring = smoothstep(0.015, 0.0, specRing);
  vec3 ringCol = palette(normAngle + t*0.05, treble) * (1.5 + rms*2.0);

  // ── Layer 2: Inner geometric core ───────────────────────
  float rot = t * 0.4 + bass * 2.0;
  float cr = cos(rot), sr = sin(rot);
  vec2 rp = vec2(cr*p.x - sr*p.y, sr*p.x + cr*p.y);

  float rot2 = -t * 0.25 + mid * 1.5;
  float cr2 = cos(rot2), sr2 = sin(rot2);
  vec2 rp2 = vec2(cr2*p.x - sr2*p.y, sr2*p.x + cr2*p.y);

  float coreScale = 0.12 + bass * 0.1 + beat * 0.06;
  float hex = sdHex(rp, coreScale);
  float star = sdStar(rp2, coreScale * 1.6, 6.0, 2.5);
  float circ = sdCircle(p, coreScale * 0.6);

  float geoGlow = exp(-abs(hex) * 30.0) * (1.0 + beat * 3.0);
  float starGlow = exp(-abs(star) * 20.0) * (0.8 + mid * 2.0);
  float circGlow = exp(-abs(circ) * 50.0) * rms;

  vec3 geoCol = palette(0.1 + treble * 0.3, treble) * geoGlow;
  vec3 starCol = palette(0.6 + treble * 0.2 + t*0.03, treble) * starGlow;
  vec3 circCol = vec3(0.0, 1.0, 0.7) * circGlow;

  // ── Layer 3: Spectrum bars (radial) ─────────────────────
  float barAngle = mod(angle + 3.14159, 6.28318) / 6.28318;
  float barAmp = spec(barAngle) * (0.4 + bass * 0.5);
  float innerR = 0.28 + bass * 0.12;
  float outerR = innerR + barAmp;
  float inBar = step(innerR, radius) * step(radius, outerR);
  float barWidth = 0.004 / (abs(barAngle - 0.5) * 0.5 + 0.1);
  vec3 barCol = palette(barAngle + t*0.04, treble) * inBar * (0.9 + rms);

  // ── Layer 4: Grid distortion (glitch geo) ───────────────
  vec2 grid = fract(p * (8.0 + mid * 8.0) + vec2(t * 0.05));
  float gridLine = smoothstep(0.04, 0.03, min(grid.x, grid.y));
  float gridDist = length(p);
  gridLine *= smoothstep(0.8, 0.3, gridDist) * (0.15 + beat * 0.5 + mid * 0.3);
  vec3 gridCol = palette(mid + t*0.02, treble) * gridLine;

  // ── Layer 5: Scanline + noise grain ─────────────────────
  float scanline = sin(guv.y * u_res.y * 1.5 + t * 2.0) * 0.5 + 0.5;
  scanline = pow(scanline, 6.0) * 0.08 * (1.0 + rms * 0.5);
  float grain = hash(guv * u_res + fract(t * 137.13)) * 0.06;

  // ── Layer 6: Bloom / vignette ───────────────────────────
  float vignette = 1.0 - length(p) * (0.8 - rms * 0.4);
  vignette = clamp(pow(vignette, 1.5), 0.0, 1.0);

  float bloom = exp(-length(p) * (3.0 - rms * 2.0)) * rms * 2.0;
  vec3 bloomCol = palette(t * 0.02, treble) * bloom;

  // ── Layer 7: Beat flash ──────────────────────────────────
  float flashR = 1.0 - smoothstep(0.0, 0.5, length(p - vec2(0.0)));
  vec3 flash = palette(beat * 0.3, treble) * beat * flashR * 0.4;

  // ── Composite ───────────────────────────────────────────
  vec3 col = vec3(0.0);
  col += nebulaCol * 0.35;
  col += gridCol;
  col += ringCol * ring * 2.0;
  col += barCol * 1.2;
  col += geoCol;
  col += starCol;
  col += circCol;
  col += bloomCol;
  col += flash;

  col *= vignette;
  col += vec3(scanline);
  col += vec3(grain);

  // RGB glitch split on treble peaks
  if (treble > 0.5) {
    float splitAmt = (treble - 0.5) * 0.008;
    float rr = texture2D(u_spectrum, vec2(uv.x + splitAmt, 0.5)).r;
    float bb = texture2D(u_spectrum, vec2(uv.x - splitAmt, 0.5)).r;
    col.r += rr * treble * 0.3;
    col.b += bb * treble * 0.3;
  }

  // Tone map + gamma
  col = col / (col + 1.0);
  col = pow(col, vec3(0.4545));

  gl_FragColor = vec4(col, 1.0);
}
`;
function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader error:', gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);

// Full-screen quad
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// Uniforms
const U = {};
['u_res','u_time','u_bass','u_mid','u_treble','u_rms','u_beat','u_spectrum']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

// Spectrum texture (256 x 1)
const specTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, specTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const SPEC_SIZE = 256;
const specData = new Uint8Array(SPEC_SIZE * 4);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SPEC_SIZE, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, specData);

// ─────────────────────────────────────────────────────────────
//  WEBAUDIO PIPELINE
// ─────────────────────────────────────────────────────────────
let audioCtx = null;
let analyser = null;
let sourceNode = null;
let fftData = new Uint8Array(SPEC_SIZE);

let bass = 0, mid = 0, treble = 0, rms = 0, beat = 0;
let currentSource = null; // 'mic'|'tab'|'file'

function initAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = SPEC_SIZE * 2;
    analyser.smoothingTimeConstant = 0.8;
    analyser.connect(audioCtx.destination);
  }
}

function disconnectSource() {
  if (sourceNode) {
    try { sourceNode.disconnect(); } catch(e) {}
    sourceNode = null;
  }
}

async function startMic() {
  initAudioCtx();
  disconnectSource();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    sourceNode = audioCtx.createMediaStreamSource(stream);
    sourceNode.connect(analyser);
    setSourceUI('mic');
  } catch(e) { alert('Mic access denied: ' + e.message); }
}

async function startTab() {
  initAudioCtx();
  disconnectSource();
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: true });
    sourceNode = audioCtx.createMediaStreamSource(stream);
    sourceNode.connect(analyser);
    setSourceUI('tab');
  } catch(e) { alert('Tab capture failed: ' + e.message); }
}

function startFile(file) {
  initAudioCtx();
  disconnectSource();
  const audioEl = document.getElementById('audioEl');
  audioEl.src = URL.createObjectURL(file);
  audioEl.play();
  sourceNode = audioCtx.createMediaElementSource(audioEl);
  sourceNode.connect(analyser);
  setSourceUI('file');
}

function setSourceUI(src) {
  currentSource = src;
  document.querySelectorAll('.src-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn' + src.charAt(0).toUpperCase() + src.slice(1)).classList.add('active');
  const dot = document.getElementById('srcDot');
  dot.className = 'dot live';
  document.getElementById('srcLabel').textContent = src.toUpperCase() + ' ACTIVE';
}

document.getElementById('btnMic').addEventListener('click', startMic);
document.getElementById('btnTab').addEventListener('click', startTab);
document.getElementById('btnFile').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e => {
  if (e.target.files[0]) startFile(e.target.files[0]);
});

// ─────────────────────────────────────────────────────────────
//  AUDIO ANALYSIS
// ─────────────────────────────────────────────────────────────
// Beat detection (simple peak detector)
let beatEnergy = 0, beatHistory = new Array(43).fill(0), beatPtr = 0;
let lastBeatTime = 0, bpmAccum = [], displayBpm = 0;

function analyzeAudio() {
  if (!analyser) return;
  analyser.getByteFrequencyData(fftData);

  // Bands (fftSize=512 → 256 bins, ~43Hz/bin at 44100)
  const BASS_END = 5, MID_END = 30, TREB_END = 100;
  let bSum=0, mSum=0, tSum=0, rSum=0;
  for(let i=0;i<SPEC_SIZE;i++){
    const v = fftData[i]/255;
    if(i <= BASS_END) bSum += v;
    else if(i <= MID_END) mSum += v;
    else if(i <= TREB_END) tSum += v;
    rSum += v*v;
  }
  const bLen = BASS_END, mLen = MID_END-BASS_END, tLen = TREB_END-MID_END;
  bass   = Math.min(1, bSum/bLen);
  mid    = Math.min(1, mSum/mLen);
  treble = Math.min(1, tSum/tLen);
  rms    = Math.min(1, Math.sqrt(rSum/SPEC_SIZE));

  // Beat: compare bass energy vs average
  const bassNow = bSum/bLen;
  beatHistory[beatPtr % 43] = bassNow;
  beatPtr++;
  const avg = beatHistory.reduce((a,b)=>a+b,0)/43;
  if(bassNow > avg * 1.4 && bassNow > 0.15) {
    const now = performance.now();
    if(now - lastBeatTime > 200) {
      beat = 1.0;
      const dt = now - lastBeatTime;
      if(dt < 2000) {
        bpmAccum.push(60000/dt);
        if(bpmAccum.length > 8) bpmAccum.shift();
        displayBpm = Math.round(bpmAccum.reduce((a,b)=>a+b,0)/bpmAccum.length);
      }
      lastBeatTime = now;
    }
  }
  beat = Math.max(0, beat - 0.04);
}

// ─────────────────────────────────────────────────────────────
//  MINI SPECTRUM CANVAS
// ─────────────────────────────────────────────────────────────
const specCanvas = document.getElementById('specCanvas');
const sCtx = specCanvas.getContext('2d');
specCanvas.width = 180; specCanvas.height = 50;

function drawMiniSpec() {
  sCtx.clearRect(0,0,180,50);
  sCtx.fillStyle = 'rgba(0,0,0,0.4)';
  sCtx.fillRect(0,0,180,50);
  const barW = 180/64;
  for(let i=0;i<64;i++){
    const v = (fftData[i*2] || 0)/255;
    const h = v*48;
    const r = Math.floor(v*50);
    const g = Math.floor(80 + v*175);
    sCtx.fillStyle = `rgb(${r},${g},120)`;
    sCtx.fillRect(i*barW, 50-h, barW-1, h);
  }
}

// ─────────────────────────────────────────────────────────────
//  UI METERS
// ─────────────────────────────────────────────────────────────
function updateMeters() {
  const set = (id, vid, val) => {
    document.getElementById(id).style.width = (val*100)+'%';
    document.getElementById(vid).textContent = val.toFixed(2);
  };
  set('mBass','vBass', bass);
  set('mMid','vMid', mid);
  set('mTreb','vTreb', treble);
  set('mRms','vRms', rms);

  const bf = document.getElementById('beatFlash');
  bf.style.background = beat > 0.3 ? `rgba(0,255,170,${beat})` : 'transparent';
  bf.style.boxShadow = beat > 0.3 ? `0 0 ${beat*20}px rgba(0,255,170,0.8)` : 'none';
  bf.style.borderColor = beat > 0.3 ? 'var(--acid)' : 'var(--border)';

  if(displayBpm) document.getElementById('bpmDisplay').textContent = displayBpm + ' BPM';
}

// ─────────────────────────────────────────────────────────────
//  RENDER LOOP
// ─────────────────────────────────────────────────────────────
let lastFpsTime = performance.now(), frameCount = 0;

function render(ts) {
  requestAnimationFrame(render);

  // FPS
  frameCount++;
  if(ts - lastFpsTime > 500) {
    document.getElementById('fpsDisplay').textContent =
      Math.round(frameCount*1000/(ts-lastFpsTime)) + ' FPS';
    frameCount = 0; lastFpsTime = ts;
  }

  analyzeAudio();
  drawMiniSpec();
  updateMeters();

  // Upload spectrum texture
  for(let i=0;i<SPEC_SIZE;i++){
    const v = fftData[i];
    specData[i*4]   = v;
    specData[i*4+1] = v;
    specData[i*4+2] = v;
    specData[i*4+3] = 255;
  }
  gl.bindTexture(gl.TEXTURE_2D, specTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, SPEC_SIZE, 1, gl.RGBA, gl.UNSIGNED_BYTE, specData);

  // Uniforms
  gl.uniform2f(U.u_res, canvas.width, canvas.height);
  gl.uniform1f(U.u_time, ts * 0.001);
  gl.uniform1f(U.u_bass,   bass);
  gl.uniform1f(U.u_mid,    mid);
  gl.uniform1f(U.u_treble, treble);
  gl.uniform1f(U.u_rms,    rms);
  gl.uniform1f(U.u_beat,   beat);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, specTex);
  gl.uniform1i(U.u_spectrum, 0);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

requestAnimationFrame(render);

// ─────────────────────────────────────────────────────────────
//  CURSOR
// ─────────────────────────────────────────────────────────────
const cur = document.getElementById('cursor');
window.addEventListener('mousemove', e => {
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
});

// ─────────────────────────────────────────────────────────────
//  KEYBOARD SHORTCUTS
// ─────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if(e.key === 'm' || e.key === 'M') startMic();
  if(e.key === 't' || e.key === 'T') startTab();
  if(e.key === 'f' || e.key === 'F') document.getElementById('fileInput').click();
  if(e.key === 'F11' || e.key === 'f' && e.ctrlKey) canvas.requestFullscreen?.();
});
</script>
