<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>tap-3d-ping-blur</title>

<style>
:root{
  /* Position */
  --x: 0.50;          /* 0..1 (viewport) */
  --y: 0.50;          /* 0..1 (viewport) */
  --offsetY: 0px;

  /* Size + depth */
  --r: 66px;          /* base radius */
  --lift: 12px;
  --tiltX: 14deg;
  --tiltY: -18deg;

  /* Accent */
  --accent: 180,220,255;   /* rgb */
  --accent2: 120,190,255;
  --white: 255,255,255;

  /* Timing */
  --in-ms: 110;
  --out-ms: 650;
  --pulse-ms: 620;
  --rings: 3;

  /* === TRUE glass blur (backdrop-filter) ===
     NOTE: This only works if the Browser Source supports backdrop-filter.
     If it doesn't, we fall back to a diffusion bloom that still looks good. */
  --glass: 1;               /* 1 enable, 0 disable */
  --glass-size: 760px;      /* diameter of glass region */
  --glass-alpha: 0.16;      /* opacity of the glass panel */
  --glass-blur: 18px;       /* backdrop blur strength */
  --glass-sat: 1.20;        /* saturate underlying pixels */
  --glass-bright: 1.06;     /* brighten underlying pixels */
  --glass-tint: 0.10;       /* 0..0.25 tint with accent in the glass */
  --glass-feather: 0.78;    /* 0..1.0 larger = softer edge */

  /* Diffusion fallback (works even if backdrop-filter is unsupported) */
  --bloom-alpha: 0.18;      /* 0..0.45 */
  --bloom-blur: 26px;       /* css blur amount */

  /* Shadow */
  --shadowA: rgba(0,0,0,0.34);
  --shadowB: rgba(0,0,0,0.58);

  /* SFX */
  --sfx: 1;
  --vol: 0.55;
  --pitch: 1.00;
  --sfxType: hybrid;        /* ping|click|hybrid */
  --click: 0.70;            /* 0..1  (how “clicky”/noisy) */
  --tone: 0.65;             /* 0..1  (how “tonal”/pingy) */
  --freq: 520;              /* base frequency before pitch */

  /* Behavior */
  --mode: burst;            /* burst|loop */
  --hold: 0;                /* ms hold before fade */
  --interval: 900;          /* loop interval */
}

/* Transparent page (OBS alpha) */
html, body{
  height:100%;
  margin:0;
  background: transparent !important;
  overflow:hidden;
}
#stage{
  position:absolute;
  inset:0;
  pointer-events:none;
}

/* Anchor at (x,y) */
#anchor{
  position:absolute;
  left: calc(var(--x) * 100vw);
  top:  calc(var(--y) * 100vh);
  transform: translate(-50%, -50%) translateY(var(--offsetY));
  width: 1px;
  height: 1px;
}

/* ------------------------------------------------------------------ */
/* Glass blur panel (radial mask + backdrop-filter)                    */
/* ------------------------------------------------------------------ */
#glass{
  position:absolute;
  left:50%;
  top:50%;
  width: var(--glass-size);
  height: var(--glass-size);
  transform: translate(-50%,-50%);
  border-radius: 999px;
  opacity: 0;
  will-change: opacity, transform;

  /* a faint translucent surface (required so blur reads as "glass") */
  background:
    radial-gradient(circle at 50% 50%,
      rgba(255,255,255, calc(var(--glass-alpha) * 1.00)) 0%,
      rgba(255,255,255, calc(var(--glass-alpha) * 0.55)) 26%,
      rgba(255,255,255, 0.0) 70%);

  /* the actual blur */
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));

  /* tint + edge */
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255, 0.10),
    0 0 56px rgba(var(--accent2), 0.10);

  /* feathered edge via mask */
  -webkit-mask-image: radial-gradient(circle at 50% 50%,
    rgba(0,0,0,1.0) 0%,
    rgba(0,0,0,1.0) calc(54% * var(--glass-feather)),
    rgba(0,0,0,0.0) 72%);
  mask-image: radial-gradient(circle at 50% 50%,
    rgba(0,0,0,1.0) 0%,
    rgba(0,0,0,1.0) calc(54% * var(--glass-feather)),
    rgba(0,0,0,0.0) 72%);

  mix-blend-mode: screen;
}

/* A subtle tinted wash that sits on top of the blur */
#glassTint{
  position:absolute;
  inset:0;
  border-radius: 999px;
  background: radial-gradient(circle at 50% 50%,
    rgba(var(--accent), calc(var(--glass-alpha) * var(--glass-tint))) 0%,
    rgba(var(--accent2), calc(var(--glass-alpha) * 0.08)) 38%,
    rgba(255,255,255, 0.0) 72%);
  filter: blur(10px);
  opacity: 0.9;
}

/* ------------------------------------------------------------------ */
/* Diffusion fallback (if backdrop-filter isn't supported)             */
/* ------------------------------------------------------------------ */
#bloom{
  position:absolute;
  left:50%;
  top:50%;
  width: var(--glass-size);
  height: var(--glass-size);
  transform: translate(-50%,-50%);
  border-radius: 999px;

  background:
    radial-gradient(circle at 50% 50%,
      rgba(var(--white), calc(var(--bloom-alpha) * 0.95)) 0%,
      rgba(var(--white), calc(var(--bloom-alpha) * 0.55)) 12%,
      rgba(var(--accent), calc(var(--bloom-alpha) * 0.10)) 36%,
      rgba(var(--accent2), calc(var(--bloom-alpha) * 0.08)) 52%,
      rgba(var(--white), 0.0) 72%);

  filter: blur(var(--bloom-blur)) saturate(1.1) brightness(1.03);
  opacity: 0;
  will-change: opacity, transform;
  mix-blend-mode: screen;
}

/* ------------------------------------------------------------------ */
/* The 3D puck                                                         */
/* ------------------------------------------------------------------ */
#tap{
  position:absolute;
  left:0;
  top:0;
  width: calc(var(--r) * 2);
  height: calc(var(--r) * 2);
  transform:
    translate(-50%, -50%)
    perspective(700px)
    rotateX(var(--tiltX))
    rotateY(var(--tiltY))
    translateZ(0px);
  transform-style: preserve-3d;
  opacity:0;
  filter: drop-shadow(0 18px 22px var(--shadowA)) drop-shadow(0 34px 64px var(--shadowB));
  will-change: transform, opacity;
}

#face{
  position:absolute;
  inset: 0;
  border-radius: 999px;

  background:
    radial-gradient(circle at 28% 26%,
      rgba(var(--white), 0.92) 0%,
      rgba(var(--white), 0.22) 18%,
      rgba(var(--accent), 0.18) 34%,
      rgba(var(--accent2), 0.10) 58%,
      rgba(0,0,0,0.00) 72%),
    radial-gradient(circle at 50% 60%,
      rgba(0,0,0,0.10) 0%,
      rgba(0,0,0,0.00) 56%);

  border: 1px solid rgba(var(--white), 0.18);
  box-shadow:
    inset 0 0 0 1px rgba(var(--accent), 0.16),
    inset 0 -16px 40px rgba(0,0,0,0.18),
    0 0 26px rgba(var(--accent2), 0.18);
}

#arc{
  position:absolute;
  inset: 10%;
  border-radius: 999px;
  background: conic-gradient(
    from 210deg,
    rgba(var(--white), 0.00) 0deg,
    rgba(var(--white), 0.55) 22deg,
    rgba(var(--white), 0.00) 62deg,
    rgba(var(--white), 0.00) 360deg
  );
  opacity: 0.84;
  transform: translateZ(8px);
  filter: blur(0.35px);
}

#dimple{
  position:absolute;
  inset: 22%;
  border-radius: 999px;
  background: radial-gradient(circle at 50% 44%,
    rgba(0,0,0,0.12) 0%,
    rgba(0,0,0,0.00) 56%);
  transform: translateZ(4px);
  opacity: 0.55;
}

.ring{
  position:absolute;
  left: 50%;
  top: 50%;
  width: calc(var(--r) * 2);
  height: calc(var(--r) * 2);
  border-radius: 999px;
  transform: translate(-50%, -50%);
  opacity: 0;
  border: 2px solid rgba(var(--accent), 0.0);
  box-shadow: 0 0 24px rgba(var(--accent2), 0.0);
  will-change: transform, opacity;
}

#spark{
  position:absolute;
  left:50%;
  top:50%;
  width: calc(var(--r) * 0.22);
  height: calc(var(--r) * 0.22);
  transform: translate(-50%,-50%) translateZ(14px);
  opacity: 0;
}
#spark:before, #spark:after{
  content:"";
  position:absolute;
  left:50%; top:50%;
  transform: translate(-50%,-50%);
  background: rgba(var(--white), 0.92);
  border-radius: 2px;
  filter: drop-shadow(0 0 12px rgba(var(--accent2), 0.22));
}
#spark:before{ width: 2px; height: 100%; }
#spark:after{ width: 100%; height: 2px; }

/* Active */
body.on #tap{ opacity: 1; }
body.on #glass{ opacity: 1; }
body.on #bloom{ opacity: 1; }

/* Animations */
@keyframes popIn{
  0%{
    transform:
      translate(-50%, -50%)
      perspective(700px)
      rotateX(var(--tiltX))
      rotateY(var(--tiltY))
      translateZ(0px)
      scale(0.74);
    opacity: 0;
  }
  45%{
    transform:
      translate(-50%, -50%)
      perspective(700px)
      rotateX(var(--tiltX))
      rotateY(var(--tiltY))
      translateZ(calc(var(--lift) * 1px))
      scale(1.02);
    opacity: 1;
  }
  100%{
    transform:
      translate(-50%, -50%)
      perspective(700px)
      rotateX(var(--tiltX))
      rotateY(var(--tiltY))
      translateZ(0px)
      scale(1.00);
    opacity: 1;
  }
}

@keyframes haloIn{
  0%{ transform: translate(-50%,-50%) scale(0.82); opacity: 0; }
  35%{ opacity: 1; }
  100%{ transform: translate(-50%,-50%) scale(1.00); opacity: 1; }
}
@keyframes haloOut{
  0%{ opacity: 1; }
  100%{ opacity: 0; }
}

@keyframes fadeOut{
  0%{ opacity: 1; }
  100%{ opacity: 0; }
}

@keyframes ringPulse{
  0%{
    transform: translate(-50%, -50%) scale(0.72);
    opacity: 0.0;
    border-color: rgba(var(--accent), 0.0);
    box-shadow: 0 0 26px rgba(var(--accent2), 0.0);
  }
  16%{
    opacity: 1.0;
    border-color: rgba(var(--accent), 0.85);
    box-shadow: 0 0 34px rgba(var(--accent2), 0.22);
  }
  100%{
    transform: translate(-50%, -50%) scale(1.70);
    opacity: 0.0;
    border-color: rgba(var(--accent), 0.0);
    box-shadow: 0 0 26px rgba(var(--accent2), 0.0);
  }
}

@keyframes spark{
  0%{ transform: translate(-50%,-50%) translateZ(14px) scale(0.55); opacity: 0; }
  18%{ opacity: 1; }
  62%{ opacity: 0.95; }
  100%{ transform: translate(-50%,-50%) translateZ(14px) scale(1.42); opacity: 0; }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>

<body>
  <div id="stage">
    <div id="anchor">

      <!-- Glass blur (preferred) -->
      <div id="glass" aria-hidden="true">
        <div id="glassTint"></div>
      </div>

      <!-- Diffusion fallback (auto-used if blur unsupported) -->
      <div id="bloom" aria-hidden="true"></div>

      <div id="tap" aria-hidden="true">
        <div id="face"></div>
        <div id="arc"></div>
        <div id="dimple"></div>

        <div class="ring" id="ring1"></div>
        <div class="ring" id="ring2"></div>
        <div class="ring" id="ring3"></div>

        <div id="spark"></div>
      </div>

    </div>
  </div>

<script>
/**
 * tap_3d_ping_blur.html
 *
 * 3D tap indicator with a REAL glass blur halo (backdrop-filter) + sound.
 *
 * Default URL (full params):
 *  http://<HOST_IP>:8789/overlays/tap_3d_ping_blur.html
 *    ?x=0.50&y=0.50&r=66&lift=12&tiltX=14&tiltY=-18
 *    &in=110&out=650&pulse=620&rings=3
 *    &accent=180,220,255&accent2=120,190,255
 *    &glass=1&glassSize=760&glassAlpha=0.16&glassBlur=18&glassTint=0.10&glassFeather=0.78
 *    &sfx=1&sfxType=hybrid&vol=0.55&pitch=1.00&freq=520&click=0.70&tone=0.65
 *    &mode=burst&hold=0&interval=900
 *
 * Sound controls:
 *  sfx=1|0
 *  sfxType=ping|click|hybrid
 *  vol=0..1
 *  pitch=0.5..2.0
 *  freq=base frequency (Hz) before pitch
 *  click=0..1  (more click = more noise transient)
 *  tone=0..1   (more tone = louder ping oscillator)
 *
 * Blur controls:
 *  glass=1|0
 *  glassSize=px
 *  glassAlpha=0..0.5
 *  glassBlur=px
 *  glassTint=0..0.25
 *  glassFeather=0..1
 *
 * NOTE:
 *  True blur requires backdrop-filter support in the Browser Source.
 *  If unsupported, we auto-hide the blur layer and use a diffusion bloom instead.
 */

const qs = new URLSearchParams(location.search);

const x = clampFloat(parseFloat(qs.get("x") || "0.50"), 0, 1);
const y = clampFloat(parseFloat(qs.get("y") || "0.50"), 0, 1);
const r = clampInt(parseInt(qs.get("r") || "66", 10), 18, 220);

const lift = clampInt(parseInt(qs.get("lift") || "12", 10), 0, 60);
const tiltX = clampDeg(qs.get("tiltX") || "14");
const tiltY = clampDeg(qs.get("tiltY") || "-18");

const IN  = clampInt(parseInt(qs.get("in") || "110", 10), 0, 5000);
const OUT = clampInt(parseInt(qs.get("out") || "650", 10), 0, 8000);
const PULSE = clampInt(parseInt(qs.get("pulse") || "620", 10), 80, 8000);

const RINGS = clampInt(parseInt(qs.get("rings") || "3", 10), 1, 3);

const accent = parseRGB(qs.get("accent") || "180,220,255");
const accent2 = parseRGB(qs.get("accent2") || "120,190,255");

/* Glass params */
const glassOn = (qs.get("glass") || "1") !== "0";
const glassSize = clampInt(parseInt(qs.get("glassSize") || "760", 10), 220, 1600);
const glassAlpha = clampFloat(parseFloat(qs.get("glassAlpha") || "0.16"), 0, 0.5);
const glassBlur = clampInt(parseInt(qs.get("glassBlur") || "18", 10), 0, 80);
const glassTint = clampFloat(parseFloat(qs.get("glassTint") || "0.10"), 0, 0.25);
const glassFeather = clampFloat(parseFloat(qs.get("glassFeather") || "0.78"), 0.30, 1.0);

/* Sound params */
const SFX = (qs.get("sfx") || "1") !== "0";
const SFX_TYPE = (qs.get("sfxType") || "hybrid").toLowerCase(); // ping|click|hybrid
const VOL = clampFloat(parseFloat(qs.get("vol") || "0.55"), 0, 1);
const PITCH = clampFloat(parseFloat(qs.get("pitch") || "1.00"), 0.5, 2.0);
const FREQ = clampFloat(parseFloat(qs.get("freq") || "520"), 60, 2400);
const CLICK = clampFloat(parseFloat(qs.get("click") || "0.70"), 0, 1);
const TONE  = clampFloat(parseFloat(qs.get("tone") || "0.65"), 0, 1);

/* Behavior */
const MODE = (qs.get("mode") || "burst").toLowerCase();
const HOLD = clampInt(parseInt(qs.get("hold") || "0", 10), 0, 600000);
const INTERVAL = clampInt(parseInt(qs.get("interval") || "900", 10), 120, 600000);

// Apply vars
const root = document.documentElement.style;
root.setProperty("--x", x.toFixed(4));
root.setProperty("--y", y.toFixed(4));
root.setProperty("--r", r + "px");
root.setProperty("--lift", String(lift));
root.setProperty("--tiltX", tiltX + "deg");
root.setProperty("--tiltY", tiltY + "deg");
root.setProperty("--in-ms", String(IN));
root.setProperty("--out-ms", String(OUT));
root.setProperty("--pulse-ms", String(PULSE));
root.setProperty("--accent", accent.join(","));
root.setProperty("--accent2", accent2.join(","));

root.setProperty("--glass-size", glassSize + "px");
root.setProperty("--glass-alpha", String(glassAlpha));
root.setProperty("--glass-blur", glassBlur + "px");
root.setProperty("--glass-tint", String(glassTint));
root.setProperty("--glass-feather", String(glassFeather));

// Elements
const glassEl = document.getElementById("glass");
const bloomEl = document.getElementById("bloom");
const tapEl   = document.getElementById("tap");

const ringEls = [
  document.getElementById("ring1"),
  document.getElementById("ring2"),
  document.getElementById("ring3")
];
const sparkEl = document.getElementById("spark");

let loopTimer = null;

/* Detect backdrop-filter support.
   If not supported, hide #glass and rely on #bloom diffusion. */
const supportsBackdrop = (() => {
  try{
    return CSS.supports("backdrop-filter", "blur(2px)") || CSS.supports("-webkit-backdrop-filter", "blur(2px)");
  }catch{
    return false;
  }
})();

if (!glassOn || !supportsBackdrop){
  glassEl.style.display = "none";
  bloomEl.style.display = "block";
}else{
  bloomEl.style.display = "none";
}

function playOnce(){
  // reset animations
  tapEl.style.animation = "none";
  if (glassEl.style.display !== "none") glassEl.style.animation = "none";
  if (bloomEl.style.display !== "none") bloomEl.style.animation = "none";
  ringEls.forEach(el => el.style.animation = "none");
  sparkEl.style.animation = "none";
  void tapEl.offsetWidth;

  document.body.classList.add("on");

  // halo in/out
  const halo = (glassEl.style.display !== "none") ? glassEl : bloomEl;
  halo.style.animation = `haloIn ${Math.max(120, IN)}ms cubic-bezier(.2,.8,.2,1) 1 both`;

  // puck
  tapEl.style.animation = `popIn ${IN}ms cubic-bezier(.2,.8,.2,1) 1 both`;

  // rings staggered
  const t0 = 40;
  const step = Math.round(PULSE * 0.16);
  ringEls.forEach((el, i) => {
    el.style.display = (i < RINGS) ? "block" : "none";
    el.style.animation = (i < RINGS)
      ? `ringPulse ${PULSE}ms cubic-bezier(.2,.8,.2,1) ${t0 + i*step}ms 1 both`
      : "none";
  });

  // sparkle
  sparkEl.style.animation = `spark ${Math.max(220, Math.round(PULSE*0.58))}ms ease ${t0+40}ms 1 both`;

  // sound
  if (SFX) tapSound({ vol: VOL, pitch: PITCH, freq: FREQ, click: CLICK, tone: TONE, type: SFX_TYPE });

  // fade out
  const visibleMs = IN + Math.max(PULSE, 260) + HOLD;
  setTimeout(() => {
    tapEl.style.animation = `fadeOut ${OUT}ms ease 1 both`;
    halo.style.animation = `haloOut ${OUT}ms ease 1 both`;
    setTimeout(() => document.body.classList.remove("on"), OUT + 10);
  }, visibleMs);
}

function start(){
  stop();
  playOnce();
  if (MODE === "loop"){
    loopTimer = setInterval(playOnce, INTERVAL);
  }
}
function stop(){
  if (loopTimer) clearInterval(loopTimer);
  loopTimer = null;
}

/* ------------------------------------------------------------------ */
/* WebAudio SFX                                                        */
/* ------------------------------------------------------------------ */
let audioCtx = null;

function tapSound({ vol, pitch, freq, click, tone, type }){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    const t = ctx.currentTime + 0.01;

    // Master
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, t);
    master.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol), t + 0.01);
    master.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);
    master.connect(ctx.destination);

    const wantClick = (type === "click" || type === "hybrid") && click > 0.001;
    const wantTone  = (type === "ping"  || type === "hybrid") && tone  > 0.001;

    // CLICK: short filtered noise transient
    if (wantClick){
      const noise = ctx.createBufferSource();
      noise.buffer = makeNoiseBuffer(ctx, 0.07);

      const hp = ctx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.setValueAtTime(900, t);

      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.setValueAtTime(1700 * pitch, t);
      bp.Q.setValueAtTime(0.9 + 3.0 * click, t);

      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.exponentialRampToValueAtTime(0.75 * click, t + 0.008);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);

      noise.connect(hp); hp.connect(bp); bp.connect(ng); ng.connect(master);
      noise.start(t);
      noise.stop(t + 0.08);
    }

    // PING: short tonal blip w/ downward glide
    if (wantTone){
      const o = ctx.createOscillator();
      o.type = "sine";

      const base = freq * pitch;
      o.frequency.setValueAtTime(base, t);
      o.frequency.exponentialRampToValueAtTime(base * 0.74, t + 0.11);

      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(2600, t);

      const og = ctx.createGain();
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(0.90 * tone, t + 0.012);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);

      o.connect(lp); lp.connect(og); og.connect(master);
      o.start(t);
      o.stop(t + 0.17);
    }

  }catch(e){
    // Some embedded contexts restrict audio; ignore silently.
  }
}

function makeNoiseBuffer(ctx, seconds){
  const sr = ctx.sampleRate;
  const len = Math.floor(sr * seconds);
  const buf = ctx.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  for (let i=0; i<len; i++){
    const decay = 1 - (i / len);
    data[i] = (Math.random()*2 - 1) * decay;
  }
  return buf;
}

/* Helpers */
function clampInt(x,a,b){ x=isFinite(x)?x:a; return Math.max(a, Math.min(b, x)); }
function clampFloat(x,a,b){ x=isFinite(x)?x:a; return Math.max(a, Math.min(b, x)); }
function clampDeg(v){
  const x = parseFloat(v);
  const d = isFinite(x) ? x : 0;
  return Math.max(-85, Math.min(85, d));
}
function parseRGB(s){
  const parts = (s || "").split(",").map(x => parseInt(x.trim(), 10));
  if (parts.length !== 3) return [180,220,255];
  return parts.map(v => clampInt(v, 0, 255));
}

/* Run */
start();
addEventListener("pointerdown", () => start());
</script>
</body>
</html>
