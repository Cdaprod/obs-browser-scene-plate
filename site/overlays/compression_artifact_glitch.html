<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>compression-artifact-glitch</title>

<style>
:root{
  --alpha: 0.32;
}

html, body{
  height:100%;
  margin:0;
  background: transparent !important;
  overflow:hidden;
}

#wrap{
  position:absolute;
  inset:0;
  pointer-events:none;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity: var(--alpha);
  mix-blend-mode: screen;
  image-rendering: pixelated;
}
</style>
</head>

<body>
<div id="wrap">
  <canvas id="c"></canvas>
</div>

<script>
/**
 * compression_artifact_glitch.html
 *
 * PURPOSE:
 *  A glitching analogue static layer with blocky compression artifacts,
 *  designed for short bursts or looping overlay stacks.
 *
 * Default URL (full params):
 *  http://<HOST_IP>:8789/overlays/compression_artifact_glitch.html?alpha=0.32&block=24&smear=0.6&burst=0.35&fps=24&cool=0.12&loop=6
 *
 * Params:
 *  alpha=0..0.7
 *  block=8..64
 *  smear=0..1
 *  burst=0..1
 *  fps=8..60
 *  cool=0..0.35
 *  loop=3..20
 */

const qs = new URLSearchParams(location.search);
const cfg = {
  alpha: clampF(getF("alpha", 0.32), 0, 0.7),
  block: clampF(getF("block", 24), 8, 64),
  smear: clampF(getF("smear", 0.6), 0, 1),
  burst: clampF(getF("burst", 0.35), 0, 1),
  fps: clampF(getF("fps", 24), 8, 60),
  cool: clampF(getF("cool", 0.12), 0, 0.35),
  loop: clampF(getF("loop", 6), 3, 20),
};

document.documentElement.style.setProperty("--alpha", cfg.alpha);

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha:true });
ctx.imageSmoothingEnabled = false;

let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.max(1, Math.min(2, devicePixelRatio || 1));
  W = Math.floor(innerWidth * DPR);
  H = Math.floor(innerHeight * DPR);
  canvas.width = W;
  canvas.height = H;
}
addEventListener("resize", resize, { passive:true });
resize();

/* deterministic RNG */
function mulberry32(seed){
  return function(){
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let t0 = performance.now();
let lastFrame = -1;

function frame(now){
  const elapsed = (now - t0) / 1000;
  const loopT = elapsed % cfg.loop;
  const frameIndex = Math.floor(loopT * cfg.fps);

  if (frameIndex === lastFrame){
    requestAnimationFrame(frame);
    return;
  }
  lastFrame = frameIndex;

  const seed = (frameIndex + 1) * 941 + 1337;
  const rnd = mulberry32(seed);
  const blockPx = Math.max(4, Math.round(cfg.block * DPR));

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.globalCompositeOperation = "screen";

  for (let y=0; y<H; y+=blockPx){
    for (let x=0; x<W; x+=blockPx){
      const v = rnd();
      const base = 40 + v * 180;
      const coolBoost = cfg.cool * 0.5;
      const alpha = cfg.alpha * (0.08 + v * 0.22);
      ctx.fillStyle = `rgba(${base * (1 - coolBoost)}, ${base}, ${base * (1 + cfg.cool)}, ${alpha})`;
      ctx.fillRect(x, y, blockPx, blockPx);
    }
  }

  if (cfg.smear > 0.001){
    const smearCount = Math.floor(1 + cfg.smear * 6);
    for (let i=0; i<smearCount; i++){
      const y = Math.floor(rnd() * H);
      const h = Math.floor(2 + rnd() * blockPx * 0.6);
      const base = 120 + rnd() * 100;
      const alpha = cfg.alpha * (0.15 + rnd() * 0.35) * cfg.smear;
      const shift = Math.floor((rnd() - 0.5) * cfg.smear * blockPx * 4);
      ctx.save();
      ctx.translate(shift, 0);
      ctx.fillStyle = `rgba(${base}, ${base}, ${base * (1 + cfg.cool)}, ${alpha})`;
      ctx.fillRect(0, y, W, h);
      ctx.restore();
    }
  }

  if (cfg.burst > 0.001 && rnd() < cfg.burst){
    const burstCount = Math.floor(3 + rnd() * 6);
    for (let i=0; i<burstCount; i++){
      const w = Math.floor(blockPx * (2 + rnd() * 6));
      const h = Math.floor(blockPx * (1 + rnd() * 2));
      const x = Math.floor(rnd() * (W - w));
      const y = Math.floor(rnd() * (H - h));
      const base = 180 + rnd() * 70;
      const alpha = cfg.alpha * (0.35 + rnd() * 0.45);
      ctx.fillStyle = `rgba(${base}, ${base * (1 - cfg.cool)}, ${base * (1 + cfg.cool)}, ${alpha})`;
      ctx.fillRect(x, y, w, h);
    }
  }

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* helpers */
function getF(k,d){
  const v = qs.get(k);
  if (v === null || v === "") return d;
  const n = parseFloat(v);
  return isFinite(n) ? n : d;
}
function clampF(x,a,b){ return Math.max(a, Math.min(b, x)); }
</script>
</body>
</html>
