<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>scene-upgrade-vision</title>
<!-- Default URL (no params): http://<HOST_IP>:8789/overlays/scene_upgrade_vision.html -->

<style>
:root{
  --title: clamp(42px, 6vw, 104px);
  --line:  clamp(16px, 2.2vw, 30px);

  --stroke: rgba(0,0,0,0.9);
  --shadow: rgba(0,0,0,0.8);
  --glow: rgba(180,240,255,0.38);

  --in-ms: 260;
  --out-ms: 220;
  --hold-ms: 4600;
}

html,body{
  margin:0;
  height:100%;
  background: transparent !important;
  overflow:hidden;
}

#stage{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  pointer-events:none;
}

#wrap{
  text-align:center;
  opacity:0;
  transform: translateY(14px);
  transition:
    opacity calc(var(--in-ms)*1ms) ease,
    transform calc(var(--in-ms)*1ms) cubic-bezier(.2,.8,.2,1);
}

#title{
  font-family: Inter, system-ui, sans-serif;
  font-weight: 950;
  font-size: var(--title);
  letter-spacing: 0.035em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.99);

  text-shadow:
    0  4px 0 var(--stroke),
    0 -4px 0 var(--stroke),
    4px 0  0 var(--stroke),
   -4px 0  0 var(--stroke),
    4px 4px 0 var(--stroke),
   -4px 4px 0 var(--stroke),
    0 24px 52px var(--shadow),
    0 0 34px var(--glow);
}

#lines{
  margin-top: 16px;
  list-style:none;
  padding:0;
  display:grid;
  gap:12px;
}

.line{
  font-family:
    "Bradley Hand",
    "Marker Felt",
    "Segoe Script",
    cursive;
  font-size: var(--line);
  letter-spacing: 0.14em;
  color: rgba(255,255,255,0.94);
  text-shadow:
    0 2px 0 rgba(0,0,0,0.75),
    0 14px 26px rgba(0,0,0,0.65);
  opacity:0;
  transform: translateY(12px);
  transition: all 240ms ease;
}

body.on #wrap{
  opacity:1;
  transform: translateY(0);
}
body.on .line{
  opacity:1;
  transform: translateY(0);
}
</style>
</head>

<body>
<div id="stage">
  <div id="wrap">
    <div id="title">UPGRADING THE RIG</div>
    <ul id="lines">
      <li class="line">bottom-side m.2 for sustained throughput</li>
      <li class="line">top-side capture for clean video ingest</li>
      <li class="line">one node becomes a camera platform</li>
      <li class="line">this is camera infrastructure as a service</li>
    </ul>
  </div>
</div>

<script>
const hold = 4600;
document.body.classList.add("on");
setTimeout(()=>document.body.classList.remove("on"), hold);
</script>
</body>
</html>
