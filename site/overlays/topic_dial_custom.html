<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Topic Dial</title>
  <style>
    :root{
      --dial-size: min(82vmin, 980px);

      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      --label-size: clamp(14px, 1.55vmin, 22px);
      --title-size: clamp(12px, 1.2vmin, 16px);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

      --fg: rgba(255,255,255,0.94);
      --stroke: rgba(255,255,255,0.14);
      --shadow: rgba(0,0,0,0.45);

      --post-hold-opacity: 0.90;
      --ready-fade-ms: 520ms;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: var(--font);
    }

    .stage{
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: grid;
      place-items: center;
    }

    /* Shadow wrapper (prevents iOS/Safari drop-shadow+clip flash boxes) */
    .hudShadow{
      width: var(--dial-size);
      height: var(--dial-size);
      filter:
        drop-shadow(0 14px 28px var(--shadow))
        drop-shadow(0 2px 6px rgba(0,0,0,0.22));
      transform: translateZ(0);
      will-change: opacity, transform;
      overflow: visible; /* IMPORTANT: never clip labels */
    }

    /* Actual HUD content */
    .hud{
      width: 100%;
      height: 100%;
      position: relative;

      /* IMPORTANT: do not paint-contain (it can clip on iOS) */
      contain: none;
      overflow: visible;

      opacity: 0; /* hidden until ready */
      transform: translateY(10px) scale(0.985);
      will-change: opacity, transform;
      isolation: isolate;
    }

    .hud.is-ready{
      opacity: 1;
      transform: translateY(0px) scale(1.0);
      transition:
        opacity var(--ready-fade-ms) ease-out,
        transform var(--ready-fade-ms) ease-out;
    }

    .plate{
      position: absolute;
      left: 0;
      top: calc(-1 * clamp(24px, 3.2vmin, 42px));
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: var(--title-size);
      opacity: 0.92;
      user-select: none;
    }
    .plate .right{
      font-family: var(--mono);
      letter-spacing: 0.10em;
      opacity: 0.55;
      white-space: nowrap;
    }

    .ring{
      position: absolute;
      inset: 0;
      border-radius: 999px;
      border: 2px solid var(--stroke);
      box-sizing: border-box;
      overflow: hidden; /* clip ring visuals only */
      background: transparent;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    /* Move gradients into pseudo layers to keep clipping stable */
    .ring::before{
      content:"";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 38%, rgba(255,255,255,0.00) 66%),
        radial-gradient(circle at 50% 50%, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.00) 62%);
      pointer-events: none;
      transform: translateZ(0);
    }

    .ring::after{
      content:"";
      position: absolute;
      inset: 10.5%;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.10);
      background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.05), rgba(255,255,255,0.00) 55%);
      pointer-events: none;
      transform: translateZ(0);
    }

    .pointer{
      position: absolute;
      left: 50%;
      top: -2px;
      transform: translateX(-50%) translateZ(0);
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 18px solid rgba(255,255,255,0.86);
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.36));
      opacity: 0.95;
      z-index: 6;
      backface-visibility: hidden;
    }
    .pointer::after{
      content:"";
      position: absolute;
      left: 50%;
      top: 17px;
      transform: translateX(-50%);
      width: 2px;
      height: 16px;
      background: rgba(255,255,255,0.35);
      border-radius: 999px;
    }

    .active-arc{
      position: absolute;
      inset: 0;
      border-radius: 999px;
      pointer-events: none;
      background:
        conic-gradient(
          from -7deg,
          rgba(255,255,255,0.00) 0deg,
          rgba(255,255,255,0.00) 345deg,
          rgba(255,255,255,0.44) 345deg 358deg,
          rgba(255,255,255,0.00) 358deg 360deg
        );
      -webkit-mask: radial-gradient(circle, transparent 86%, #000 87%);
              mask: radial-gradient(circle, transparent 86%, #000 87%);
      opacity: 0.85;
      z-index: 5;
      transform: translateZ(0);
    }

    .dial{
      position: absolute;
      inset: 0;
      border-radius: 999px;
      transform: rotate(0deg) translateZ(0);
      will-change: transform;
      z-index: 2;
      backface-visibility: hidden;
    }

    .ticks{
      position: absolute;
      inset: 7%;
      border-radius: 999px;
      background:
        repeating-conic-gradient(
          from 0deg,
          rgba(255,255,255,0.0) 0deg 4deg,
          rgba(255,255,255,0.10) 4deg 4.5deg
        );
      -webkit-mask: radial-gradient(circle, transparent 60%, #000 61%);
              mask: radial-gradient(circle, transparent 60%, #000 61%);
      opacity: 0.55;
      filter: blur(0.15px);
      pointer-events: none;
      transform: translateZ(0);
    }

    .sweep{
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background:
        conic-gradient(from 0deg,
          rgba(255,255,255,0.00) 0deg,
          rgba(255,255,255,0.08) 18deg,
          rgba(255,255,255,0.00) 48deg,
          rgba(255,255,255,0.00) 360deg
        );
      opacity: 0.65;
      mix-blend-mode: screen;
      pointer-events: none;
      transform: translateZ(0);
    }

    /* Labels are outside ring clipping — must never be clipped by HUD container */
    .label-layer{
      position: absolute;
      inset: 0;
      border-radius: 999px;
      pointer-events: none;
      z-index: 7;
      overflow: visible;
    }

    .label{
      position: absolute;
      left: 50%;
      top: 50%;
      transform:
        translate(-50%, -50%)
        translate(var(--x, 0px), var(--y, 0px))
        rotate(var(--rot, 0deg));
      transform-origin: center center;
      will-change: transform, opacity, filter;
      opacity: 0.55;
      transition: opacity 180ms ease, filter 180ms ease;
      backface-visibility: hidden;
    }

    .label > span{
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: var(--label-size);
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.58);
      background: rgba(0,0,0,0.14);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      white-space: nowrap;
    }

    .label.is-active{
      opacity: 1;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.16));
    }
    .label.is-active > span{
      color: var(--fg);
      background: rgba(0,0,0,0.22);
      border-color: rgba(255,255,255,0.22);
    }

    .center{
      position: absolute;
      inset: 26%;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,0.08), rgba(255,255,255,0.00) 70%),
        linear-gradient(180deg, rgba(0,0,0,0.14), rgba(0,0,0,0.02));
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--fg);
      box-sizing: border-box;
      pointer-events: none;
      z-index: 4;
      transform: translateZ(0);
    }

    .center .topic{
      font-size: clamp(16px, 2.2vmin, 28px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      line-height: 1.2;
      padding: 0 14px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 260ms ease, transform 260ms ease;
    }
    .center .topic.is-visible{
      opacity: 0.98;
      transform: translateY(0px);
    }

    .hud.post-hold{
      opacity: var(--post-hold-opacity);
      transition: opacity 420ms ease;
    }

    @media (prefers-reduced-motion: reduce){
      .label, .center .topic { transition: none !important; }
      .hud.is-ready { transition: none !important; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="hudShadow" id="hudShadow" aria-hidden="true">
      <div class="hud" id="hud">
        <div class="plate">
          <div>DIRECTION</div>
          <div class="right" id="meta">—</div>
        </div>

        <div class="ring" aria-hidden="true">
          <div class="active-arc"></div>
          <div class="pointer"></div>

          <div class="dial" id="dial">
            <div class="ticks"></div>
            <div class="sweep"></div>
          </div>

          <div class="center" aria-hidden="true">
            <div class="topic" id="topicReadout">—</div>
          </div>
        </div>

        <div class="label-layer" id="labelLayer" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <script>
  /**
   * topic_dial_custom.html
   *
   * Cinematic topic “dial” / selector for OBS browser sources.
   * - Orbiting label pills stay upright + readable while dial visuals rotate.
   * - Lands cleanly on a wedge (no “between wedges then jump”).
   * - No “ring flash / square mask” on load (staged reveal + shadow wrapper).
   *
   * Default URL (full params):
   *  http://<HOST_IP>:8789/overlays/topic_dial_custom.html?n=6&labels=FAMILY|THE%20STORY|THE%20BUILD|THE%20CRAFT|PRINCIPLES|PROCESS&landTopic=THE%20BUILD&autospin=1&spinMode=cinematic&intro=3000&spin=10000&driftDps=24&turns=6
   *
   * Topic list params:
   *   n=6 | count=6
   *   labels=A|B|C (pipe or comma separated)
   *   t1=...&t2=... per-slot overrides (1-based)
   *
   * Landing params (priority):
   *   index=3 | land=3 | landing=3     (1-based)
   *   landTopic=THE%20BUILD            (label match, normalized)
   *   topic=THE%20BUILD                (back-compat alias)
   *
   * Randomness:
   *   seed=abc123
   *
   * Auto-start:
   *   autospin=1 | autospin=0 (default 1)
   *
   * Spin style:
   *   spinMode=cinematic | instant
   *
   * Cinematic timing:
   *   intro=3000    (ms) slow readable drift phase
   *   spin=10000    (ms) accel + long decel phase
   *   driftDps=24   (deg/sec) drift speed in intro
   *   turns=6       (integer) extra turns during main spin
   */

    const TOPICS_DEFAULT = ["FAMILY","THE STORY","THE BUILD","THE CRAFT","PRINCIPLES","PROCESS"];

    const SPIN_MIN_MS = 2200;
    const SPIN_MAX_MS = 3200;

    const HOLD_AFTER_LAND_MS = 900;
    const POST_HOLD_DIM = true;

    const BASE_TURNS_MIN = 3;
    const BASE_TURNS_MAX = 5;

    const MICRO_SETTLE_DEG = 1.15;
    const MICRO_SETTLE_MS  = 170;

    const hudShadow = document.getElementById("hudShadow");
    const hud = document.getElementById("hud");
    const dial = document.getElementById("dial");
    const labelLayer = document.getElementById("labelLayer");
    const topicReadout = document.getElementById("topicReadout");
    const meta = document.getElementById("meta");

    const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
    const lerp  = (a, b, t) => a + (b - a) * t;

    function normalizeDeg(deg){
      let d = deg % 360;
      if (d < 0) d += 360;
      return d;
    }

    function nowStamp(){
      const d = new Date();
      const hh = String(d.getHours()).padStart(2,"0");
      const mm = String(d.getMinutes()).padStart(2,"0");
      const ss = String(d.getSeconds()).padStart(2,"0");
      return `${hh}:${mm}:${ss}`;
    }

    function showReadout(text){
      topicReadout.textContent = text;
      topicReadout.classList.add("is-visible");
    }
    function hideReadout(){
      topicReadout.classList.remove("is-visible");
    }

    function normTopic(s){
      return String(s || "")
        .toUpperCase()
        .replace(/[\s_-]+/g, "")
        .trim();
    }

    function formatTopicDisplay(value){
      const text = String(value === null || value === undefined ? "" : value)
        .trim()
        .replace(/\s+/g, " ");
      return text.length ? text.toUpperCase() : "—";
    }

    function splitLabelsString(value){
      if (!value) return [];
      const raw = String(value).trim();
      if (!raw) return [];
      const parts = raw.includes("|") ? raw.split("|") : raw.split(",");
      return parts.map((part) => part.trim()).filter(Boolean);
    }

    function parseLandingIndex(value, maxCount){
      if (value === null || value === undefined) return null;
      const cleaned = String(value).trim().toLowerCase();
      if (!cleaned || cleaned === "random" || cleaned === "auto" || cleaned === "off") return null;
      const num = parseInt(cleaned, 10);
      if (!Number.isFinite(num) || num <= 0) return null;
      return Number.isFinite(maxCount) ? clamp(num, 1, maxCount) : num;
    }

    function parseParams(){
      const u = new URL(location.href);
      const p = u.searchParams;

      const spinMode = (p.get("spinMode") || "").trim().toLowerCase() || "cinematic";

      return {
        n: p.get("n") ?? p.get("count"),
        labels: p.get("labels"),
        t: (i) => p.get(`t${i}`),

        index: p.get("index") || p.get("land") || p.get("landing"),
        topic: p.get("topic"),
        landTopic: p.get("landTopic") || p.get("land_topic") || p.get("landtopic"),

        seed: p.get("seed"),
        autospin: p.get("autospin") !== "0",

        spinMode,
        intro: p.get("intro"),
        spin: p.get("spin"),
        driftDps: p.get("driftDps"),
        turns: p.get("turns"),
      };
    }

    function xmur3(str) {
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      return function() {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        h ^= h >>> 16;
        return h >>> 0;
      };
    }
    function mulberry32(a) {
      return function() {
        let t = (a += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function makeRng(seedStr){
      const seed = xmur3(seedStr)();
      return mulberry32(seed);
    }
    function weightedPickIndex(weights, rng){
      const total = weights.reduce((s, w) => s + w, 0);
      let r = rng() * total;
      for (let i = 0; i < weights.length; i++){
        r -= weights[i];
        if (r <= 0) return i;
      }
      return weights.length - 1;
    }

    const state = { topics: [...TOPICS_DEFAULT], weights: [], N: 0, SEG: 0 };

    function recomputeState(){
      state.N = Math.max(1, state.topics.length);
      state.SEG = 360 / state.N;
      state.weights = state.topics.map(() => 1);
    }

    function buildTopicsFromParams({ params, defaults, maxCount = 24 }){
      const safeDefaults = Array.isArray(defaults) && defaults.length ? defaults : ["TOPIC"];
      const safeParams = params || {};

      const nRaw = safeParams.n;
      const n = nRaw != null ? clamp(parseInt(nRaw, 10) || 0, 1, maxCount) : null;

      const fromLabels = splitLabelsString(safeParams.labels);

      const cap = n !== null && n !== undefined
        ? n
        : Math.max(fromLabels.length, safeDefaults.length, 1);

      const slotOverrides = [];
      for (let i = 1; i <= cap; i += 1){
        const override = safeParams.t ? safeParams.t(i) : null;
        if (override != null && String(override).trim().length){
          slotOverrides[i - 1] = String(override).trim();
        }
      }

      let topics = fromLabels.length ? [...fromLabels] : [...safeDefaults];

      if (slotOverrides.length){
        const needLen = Math.max(topics.length, slotOverrides.length);
        if (topics.length < needLen){
          for (let i = topics.length; i < needLen; i += 1){
            topics[i] = safeDefaults[i % safeDefaults.length];
          }
        }
        for (let i = 0; i < slotOverrides.length; i += 1){
          if (slotOverrides[i] != null && String(slotOverrides[i]).trim().length){
            topics[i] = slotOverrides[i];
          }
        }
      }

      if (n != null){
        if (topics.length > n) topics = topics.slice(0, n);
        if (topics.length < n){
          for (let i = topics.length; i < n; i += 1){
            topics.push(safeDefaults[i % safeDefaults.length]);
          }
        }
      }

      topics = topics.map(formatTopicDisplay);
      return topics.length ? topics : safeDefaults.map(formatTopicDisplay);
    }

    const labelEls = [];

    function buildLabels(){
      labelLayer.innerHTML = "";
      labelEls.length = 0;

      for (let i = 0; i < state.N; i++){
        const div = document.createElement("div");
        div.className = "label";
        div.dataset.idx = String(i);

        const span = document.createElement("span");
        span.textContent = state.topics[i] ?? "—";
        div.appendChild(span);

        labelLayer.appendChild(div);
        labelEls.push(div);
      }
    }

    function setActiveIndex(idx){
      for (let i = 0; i < labelEls.length; i++){
        labelEls[i].classList.toggle("is-active", i === idx);
      }
    }

    function updateLabelOrbit(dialRotDeg){
      const rect = hudShadow.getBoundingClientRect();
      const size = Math.min(rect.width, rect.height);

      /* Slightly smaller radius so pills stay inside typical OBS crop,
         BUT never clipped now because we removed paint containment. */
      const R = size * 0.405;

      const rot = normalizeDeg(dialRotDeg);

      for (let i = 0; i < state.N; i++){
        const ang = (rot + i * state.SEG) - 90;
        const rad = ang * Math.PI / 180;

        const x = Math.cos(rad) * R;
        const y = Math.sin(rad) * R;

        const el = labelEls[i];
        if (!el) continue;
        el.style.setProperty("--x", `${x.toFixed(2)}px`);
        el.style.setProperty("--y", `${y.toFixed(2)}px`);
        el.style.setProperty("--rot", `0deg`);
      }
    }

    function activeIndexFromRotation(rotDeg){
      const rot = normalizeDeg(rotDeg);
      const idx = Math.round(((360 - rot) % 360) / state.SEG) % state.N;
      return idx;
    }

    function targetRotationForIndex(i){
      return -(i * state.SEG);
    }

    function applyTopics(topics){
      state.topics = (topics || []).map(formatTopicDisplay);
      recomputeState();
      buildLabels();
      updateLabelOrbit(currentDeg);
      setActiveIndex(activeIndexFromRotation(currentDeg));
    }

    let currentDeg = 0;
    let isSpinning = false;
    let forcedIndex = null;
    const renderCapture = window.__RENDER_CAPTURE === true;
    let renderChosen = null;

    function setDialRotation(deg){
      dial.style.transform = `rotate(${deg}deg) translateZ(0)`;
    }

    function chooseIndex(params){
      const landingIndex = parseLandingIndex(params.index, state.N);
      if (landingIndex != null) return { index: landingIndex - 1, mode: "index" };

      if (params.landTopic){
        const want = normTopic(params.landTopic);
        const idx = state.topics.findIndex(t => normTopic(t) === want);
        if (idx >= 0) return { index: idx, mode: "landTopic" };
      }

      if (params.topic){
        const want = normTopic(params.topic);
        const idx = state.topics.findIndex(t => normTopic(t) === want);
        if (idx >= 0) return { index: idx, mode: "topic" };
      }

      if (forcedIndex !== null && forcedIndex >= 0 && forcedIndex < state.N){
        return { index: forcedIndex, mode: "forced" };
      }

      if (params.seed){
        const rng = makeRng(String(params.seed));
        return { index: weightedPickIndex(state.weights, rng), mode: "seed" };
      }

      return { index: weightedPickIndex(state.weights, Math.random), mode: "random" };
    }

    // Easings
    function easeInCubic(t){ return t*t*t; }
    function easeOutQuint(t){ return 1 - Math.pow(1 - t, 5); }

    // endDeg EXACTLY aligned to wedge center, guaranteed > currentDeg
    function computeExactEndDeg(curDeg, targetBaseDeg, extraTurns){
      const minK = Math.floor((curDeg - targetBaseDeg) / 360) + 1;
      const k = minK + Math.max(0, extraTurns | 0);
      return targetBaseDeg + 360 * k;
    }

    function microSettleToBase(baseTargetDeg){
      return new Promise((resolve) => {
        const snapped = baseTargetDeg;
        const overshoot = snapped + MICRO_SETTLE_DEG;

        const start = performance.now();
        const dur = MICRO_SETTLE_MS;

        const animate = (tNow) => {
          const t = clamp((tNow - start) / dur, 0, 1);

          let mid;
          if (t < 0.55){
            mid = lerp(snapped, overshoot, easeOutQuint(t / 0.55));
          } else {
            mid = lerp(overshoot, snapped, easeOutQuint((t - 0.55) / 0.45));
          }

          currentDeg = mid;
          setDialRotation(mid);
          updateLabelOrbit(mid);
          setActiveIndex(activeIndexFromRotation(mid));

          if (t < 1) requestAnimationFrame(animate);
          else resolve();
        };

        requestAnimationFrame(animate);
      });
    }

    async function finishLanding(index){
      const landed = state.topics[index] ?? "—";
      setActiveIndex(index);
      showReadout(landed);
      meta.textContent = `${nowStamp()}  •  ${landed}`;

      setTimeout(() => {
        if (POST_HOLD_DIM) hud.classList.add("post-hold");
        isSpinning = false;
      }, HOLD_AFTER_LAND_MS);
    }


    function getRenderPlan(params, chosenIndex){
      const spinMode = (params.spinMode || "cinematic").toLowerCase() === "instant" ? "instant" : "cinematic";
      const startDeg = currentDeg;
      const targetBase = targetRotationForIndex(chosenIndex);
      const startDelayMs = params.autospin ? 140 : 0;

      if (spinMode === "instant"){
        const fallbackDuration = Math.floor((SPIN_MIN_MS + SPIN_MAX_MS) / 2);
        const duration = clamp(parseInt(params.spin ?? String(fallbackDuration), 10) || fallbackDuration, 200, 120000);
        const fallbackTurns = Math.floor((BASE_TURNS_MIN + BASE_TURNS_MAX) / 2);
        const turns = clamp(parseInt(params.turns ?? String(fallbackTurns), 10) || fallbackTurns, 0, 24);
        const endDeg = computeExactEndDeg(startDeg, targetBase, turns);
        const totalMs = startDelayMs + duration + MICRO_SETTLE_MS + HOLD_AFTER_LAND_MS;
        return { spinMode, startDeg, targetBase, startDelayMs, duration, turns, endDeg, totalMs };
      }

      const introMs = clamp(parseInt(params.intro ?? "4000", 10) || 4000, 0, 120000);
      const spinMs = clamp(parseInt(params.spin ?? "11000", 10) || 11000, 600, 120000);
      const driftDps = clamp(parseFloat(params.driftDps ?? "24") || 24, 0, 360);
      const turnsParam = params.turns != null ? parseInt(params.turns, 10) : null;
      const turns = Number.isFinite(turnsParam) ? clamp(turnsParam, 0, 24) : 6;
      const driftTotal = driftDps * (introMs / 1000);
      const startDegB = startDeg + driftTotal;
      const endDeg = computeExactEndDeg(startDegB, targetBase, turns);
      const totalMs = startDelayMs + introMs + spinMs + MICRO_SETTLE_MS + HOLD_AFTER_LAND_MS;
      return {
        spinMode,
        startDeg,
        targetBase,
        startDelayMs,
        introMs,
        spinMs,
        driftDps,
        driftTotal,
        turns,
        startDegB,
        endDeg,
        totalMs
      };
    }

    function applyFrameByTime(ms){
      const params = parseParams();
      if (!renderChosen) {
        renderChosen = chooseIndex(params);
      }
      const plan = getRenderPlan(params, renderChosen.index);
      const tRaw = Math.max(0, Number(ms) || 0);
      const t = Math.max(0, tRaw - plan.startDelayMs);

      hud.classList.add("is-ready");
      hud.classList.remove("post-hold");
      hideReadout();

      let deg = plan.startDeg;
      let settled = false;

      if (!params.autospin || t <= 0){
        deg = plan.startDeg;
      } else if (plan.spinMode === "instant") {
        const tSpin = clamp(t / plan.duration, 0, 1);
        const c = 1 - Math.pow(1 - tSpin, 3);
        const resist = 1 - Math.pow(1 - tSpin, 6);
        const e = lerp(c, resist, 0.35);
        deg = lerp(plan.startDeg, plan.endDeg, e);

        if (t > plan.duration) {
          const tSettle = clamp((t - plan.duration) / MICRO_SETTLE_MS, 0, 1);
          const overshoot = plan.targetBase + MICRO_SETTLE_DEG;
          if (tSettle < 0.55){
            deg = lerp(plan.targetBase, overshoot, easeOutQuint(tSettle / 0.55));
          } else {
            deg = lerp(overshoot, plan.targetBase, easeOutQuint((tSettle - 0.55) / 0.45));
          }
          if (tSettle >= 1) {
            settled = true;
            deg = plan.targetBase;
          }
        }
      } else {
        if (t <= plan.introMs) {
          const tA = plan.introMs <= 0 ? 1 : clamp(t / plan.introMs, 0, 1);
          deg = plan.startDeg + plan.driftTotal * tA;
        } else {
          const tB = clamp((t - plan.introMs) / plan.spinMs, 0, 1);
          let e;
          if (tB < 0.22) {
            e = 0.42 * easeInCubic(tB / 0.22);
          } else {
            const u = (tB - 0.22) / (1 - 0.22);
            e = 0.42 + (1 - 0.42) * easeOutQuint(u);
          }
          deg = lerp(plan.startDegB, plan.endDeg, e);

          if (t > plan.introMs + plan.spinMs) {
            const tSettle = clamp((t - plan.introMs - plan.spinMs) / MICRO_SETTLE_MS, 0, 1);
            const overshoot = plan.targetBase + MICRO_SETTLE_DEG;
            if (tSettle < 0.55){
              deg = lerp(plan.targetBase, overshoot, easeOutQuint(tSettle / 0.55));
            } else {
              deg = lerp(overshoot, plan.targetBase, easeOutQuint((tSettle - 0.55) / 0.45));
            }
            if (tSettle >= 1) {
              settled = true;
              deg = plan.targetBase;
            }
          }
        }
      }

      currentDeg = deg;
      setDialRotation(deg);
      updateLabelOrbit(deg);
      const active = activeIndexFromRotation(deg);
      setActiveIndex(active);

      if (settled && t >= (plan.totalMs - plan.startDelayMs - HOLD_AFTER_LAND_MS)) {
        const landed = state.topics[renderChosen.index] ?? "—";
        showReadout(landed);
        meta.textContent = `RENDER  •  ${landed}`;
        if (POST_HOLD_DIM && t >= (plan.totalMs - plan.startDelayMs)) {
          hud.classList.add("post-hold");
        }
      }

      const seconds = Math.max(0.01, plan.totalMs / 1000);
      window.__RENDER_SECONDS = seconds;
      window.dispatchEvent(new CustomEvent("render:duration", { detail: { seconds } }));
    }

    async function spinToIndexInstant(index, opts = {}){
      if (isSpinning) return;
      isSpinning = true;

      hud.classList.remove("post-hold");
      hideReadout();

      const duration = opts.duration ?? Math.floor(lerp(SPIN_MIN_MS, SPIN_MAX_MS, Math.random()));
      const turns = opts.turns ?? Math.floor(lerp(BASE_TURNS_MIN, BASE_TURNS_MAX + 0.999, Math.random()));

      const targetBase = targetRotationForIndex(index);
      const endDeg = computeExactEndDeg(currentDeg, targetBase, turns);

      const start = performance.now();
      const startDeg = currentDeg;

      const easeOutResist = (t) => {
        const c = 1 - Math.pow(1 - t, 3);
        const resist = 1 - Math.pow(1 - t, 6);
        return lerp(c, resist, 0.35);
      };

      const animate = (tNow) => {
        const t = clamp((tNow - start) / duration, 0, 1);
        const e = easeOutResist(t);

        const d = lerp(startDeg, endDeg, e);

        currentDeg = d;
        setDialRotation(d);
        updateLabelOrbit(d);
        setActiveIndex(activeIndexFromRotation(d));

        if (t < 1) requestAnimationFrame(animate);
        else {
          currentDeg = endDeg;
          setDialRotation(endDeg);
          updateLabelOrbit(endDeg);
          setActiveIndex(activeIndexFromRotation(endDeg));

          microSettleToBase(targetBase).then(() => finishLanding(index));
        }
      };

      requestAnimationFrame(animate);
    }

    async function spinToIndexCinematic(index, params){
      if (isSpinning) return;
      isSpinning = true;

      hud.classList.remove("post-hold");
      hideReadout();

      const introMs  = clamp(parseInt(params.intro ?? "4000", 10) || 4000, 0, 120000);
      const spinMs   = clamp(parseInt(params.spin  ?? "11000", 10) || 11000, 600, 120000);

      // Make the drift and the ramp clearly visible by default
      const driftDps = clamp(parseFloat(params.driftDps ?? "24") || 24, 0, 360);

      const turnsParam = params.turns != null ? parseInt(params.turns, 10) : null;
      const turns = Number.isFinite(turnsParam) ? clamp(turnsParam, 0, 24) : 6;

      const targetBase = targetRotationForIndex(index);

      // A) Readable drift
      const startA = performance.now();
      const startDegA = currentDeg;
      const driftTotal = driftDps * (introMs / 1000);

      const phaseA = (tNow) => {
        const t = introMs <= 0 ? 1 : clamp((tNow - startA) / introMs, 0, 1);
        const d = startDegA + driftTotal * t;

        currentDeg = d;
        setDialRotation(d);
        updateLabelOrbit(d);
        setActiveIndex(activeIndexFromRotation(d));

        if (t < 1) requestAnimationFrame(phaseA);
        else {
          // B) Strong accel then long decel (VERY cinematic, very noticeable)
          const endDeg = computeExactEndDeg(currentDeg, targetBase, turns);

          const startB = performance.now();
          const startDegB = currentDeg;

          const accelPortion = 0.22;   // fast ramp window
          const accelShare = 0.42;     // how much distance is consumed during accel (makes it feel “kick”)

          const phaseB = (tNowB) => {
            const tB = clamp((tNowB - startB) / spinMs, 0, 1);

            let e;
            if (tB < accelPortion){
              // accelerate hard
              e = accelShare * easeInCubic(tB / accelPortion);
            } else {
              // then coast + long decel
              const u = (tB - accelPortion) / (1 - accelPortion);
              e = accelShare + (1 - accelShare) * easeOutQuint(u);
            }

            const dB = lerp(startDegB, endDeg, e);

            currentDeg = dB;
            setDialRotation(dB);
            updateLabelOrbit(dB);
            setActiveIndex(activeIndexFromRotation(dB));

            if (tB < 1) requestAnimationFrame(phaseB);
            else {
              // hard lock EXACT, no “between wedges then jump”
              currentDeg = endDeg;
              setDialRotation(endDeg);
              updateLabelOrbit(endDeg);
              setActiveIndex(activeIndexFromRotation(endDeg));

              microSettleToBase(targetBase).then(() => finishLanding(index));
            }
          };

          requestAnimationFrame(phaseB);
        }
      };

      requestAnimationFrame(phaseA);
    }

    window.spin = () => {
      const params = parseParams();
      const chosen = chooseIndex(params);
      if (params.spinMode === "instant") spinToIndexInstant(chosen.index);
      else spinToIndexCinematic(chosen.index, params);
    };

    window.setTopic = (topicString) => {
      const want = normTopic(topicString);
      const idx = state.topics.findIndex(t => normTopic(t) === want);
      if (idx >= 0){
        forcedIndex = idx;
        const params = parseParams();
        if (params.spinMode === "instant") spinToIndexInstant(idx);
        else spinToIndexCinematic(idx, params);
      }
    };

    window.setIndex = (oneBasedIndex) => {
      const idx = Number(oneBasedIndex) - 1;
      if (Number.isFinite(idx) && idx >= 0 && idx < state.N){
        forcedIndex = idx;
        const params = parseParams();
        if (params.spinMode === "instant") spinToIndexInstant(idx);
        else spinToIndexCinematic(idx, params);
      }
    };

    window.setTopics = (labels, countMaybe) => {
      let topics = Array.isArray(labels) ? labels : splitLabelsString(String(labels ?? ""));
      if (!topics.length) topics = [...TOPICS_DEFAULT];

      const n = countMaybe != null ? clamp(parseInt(countMaybe, 10) || 0, 1, 24) : null;
      if (n != null){
        if (topics.length > n) topics = topics.slice(0, n);
        if (topics.length < n){
          for (let i = topics.length; i < n; i++){
            topics.push(TOPICS_DEFAULT[i % TOPICS_DEFAULT.length]);
          }
        }
      }

      applyTopics(topics);

      const idx = activeIndexFromRotation(currentDeg);
      const baseTarget = targetRotationForIndex(idx);

      currentDeg = baseTarget;
      setDialRotation(baseTarget);
      updateLabelOrbit(baseTarget);
      setActiveIndex(idx);

      meta.textContent = `${nowStamp()}  •  TOPICS SET`;
    };

    window.addEventListener("resize", () => updateLabelOrbit(currentDeg));

    (function boot(){
      const params = parseParams();

      const topics = buildTopicsFromParams({ params, defaults: TOPICS_DEFAULT, maxCount: 24 });
      applyTopics(topics);

      // start snapped so it never appears “halfway” at rest
      const initialIdx = activeIndexFromRotation(currentDeg);
      currentDeg = targetRotationForIndex(initialIdx);
      setDialRotation(currentDeg);
      updateLabelOrbit(currentDeg);
      setActiveIndex(initialIdx);

      const chosen = chooseIndex(params);
      renderChosen = chosen;
      meta.textContent = `${nowStamp()}  •  ${chosen.mode.toUpperCase()}`;

      window.__SET_RENDER_TIME = (ms) => {
        applyFrameByTime(ms);
      };

      if (renderCapture){
        applyFrameByTime(0);
        window.__RENDER_READY = true;
        return;
      }

      // staged reveal (kills ring flash / square mask)
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          hud.classList.add("is-ready");

          if (params.autospin){
            setTimeout(() => {
              const p2 = parseParams();
              const chosen2 = renderChosen || chooseIndex(p2);
              meta.textContent = `${nowStamp()}  •  ${chosen2.mode.toUpperCase()}`;

              if (p2.spinMode === "instant") spinToIndexInstant(chosen2.index);
              else spinToIndexCinematic(chosen2.index, p2);
            }, 140);
          }
          window.__RENDER_READY = true;
        });
      });
    })();
  </script>
