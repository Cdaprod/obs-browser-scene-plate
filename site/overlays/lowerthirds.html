<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>overlay-lowerthird</title>
  <style>
    :root{
      /* Layout */
      --safe-pad: 4.2vw;
      --maxw: min(86vw, 1400px);
      --dock: bottom;                /* bottom | top */
      --y: 7.5vh;                    /* distance from edge */
      --align: left;                 /* left | center | right */

      /* Glass / panel */
      --panel-alpha: 0.10;           /* background glass opacity */
      --panel-blur: 10px;            /* blur behind panel (works if supported) */
      --panel-radius: 16px;
      --panel-border: rgba(255,255,255,0.10);

      /* Text styling (white that pops on dark camera) */
      --text: rgba(255,255,255,0.98);
      --stroke: rgba(0,0,0,0.55);    /* faux stroke */
      --shadow: rgba(0,0,0,0.70);
      --glow: rgba(160,220,255,0.30);/* subtle cool glow */
      --glow2: rgba(255,255,255,0.22);

      /* Animation */
      --in-ms: 260;
      --out-ms: 220;
      --hold-ms: 4200;               /* used only in burst mode */
      --stagger-ms: 60;

      /* Typography scale */
      --title: clamp(22px, 2.8vw, 44px);
      --sub:   clamp(14px, 1.55vw, 22px);
      --pt:    clamp(13px, 1.35vw, 18px);
      --lh: 1.18;
    }

    html, body{
      height:100%; margin:0;
      background: transparent !important; /* alpha handled automatically */
      overflow:hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    /* Root wrapper (easy positioning) */
    #wrap{
      position:absolute;
      left: var(--safe-pad);
      right: var(--safe-pad);
      max-width: var(--maxw);
      pointer-events:none;
      opacity:0;
      transform: translate3d(0, 18px, 0);
      filter: saturate(1.05);
      transition:
        opacity calc(var(--in-ms)*1ms) ease,
        transform calc(var(--in-ms)*1ms) cubic-bezier(.2,.8,.2,1);
      will-change: opacity, transform;
    }

    /* Docking */
    .dock-bottom #wrap{ bottom: var(--y); }
    .dock-top    #wrap{ top: var(--y); }

    /* Alignment */
    .align-left  #wrap{ margin-right:auto; text-align:left; }
    .align-center#wrap{ margin-left:auto; margin-right:auto; text-align:center; }
    .align-right #wrap{ margin-left:auto; text-align:right; }

    /* Panel glass */
    #panel{
      position:relative;
      display:inline-block;
      width:100%;
      padding: 18px 20px 16px 20px;
      border-radius: var(--panel-radius);
      background: rgba(0,0,0,var(--panel-alpha));
      border: 1px solid var(--panel-border);
      box-shadow:
        0 14px 40px rgba(0,0,0,0.35),
        0 0 0 1px rgba(255,255,255,0.04) inset;
      backdrop-filter: blur(var(--panel-blur));
      -webkit-backdrop-filter: blur(var(--panel-blur));
      overflow:hidden;
    }

    /* a subtle animated “scan” shimmer */
    #panel::before{
      content:"";
      position:absolute; inset:-40% -40%;
      background: linear-gradient(120deg,
        rgba(255,255,255,0.00) 0%,
        rgba(255,255,255,0.06) 40%,
        rgba(255,255,255,0.00) 60%);
      transform: translateX(-30%) rotate(8deg);
      opacity:0.0;
      pointer-events:none;
    }

    /* Title / subtitle / points */
    .title{
      font-size: var(--title);
      font-weight: 850;
      letter-spacing: 0.01em;
      line-height: var(--lh);
      margin:0;

      /* “pop on dark” stack: shadow + faux stroke + glow */
      color: var(--text);
      text-shadow:
        0 2px 0 var(--stroke),
        0 -2px 0 var(--stroke),
        2px 0 0 var(--stroke),
        -2px 0 0 var(--stroke),
        2px 2px 0 var(--stroke),
        -2px 2px 0 var(--stroke),
        2px -2px 0 var(--stroke),
        -2px -2px 0 var(--stroke),
        0 10px 24px var(--shadow),
        0 0 18px var(--glow2),
        0 0 30px var(--glow);
    }

    .subtitle{
      margin-top: 6px;
      font-size: var(--sub);
      font-weight: 650;
      letter-spacing: 0.02em;
      line-height: 1.22;
      color: rgba(255,255,255,0.92);
      text-shadow:
        0 2px 0 rgba(0,0,0,0.45),
        0 8px 18px rgba(0,0,0,0.55),
        0 0 16px rgba(255,255,255,0.12);
    }

    ul.points{
      list-style: none;
      padding: 10px 0 0 0;
      margin: 0;
      display: grid;
      grid-auto-rows: min-content;
      gap: 6px;
    }

    .pt{
      display:flex;
      gap: 10px;
      align-items:flex-start;
      font-size: var(--pt);
      font-weight: 620;
      letter-spacing: 0.015em;
      color: rgba(255,255,255,0.92);
      text-shadow:
        0 2px 0 rgba(0,0,0,0.45),
        0 8px 16px rgba(0,0,0,0.55);
      opacity: 0.0;
      transform: translate3d(0, 8px, 0);
      transition:
        opacity 220ms ease,
        transform 220ms cubic-bezier(.2,.8,.2,1);
      will-change: opacity, transform;
    }

    .bullet{
      width: 10px;
      height: 10px;
      margin-top: 0.42em;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      box-shadow:
        0 0 0 2px rgba(0,0,0,0.45),
        0 0 16px rgba(160,220,255,0.30);
      flex: 0 0 auto;
    }

    /* States */
    .on #wrap{
      opacity:1;
      transform: translate3d(0,0,0);
    }
    .on #panel::before{
      opacity:1;
      animation: shimmer 900ms ease-out 1;
    }

    .off #wrap{
      opacity:0;
      transform: translate3d(0, 14px, 0);
      transition:
        opacity calc(var(--out-ms)*1ms) ease,
        transform calc(var(--out-ms)*1ms) ease;
    }

    .on .pt.show{
      opacity:1;
      transform: translate3d(0,0,0);
    }

    @keyframes shimmer{
      0%   { transform: translateX(-40%) rotate(8deg); opacity: 0; }
      15%  { opacity: 1; }
      100% { transform: translateX(40%) rotate(8deg); opacity: 0; }
    }

    /* Optional “glitch nudge” micro effect */
    .glitch #wrap{
      animation: nudge 160ms steps(2,end) 1;
    }
    @keyframes nudge{
      0% { transform: translate3d(0,0,0); }
      30%{ transform: translate3d(2px,-1px,0); }
      60%{ transform: translate3d(-2px,1px,0); }
      100%{ transform: translate3d(0,0,0); }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce){
      #wrap, .pt { transition:none !important; animation:none !important; }
    }
  </style>
</head>
<body class="dock-bottom align-left">
  <div id="wrap">
    <div id="panel">
      <div class="title" id="title">TITLE</div>
      <div class="subtitle" id="subtitle">Subtitle goes here</div>
      <ul class="points" id="points"></ul>
    </div>
  </div>

  <script>
    /**
     * overlay_lowerthird.html
     *
     * Browser Source lower-third overlay with:
     *  - Title / subtitle / bullet points
     *  - Pre-styled white text with faux-stroke + glow + shadow
     *  - Transparent background (no chroma key)
     *  - Burst mode auto-hide, or loop mode stays visible
     *
     * Query params:
     *  mode=burst|loop        default burst
     *  hold=4200             ms before auto-hide (burst only)
     *  in=260 out=220         animation timing ms
     *  dock=bottom|top
     *  align=left|center|right
     *  glass=0.10            panel opacity 0..0.35
     *  blur=10               backdrop blur px
     *  title=...
     *  sub=...
     *  pts=point1|point2|point3   (use | as separator)
     *  glitch=1              adds a tiny nudge on show
     *
     * Examples:
     *  overlay_lowerthird.html?mode=burst&hold=3500&title=LIVE%20WALL&sub=ARG%20transition%20stack&pts=wipe%20glitch|static%20hit|redaction%20slam
     *  overlay_lowerthird.html?mode=loop&dock=top&align=center&title=SIGNAL%20TEST&sub=two%20camera%20rig%20online
     */

    const qs = new URLSearchParams(location.search);
    const MODE = (qs.get("mode") || "burst").toLowerCase();
    const HOLD = clampInt(parseInt(qs.get("hold") || "4200", 10), 0, 600000);

    const INMS  = clampInt(parseInt(qs.get("in")  || "260", 10), 0, 5000);
    const OUTMS = clampInt(parseInt(qs.get("out") || "220", 10), 0, 5000);

    const DOCK = (qs.get("dock") || "bottom").toLowerCase();
    const ALIGN= (qs.get("align") || "left").toLowerCase();

    const GLASS= clampFloat(parseFloat(qs.get("glass") || "0.10"), 0, 0.35);
    const BLUR = clampInt(parseInt(qs.get("blur") || "10", 10), 0, 60);

    const TITLE = (qs.get("title") || "TITLE").slice(0, 80);
    const SUB   = (qs.get("sub") || "Subtitle goes here").slice(0, 120);
    const PTS   = (qs.get("pts") || "").split("|").map(s => decodeURIComponentSafe(s).trim()).filter(Boolean).slice(0, 6);

    const GLITCH = (qs.get("glitch") || "0") === "1";

    function clampInt(x,a,b){ x = isFinite(x)?x:a; return Math.max(a, Math.min(b, x)); }
    function clampFloat(x,a,b){ x = isFinite(x)?x:a; return Math.max(a, Math.min(b, x)); }
    function decodeURIComponentSafe(s){ try { return decodeURIComponent(s); } catch { return s; } }

    // Apply timing + panel knobs
    document.documentElement.style.setProperty("--in-ms", String(INMS));
    document.documentElement.style.setProperty("--out-ms", String(OUTMS));
    document.documentElement.style.setProperty("--hold-ms", String(HOLD));
    document.documentElement.style.setProperty("--panel-alpha", String(GLASS));
    document.documentElement.style.setProperty("--panel-blur", String(BLUR) + "px");

    // Dock / align classes
    document.body.classList.toggle("dock-top", DOCK === "top");
    document.body.classList.toggle("dock-bottom", DOCK !== "top");
    document.body.classList.toggle("align-center", ALIGN === "center");
    document.body.classList.toggle("align-right", ALIGN === "right");
    document.body.classList.toggle("align-left", ALIGN !== "center" && ALIGN !== "right");

    if (GLITCH) document.body.classList.add("glitch");

    // Fill content
    document.getElementById("title").textContent = decodeURIComponentSafe(TITLE);
    document.getElementById("subtitle").textContent = decodeURIComponentSafe(SUB);

    const pointsEl = document.getElementById("points");
    pointsEl.innerHTML = "";

    for (let i=0;i<PTS.length;i++){
      const li = document.createElement("li");
      li.className = "pt";
      li.style.transitionDelay = (60 + i * 60) + "ms";

      const b = document.createElement("span");
      b.className = "bullet";
      const t = document.createElement("span");
      t.textContent = PTS[i];

      li.appendChild(b);
      li.appendChild(t);
      pointsEl.appendChild(li);
    }

    // Show sequence
    function show(){
      document.body.classList.remove("off");
      document.body.classList.add("on");

      // stagger point reveal
      const pts = pointsEl.querySelectorAll(".pt");
      pts.forEach((el, idx) => {
        setTimeout(() => el.classList.add("show"), 80 + idx * 70);
      });

      if (MODE === "burst" && HOLD > 0){
        setTimeout(hide, HOLD);
      }
    }

    function hide(){
      document.body.classList.remove("on");
      document.body.classList.add("off");
      // reset points so next show animates again if the Browser Source refreshes
      const pts = pointsEl.querySelectorAll(".pt");
      pts.forEach(el => el.classList.remove("show"));
    }

    // Start on load
    show();

    // Click to retrigger if previewed in browser
    addEventListener("pointerdown", () => {
      hide();
      setTimeout(show, 40);
    });
  </script>
</body>
</html>
