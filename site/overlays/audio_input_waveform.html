<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>audio-input-waveform</title>
<style>
html, body{
  margin: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
}
canvas{
  width: 100%;
  height: 100%;
  display: block;
}
</style>
</head>
<body>
<canvas id="viz"></canvas>

<script>
/**
 * Preview-first waveform overlay:
 * - Always shows a STATIC “screenshot style” waveform when idle (no WS audio).
 * - When WS audio arrives, switches to live waveform/bars.
 *
 * Params (optional):
 *  - ws=ws://127.0.0.1:8765
 *  - mode=wave|bars   (default wave)
 *  - bins=128         (default 128)
 *  - bg=0,0,0,0       (transparent)
 *  - stroke=124,248,255,0.95
 *  - fillA=124,248,255,0.22  (top fill)
 *  - fillB=124,248,255,0.04  (bottom fill)
 *  - glow=1|0         (default 1)
 *  - lineWidth=4
 *  - idleAfter=250
 *  - previewBg=1|0    (default 1)
 */

const canvas = document.getElementById("viz");
const ctx = canvas.getContext("2d", { alpha: true });

const params = new URLSearchParams(location.search);
const wsUrl = params.get("ws") || "ws://127.0.0.1:8765";
const mode = params.get("mode") || "wave";
const bins = clampInt(params.get("bins"), 128, 32, 512);

const lineWidth = clampFloat(params.get("lineWidth"), 4, 1, 16);
const idleAfter = clampInt(params.get("idleAfter"), 250, 0, 5000);
const previewBg = (params.get("previewBg") ?? "1") === "1";

const bg = parseRgba(params.get("bg"), "rgba(0,0,0,0)");
const stroke = parseRgba(params.get("stroke"), "rgba(124,248,255,0.95)");
const fillA = parseRgba(params.get("fillA"), "rgba(124,248,255,0.22)");
const fillB = parseRgba(params.get("fillB"), "rgba(124,248,255,0.04)");
const glowOn = (params.get("glow") ?? "1") === "1";

const state = {
  lastMessageAt: 0,
  liveWave: new Array(bins).fill(0),
  liveBins: new Array(bins).fill(0),
  targetWave: new Array(bins).fill(0),
  targetBins: new Array(bins).fill(0),
};

// Robust sizing (mobile preview safe)
resizeCanvas();
window.addEventListener("resize", resizeCanvas);
requestAnimationFrame(resizeCanvas);
new ResizeObserver(resizeCanvas).observe(document.documentElement);

// ---- WebSocket (optional) ----
try {
  const sock = new WebSocket(wsUrl);
  sock.addEventListener("message", (event) => {
    const payload = safeJson(event.data);
    if (!payload) return;
    state.lastMessageAt = Date.now();

    if (Array.isArray(payload.samples)) resampleTo(state.targetWave, payload.samples, -1, 1);
    if (Array.isArray(payload.bins)) resampleTo(state.targetBins, payload.bins, 0, 1);
  });
} catch (_e) {
  // totally fine — idle preview will show regardless
}

// Precompute a STATIC “screenshot waveform” once.
// This is the “it should look like a waveform even when idle” guarantee.
const idleWave = buildStaticWaveform(bins, 1337);  // seed makes it deterministic

// Draw loop
function frame() {
  if (canvas.width < 2 || canvas.height < 2) resizeCanvas();

  // background
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (bg !== "rgba(0,0,0,0)") {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else if (previewBg) {
    drawPreviewBackground();
  }

  const idle = (Date.now() - state.lastMessageAt) > idleAfter;

  if (idle) {
    // ✅ STATIC waveform “screenshot”
    drawWaveformShape(idleWave, { stroke, fillA, fillB, lineWidth, glowOn });
  } else {
    // live mode (simple smoothing)
    smoothTowards(state.liveWave, state.targetWave, 0.22, 0.92);
    smoothTowards(state.liveBins, state.targetBins, 0.22, 0.92);

    if (mode === "bars") {
      drawBars(state.liveBins, { stroke, fillA, fillB, lineWidth, glowOn });
    } else {
      drawWaveformShape(state.liveWave, { stroke, fillA, fillB, lineWidth, glowOn });
    }
  }

  requestAnimationFrame(frame);
}

frame();

/* ----------------- Rendering ----------------- */

function drawPreviewBackground() {
  const w = canvas.width, h = canvas.height;

  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "rgba(8,10,14,1)");
  g.addColorStop(1, "rgba(3,5,8,1)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // vignette
  const r = ctx.createRadialGradient(w*0.5, h*0.55, h*0.15, w*0.5, h*0.55, h*0.95);
  r.addColorStop(0, "rgba(0,0,0,0)");
  r.addColorStop(1, "rgba(0,0,0,0.60)");
  ctx.fillStyle = r;
  ctx.fillRect(0, 0, w, h);
}

function drawWaveformShape(samples, opt) {
  const w = canvas.width, h = canvas.height;
  const mid = h / 2;

  const amp = mid * 0.72;               // BIG — can’t be “invisible”
  const padX = Math.floor(w * 0.06);    // keep it off edges
  const innerW = w - padX * 2;

  // Gradient fill between top and bottom waveform
  const fill = ctx.createLinearGradient(0, mid - amp, 0, mid + amp);
  fill.addColorStop(0, opt.fillA);
  fill.addColorStop(1, opt.fillB);

  ctx.save();

  // Glow
  if (opt.glowOn) {
    ctx.shadowBlur = Math.max(10, Math.floor(Math.min(w,h) * 0.03));
    ctx.shadowColor = opt.stroke;
  }

  // Filled mirrored shape
  ctx.beginPath();

  // top line
  for (let i = 0; i < samples.length; i++) {
    const t = i / (samples.length - 1);
    const x = padX + t * innerW;
    const y = mid - samples[i] * amp;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  // bottom line reversed
  for (let i = samples.length - 1; i >= 0; i--) {
    const t = i / (samples.length - 1);
    const x = padX + t * innerW;
    const y = mid + samples[i] * amp;
    ctx.lineTo(x, y);
  }

  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.globalAlpha = 1.0;
  ctx.fill();

  // Stroke on top + bottom edges (classic waveform outline)
  ctx.shadowBlur = opt.glowOn ? ctx.shadowBlur : 0;
  ctx.strokeStyle = opt.stroke;
  ctx.lineWidth = opt.lineWidth;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  // top stroke
  ctx.beginPath();
  for (let i = 0; i < samples.length; i++) {
    const t = i / (samples.length - 1);
    const x = padX + t * innerW;
    const y = mid - samples[i] * amp;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // bottom stroke
  ctx.beginPath();
  for (let i = 0; i < samples.length; i++) {
    const t = i / (samples.length - 1);
    const x = padX + t * innerW;
    const y = mid + samples[i] * amp;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // faint center line
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fillRect(padX, Math.floor(mid) - 1, innerW, 2);

  ctx.restore();
}

function drawBars(bins, opt) {
  const w = canvas.width, h = canvas.height;
  const padX = Math.floor(w * 0.06);
  const innerW = w - padX * 2;
  const barW = innerW / bins.length;

  const fill = ctx.createLinearGradient(0, 0, 0, h);
  fill.addColorStop(0, opt.fillA);
  fill.addColorStop(1, opt.fillB);

  ctx.save();
  if (opt.glowOn) {
    ctx.shadowBlur = Math.max(10, Math.floor(Math.min(w,h) * 0.03));
    ctx.shadowColor = opt.stroke;
  }

  for (let i = 0; i < bins.length; i++) {
    const v = clampFloat(bins[i], 0, 0, 1);
    const bh = v * h * 0.75;
    const x = padX + i * barW;
    const y = h - bh;

    ctx.fillStyle = fill;
    ctx.fillRect(x, y, Math.max(1, barW - 2), bh);

    ctx.shadowBlur = 0;
    ctx.strokeStyle = opt.stroke;
    ctx.lineWidth = Math.max(1.5, opt.lineWidth * 0.6);
    ctx.strokeRect(x, y, Math.max(1, barW - 2), bh);
    if (opt.glowOn) {
      ctx.shadowBlur = Math.max(10, Math.floor(Math.min(w,h) * 0.03));
    }
  }

  ctx.restore();
}

/* ----------------- Data helpers ----------------- */

function buildStaticWaveform(n, seed) {
  // Deterministic pseudo-random for “screenshot look”
  const rnd = mulberry32(seed);

  const arr = new Array(n);
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const x = (t - 0.5);

    // Strong center envelope like real dialogue/music
    const env = Math.exp(-Math.pow(x * 2.1, 2));

    // Multi-harmonic shape + a little randomness
    const a =
      Math.sin(t * Math.PI * 2.0) * 0.55 +
      Math.sin(t * Math.PI * 6.0) * 0.25 +
      Math.sin(t * Math.PI * 12.0) * 0.12;

    const noise = (rnd() - 0.5) * 0.18;

    // Always non-zero, always looks like a waveform
    const val = (a + noise) * (0.25 + env * 0.95);

    arr[i] = clampFloat(Math.abs(val), 0.05, 0, 1); // mirrored waveform expects positive magnitude
  }

  // Smooth it so it looks like a DAW render
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 1; i < n - 1; i++) {
      arr[i] = (arr[i - 1] + arr[i] + arr[i + 1]) / 3;
    }
  }

  return arr;
}

function smoothTowards(cur, target, smooth, decay) {
  for (let i = 0; i < cur.length; i++) {
    const next = cur[i] + (target[i] - cur[i]) * smooth;
    cur[i] = Math.abs(next) < 0.0001 ? 0 : next;
    target[i] *= decay;
  }
}

function resampleTo(out, input, min, max) {
  if (!input || !input.length) return;
  for (let i = 0; i < out.length; i++) {
    const src = Math.floor((i / out.length) * input.length);
    const raw = Number(input[src]);
    if (Number.isNaN(raw)) continue;
    out[i] = clampFloat(raw, 0, min, max);
  }
}

function resizeCanvas() {
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  let w = Math.floor(rect.width);
  let h = Math.floor(rect.height);
  if (w < 2) w = window.innerWidth || 1280;
  if (h < 2) h = window.innerHeight || 720;
  canvas.width = Math.max(2, Math.floor(w * ratio));
  canvas.height = Math.max(2, Math.floor(h * ratio));
}

function safeJson(s) { try { return JSON.parse(s); } catch { return null; } }

function parseRgba(v, fallback) {
  if (!v) return fallback;
  const parts = v.split(",").map(p => Number(p.trim()));
  if (parts.length < 3 || parts.some(n => Number.isNaN(n))) return fallback;
  const [r,g,b,a=1] = parts;
  return `rgba(${clampFloat(r,0,0,255)}, ${clampFloat(g,0,0,255)}, ${clampFloat(b,0,0,255)}, ${clampFloat(a,1,0,1)})`;
}

function clampFloat(v, fb, min, max) {
  const n = Number(v);
  if (Number.isNaN(n)) return fb;
  return Math.min(max, Math.max(min, n));
}

function clampInt(v, fb, min, max) {
  const n = Number.parseInt(v, 10);
  if (Number.isNaN(n)) return fb;
  return Math.min(max, Math.max(min, n));
}

// Deterministic RNG
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
</script>
</body>
</html>
