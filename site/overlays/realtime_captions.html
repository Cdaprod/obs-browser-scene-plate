<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>realtime-captions</title>
<style>
:root{
  --caption-width: 88vw;
  --caption-bottom: 8vh;
  --caption-padding: 18px 22px;
  --caption-radius: 16px;
  --caption-bg: rgba(0, 0, 0, 0.4);
  --caption-fg: rgba(255, 255, 255, 0.96);
  --caption-shadow: 0 2px 20px rgba(0, 0, 0, 0.55);
  --caption-blur: 12px;
  --caption-size: 44px;
  --caption-line: 1.15;
  --caption-weight: 700;
  --fade-ms: 200;
}

html, body{
  margin: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
}

#caption{
  position: absolute;
  left: 50%;
  bottom: var(--caption-bottom);
  transform: translateX(-50%) translateY(12px);
  width: var(--caption-width);
  padding: var(--caption-padding);
  border-radius: var(--caption-radius);
  backdrop-filter: blur(var(--caption-blur));
  background: var(--caption-bg);
  color: var(--caption-fg);
  font: var(--caption-weight) var(--caption-size) / var(--caption-line) "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial;
  text-align: center;
  text-shadow: var(--caption-shadow);
  opacity: 0;
  transition: opacity calc(var(--fade-ms) * 1ms) linear, transform calc(var(--fade-ms) * 1ms) ease;
  white-space: pre-wrap;
  word-break: break-word;
}

#caption.on{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (prefers-reduced-motion: reduce){
  #caption{
    transition: none;
  }
}
</style>
</head>
<body>
<div id="caption" role="status" aria-live="polite"></div>

<script>
/**
 * realtime_captions.html
 *
 * Default URL (full params):
 *  http://<HOST_IP>:8789/overlays/realtime_captions.html?ws=ws://127.0.0.1:8770&size=48&width=88&hold=1800&fade=220&bg=0,0,0,0.4&fg=255,255,255,0.96&blur=12&weight=700&line=1.15&final=0
 *
 * WebSocket payloads:
 *  - {"type":"partial","text":"..."}
 *  - {"type":"final","text":"..."}
 *
 * Params:
 *  - ws: websocket URL for captions.
 *  - hold: time (ms) to keep captions visible after updates.
 *  - fade: fade transition duration (ms).
 *  - size: font size (px).
 *  - width: max width (vw).
 *  - bg/fg: rgba as r,g,b,a.
 *  - blur: backdrop blur (px).
 *  - weight: font weight.
 *  - line: line height.
 *  - final: set to 1 to show only final transcripts.
 *  - preview: optional text to render immediately for layout checks.
 */

const params = new URLSearchParams(window.location.search);
const wsUrl = params.get("ws") || "ws://127.0.0.1:8770";
const holdMs = clampInt(params.get("hold"), 1600, 400, 60000);
const fadeMs = clampInt(params.get("fade"), 200, 80, 2000);
const fontSize = clampInt(params.get("size"), 44, 18, 120);
const width = clampInt(params.get("width"), 88, 40, 100);
const blur = clampInt(params.get("blur"), 12, 0, 40);
const weight = clampInt(params.get("weight"), 700, 300, 900);
const lineHeight = clampFloat(params.get("line"), 1.15, 1, 1.6);
const finalOnly = params.get("final") === "1";
const previewText = params.get("preview");

const colors = {
  bg: parseRgba(params.get("bg"), "rgba(0, 0, 0, 0.4)"),
  fg: parseRgba(params.get("fg"), "rgba(255, 255, 255, 0.96)")
};

const caption = document.getElementById("caption");
let hideTimer = null;

applyStyles();

const socket = new WebSocket(wsUrl);

socket.addEventListener("message", (event) => {
  const payload = parseJson(event.data);
  if (!payload || typeof payload.text !== "string") {
    return;
  }

  if (finalOnly && payload.type !== "final") {
    return;
  }

  showCaption(payload.text);
});

socket.addEventListener("error", () => {
  console.warn("realtime_captions websocket error");
});

if (previewText) {
  showCaption(previewText);
}

function showCaption(text) {
  const cleaned = text.replace(/\s+/g, " ").trim();
  if (!cleaned) {
    return;
  }

  caption.textContent = cleaned;
  caption.classList.add("on");

  if (hideTimer) {
    window.clearTimeout(hideTimer);
  }

  hideTimer = window.setTimeout(() => {
    caption.classList.remove("on");
  }, holdMs);
}

function applyStyles() {
  const root = document.documentElement.style;
  root.setProperty("--caption-width", `${width}vw`);
  root.setProperty("--caption-bg", colors.bg);
  root.setProperty("--caption-fg", colors.fg);
  root.setProperty("--caption-blur", `${blur}px`);
  root.setProperty("--caption-size", `${fontSize}px`);
  root.setProperty("--caption-weight", weight);
  root.setProperty("--caption-line", lineHeight);
  root.setProperty("--fade-ms", fadeMs);
}

function parseJson(value) {
  try {
    return JSON.parse(value);
  } catch (error) {
    console.warn("realtime_captions invalid JSON", error);
    return null;
  }
}

function parseRgba(value, fallback) {
  if (!value) {
    return fallback;
  }
  const parts = value.split(",").map((part) => Number(part.trim()));
  if (parts.length < 3 || parts.some((part) => Number.isNaN(part))) {
    return fallback;
  }
  const [r, g, b, a = 1] = parts;
  return `rgba(${clampFloat(r, 0, 0, 255)}, ${clampFloat(g, 0, 0, 255)}, ${clampFloat(b, 0, 0, 255)}, ${clampFloat(a, 1, 0, 1)})`;
}

function clampFloat(value, fallback, min, max) {
  const number = Number(value);
  if (Number.isNaN(number)) {
    return fallback;
  }
  return Math.min(max, Math.max(min, number));
}

function clampInt(value, fallback, min, max) {
  const number = Number.parseInt(value, 10);
  if (Number.isNaN(number)) {
    return fallback;
  }
  return Math.min(max, Math.max(min, number));
}
</script>
</body>
</html>
