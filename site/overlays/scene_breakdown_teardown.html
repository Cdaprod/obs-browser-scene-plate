<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>scene-breakdown-teardown</title>

<style>
:root{
  --title: clamp(40px, 5.6vw, 96px);
  --line:  clamp(16px, 2.1vw, 28px);

  --stroke: rgba(0,0,0,0.9);
  --shadow: rgba(0,0,0,0.78);
  --glow: rgba(170,220,255,0.32);

  --in-ms: 260;
  --out-ms: 200;
  --hold-ms: 4200;
}

html,body{
  margin:0;
  height:100%;
  background: transparent !important;
  overflow:hidden;
}

#stage{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  pointer-events:none;
}

#wrap{
  text-align:center;
  opacity:0;
  transform: translateY(12px);
  transition:
    opacity calc(var(--in-ms)*1ms) ease,
    transform calc(var(--in-ms)*1ms) cubic-bezier(.2,.8,.2,1);
}

#title{
  font-family: Inter, system-ui, sans-serif;
  font-weight: 950;
  font-size: var(--title);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.98);

  text-shadow:
    0  4px 0 var(--stroke),
    0 -4px 0 var(--stroke),
    4px 0  0 var(--stroke),
   -4px 0  0 var(--stroke),
    4px 4px 0 var(--stroke),
   -4px 4px 0 var(--stroke),
    0 22px 46px var(--shadow),
    0 0 28px var(--glow);
}

#lines{
  margin-top: 14px;
  list-style:none;
  padding:0;
  display:grid;
  gap:10px;
}

.line{
  font-family:
    "Bradley Hand",
    "Marker Felt",
    "Segoe Script",
    cursive;
  font-size: var(--line);
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.92);
  text-shadow:
    0 2px 0 rgba(0,0,0,0.7),
    0 12px 22px rgba(0,0,0,0.6);
  opacity:0;
  transform: translateY(10px);
  transition: all 220ms ease;
}

body.on #wrap{
  opacity:1;
  transform: translateY(0);
}
body.on .line{
  opacity:1;
  transform: translateY(0);
}
</style>
</head>

<body>
<div id="stage">
  <div id="wrap">
    <div id="title">BREAKING IT DOWN</div>
    <ul id="lines">
      <li class="line">this build works</li>
      <li class="line">but it was never designed to scale</li>
      <li class="line">so we’re tearing it apart on purpose</li>
    </ul>
  </div>
</div>

<script>
const hold = 4200;
document.body.classList.add("on");
setTimeout(()=>document.body.classList.remove("on"), hold);
</script>
</body>
</html>
