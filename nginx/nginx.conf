worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream render_api {
        server render_api:8791;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        charset utf-8;

        # Landing page (your browser UI)
        location / {
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Auto-generated tree.json should never be cached
        location = /tree.json {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files /tree.json =404;
        }

        # Optional: raw directory listing
        location /browse/ {
            alias /usr/share/nginx/html/;

            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;

            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
        }

        # Render outputs (downloadable)
        location /renders/ {
            alias /renders/;

            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;

            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
        }

        # Project export artifacts (proxy to render-api)
        location /exports/ {
            proxy_pass http://render_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
