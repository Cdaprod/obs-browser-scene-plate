services:
  obs_plate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obs-plate
    restart: unless-stopped
    ports:
      - "8789:80"
    volumes:
      - ./site:/usr/share/nginx/html:rw
      - ./program-monitor:/usr/share/nginx/html/program-monitor:ro
      - ./lan-dashboard:/usr/share/nginx/html/lan-dashboard:ro
      - type: bind
        source: "${RENDERS_HOST_PATH:?RENDERS_HOST_PATH is required}"
        target: /renders

  renderer:
    build:
      context: ./render
      dockerfile: Dockerfile
    container_name: overlay-renderer
    depends_on:
      - obs_plate
    volumes:
      - type: bind
        source: "${RENDERS_HOST_PATH:?RENDERS_HOST_PATH is required}"
        target: /renders
    restart: "no"

  render_api:
    build:
      context: .
      dockerfile: render-api/Dockerfile
    container_name: overlay-render-api
    ports:
      - "8793:8791"
    environment:
      - RENDERS_DIR=/renders
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-http://localhost:8789}
      - RENDER_ORIGIN=${RENDER_ORIGIN:-http://obs_plate}
    volumes:
      - type: bind
        source: "${RENDERS_HOST_PATH:?RENDERS_HOST_PATH is required}"
        target: /renders
    restart: unless-stopped

  wall_api:
    build:
      context: ./wall-api
      dockerfile: Dockerfile
    container_name: wall-api
    ports:
      - "8795:8795"
    env_file:
      - ./wall-api/.env
    restart: unless-stopped
