services:
  obs_plate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obs-plate
    restart: unless-stopped
    ports:
      - "8789:80"
    volumes:
      - ./site:/usr/share/nginx/html:rw
      - type: bind
        source: "${RENDERS_HOST_PATH:-./renders}"
        target: /renders

  renderer:
    build:
      context: ./render
      dockerfile: Dockerfile
    container_name: overlay-renderer
    depends_on:
      - obs_plate
    volumes:
      - type: bind
        source: "${RENDERS_HOST_PATH:-./renders}"
        target: /renders
    restart: "no"

  render_api:
    build:
      context: .
      dockerfile: render-api/Dockerfile
    container_name: overlay-render-api
    ports:
      - "8793:8791"
    volumes:
      - type: bind
        source: "${RENDERS_HOST_PATH:-./renders}"
        target: /renders
    restart: unless-stopped

  wall_api:
    build:
      context: ./wall-api
      dockerfile: Dockerfile
    container_name: wall-api
    ports:
      - "8795:8795"
    env_file:
      - ./wall-api/.env
    restart: unless-stopped
