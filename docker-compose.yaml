services:
  obs_plate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obs-plate
    restart: unless-stopped

    # Expose on host IP:8789
    ports:
      - "8789:80"

    # Optional: live-edit your HTML without rebuilding
    # Keep it enabled while iterating; remove later if you prefer baked images.
    volumes:
      - ./site:/usr/share/nginx/html:ro